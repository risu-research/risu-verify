name: Public citywide selection rule reproduction
on:
  push:
    paths:
      - 'tools/public_citywide_selection_qa.py'
      - '.github/workflows/public-citywide-selection-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/public_citywide_selection_qa.py
