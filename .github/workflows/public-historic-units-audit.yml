name: Public historical dwelling-unit reconciliation
on:
  push:
    paths:
      - 'tools/public_historic_units_audit.py'
      - '.github/workflows/public-historic-units-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/public_historic_units_audit.py
