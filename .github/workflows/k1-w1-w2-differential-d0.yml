name: K1 W1-W2 Differential Qualification

on:
  push:
    branches:
      - k1-w2-differential
      - k1-w2-qualified
    paths:
      - 'kernel/k1_checker_w2.go'
      - 'tools/risu_kernel_k1_w1_w2_differential.py'
      - 'tools/risu_kernel_k1_w1_w2_generative_d1.py'
      - 'protocols/RISU_KERNEL_K1_W1_W2_DIFFERENTIAL_D0.json'
      - 'protocols/RISU_KERNEL_K1_W1_W2_GENERATIVE_D1.json'
      - 'kernel/k1_checker_w1.py'
      - 'protocols/RISU_KERNEL_K1_WIRE_W0.json'
      - 'schemas/RISU_KERNEL_K1_WIRE_W0.schema.json'
      - '.github/workflows/k1-w1-w2-differential-d0.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: '0'

jobs:
  independent-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Verify canonical source, vet, and compile independent Go checker W2
        run: |
          set -euo pipefail
          go version
          gofmt -d kernel/k1_checker_w2.go | tee /tmp/k1-w2-gofmt.diff
          test ! -s /tmp/k1-w2-gofmt.diff
          go vet kernel/k1_checker_w2.go
          go build -trimpath -o /tmp/risu-k1-w2 kernel/k1_checker_w2.go
      - name: Run static W1 vs W2 differential D0
        run: |
          python tools/risu_kernel_k1_w1_w2_differential.py \
            --w2 /tmp/risu-k1-w2 \
            --output /tmp/k1-w1-w2-d0.json
          python - <<'PY'
          import json
          x = json.load(open('/tmp/k1-w1-w2-d0.json', encoding='utf-8'))
          assert x['status'] == 'PASS'
          assert x['semantic_differential_equivalence'] == 'QUALIFIED'
          assert x['qualification_vector_count'] == 34
          assert x['qualification_disagreements'] == []
          assert x['oracle_failures'] == []
          assert x['independence_audit']['pass'] is True
          assert x['boundary_divergences'] == ['sentinel_proof_kind_schema_pattern']
          assert x['full_wire_parser_equivalence'] == 'NOT_QUALIFIED'
          print('K1 W1/W2 static semantic differential: PASS')
          print('classified fail-closed parser divergence:', x['boundary_divergences'])
          PY
      - name: Run seeded generative W1 vs W2 differential D1
        run: |
          python tools/risu_kernel_k1_w1_w2_generative_d1.py \
            --w2 /tmp/risu-k1-w2 \
            --output /tmp/k1-w1-w2-d1.json
          python - <<'PY'
          import json
          x = json.load(open('/tmp/k1-w1-w2-d1.json', encoding='utf-8'))
          assert x['status'] == 'PASS'
          assert x['seed_decimal'] == 1261524786
          assert x['trial_count'] == 64
          assert x['comparison_count'] == 384
          assert x['w1_w2_disagreements'] == []
          assert x['oracle_failures'] == []
          assert x['semantic_identity_failures'] == []
          assert x['all_comparisons_agree'] is True
          assert x['all_oracles_match'] is True
          assert x['claim_target_permutation_invariance'] is True
          print('K1 W1/W2 seeded generative differential: PASS')
          PY
