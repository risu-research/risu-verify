name: K1 B0 Observer One-Shot Gofmt

on:
  push:
    branches:
      - k1-implementation-binding-b0
    paths:
      - '.github/workflows/k1-b0-observer-gofmt-once.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: k1-implementation-binding-b0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Canonicalize independent observer only
        run: |
          set -euo pipefail
          before="$(git hash-object tools/risu_kernel_k1_binding_b0_observer.go)"
          gofmt -w tools/risu_kernel_k1_binding_b0_observer.go
          gofmt -d tools/risu_kernel_k1_binding_b0_observer.go | tee /tmp/gofmt-after.diff
          test ! -s /tmp/gofmt-after.diff
          after="$(git hash-object tools/risu_kernel_k1_binding_b0_observer.go)"
          echo "before_blob=$before"
          echo "after_blob=$after"
          if git diff --quiet -- tools/risu_kernel_k1_binding_b0_observer.go; then
            echo 'Observer already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/risu_kernel_k1_binding_b0_observer.go
          git commit -m 'Canonicalize independent B0 observer with gofmt'
          git push origin HEAD:k1-implementation-binding-b0
