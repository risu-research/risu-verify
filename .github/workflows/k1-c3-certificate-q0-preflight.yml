name: K1 C3 certificate Q0 candidate preflight

on:
  push:
    branches: [k1-closure-c3-certificate-q0]
    paths:
      - 'protocols/RISU_KERNEL_K1_MFST_C3_REFINEMENT_CERTIFICATE_Q0*.json'
      - 'kernel/k1_checker_w10_refinement_cert.py'
      - 'kernel/k1_checker_w11_refinement_cert.go'
      - 'tools/risu_kernel_k1_mfst_c3_cert_q0_preflight.py'
      - '.github/workflows/k1-c3-certificate-q0-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin exact Q0 candidate and frozen science
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object protocols/RISU_KERNEL_K1_MFST_C3_REFINEMENT_CERTIFICATE_Q0.json)" = "64983f71b4ad265361754148a553071ade21ca5f"
          test "$(git hash-object protocols/RISU_KERNEL_K1_MFST_C3_REFINEMENT_CERTIFICATE_Q0_AMENDMENT_001.json)" = "2d045ab6b380cf93a5e92ff825416abce69650d2"
          test "$(git hash-object kernel/k1_checker_w10_refinement_cert.py)" = "5eea6fa26bdb488d60743a4bf3470cd5bd28eab3"
          test "$(git hash-object kernel/k1_checker_w11_refinement_cert.go)" = "1434a9255d42ad9e9b8d57f9e1c1fa1d47c6a8a0"
          test "$(git hash-object tools/risu_kernel_k1_mfst_c3_cert_q0_preflight.py)" = "51ddd2149735c894d69de7804dc24b4ee126d95e"
          test "$(git hash-object kernel/k1_checker_w7.py)" = "c011532efbe9b6dcd6ae440705ce7b38c5dde93b"
          test "$(git hash-object kernel/k1_checker_w5.py)" = "cf08aff1ce9f9506df37d597c2fc348bfefd6331"
          test "$(git hash-object kernel/k1_checker_w6.go)" = "33464fe4132d6490b1a68cc71ef803d584e597f9"
      - name: Build frozen W8 and W6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cd kernel
          test -z "$(gofmt -d k1_w8_json.go k1_w8_model.go k1_w8_exec.go k1_checker_w8.go)"
          GO111MODULE=off CGO_ENABLED=0 go vet k1_w8_json.go k1_w8_model.go k1_w8_exec.go k1_checker_w8.go
          CGO_ENABLED=0 go build -o ../build/k1_checker_w8 k1_w8_json.go k1_w8_model.go k1_w8_exec.go k1_checker_w8.go
          cd ..
          GO111MODULE=off CGO_ENABLED=0 go vet kernel/k1_checker_w6.go
          CGO_ENABLED=0 go build -o build/k1_checker_w6 kernel/k1_checker_w6.go
      - name: Build exact W11 candidate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -d kernel/k1_checker_w11_refinement_cert.go)"
          GO111MODULE=off CGO_ENABLED=0 go vet kernel/k1_checker_w11_refinement_cert.go
          CGO_ENABLED=0 go build -o build/k1_checker_w11_refinement_cert kernel/k1_checker_w11_refinement_cert.go
      - name: Execute positive representation preflight
        run: python3 tools/risu_kernel_k1_mfst_c3_cert_q0_preflight.py
