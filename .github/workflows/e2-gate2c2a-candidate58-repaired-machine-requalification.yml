name: E2 Gate2C2a Candidate58 Repaired Machine Requalification

on:
  push:
    branches: [e2-development]
    paths:
      - ".github/workflows/e2-gate2c2a-candidate58-repaired-machine-requalification.yml"

permissions:
  contents: write

concurrency:
  group: e2-gate2c2a-candidate58-repaired-machine-requalification
  cancel-in-progress: false

env:
  EXPECTED_PARENT: f3ff41553fba02a942485ca9b3398531e05aec92
  REQUAL_PROTOCOL: protocols/RISU_DIFF_E2_GATE2C2A_CANDIDATE58_REPAIRED_MACHINE_REQUALIFICATION_PROTOCOL_v0.1.json
  REQUAL_PROTOCOL_BLOB: 2b81dd6b37091a2a31ccd63483dbfa52ced29585
  GATE2C1_FREEZE: protocols/RISU_DIFF_E2_GATE2C1_IMPLEMENTATION_FREEZE_v0.1.json
  GATE2C1_FREEZE_BLOB: cf5da37f0c208a45f07cbf24949396057e2f51cd
  ORIGINAL_EXEC_PROTOCOL: protocols/RISU_DIFF_E2_CANDIDATE58_FIRST_SEMANTIC_EXECUTION_PROTOCOL_v0.1.json
  ORIGINAL_GATE1B1C_FREEZE: protocols/RISU_DIFF_E2_GATE1B1C_IMPLEMENTATION_FREEZE_v0.1.json

jobs:
  repaired-machine-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact repaired requalification revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.5"

      - name: Set up historically qualified Go runtime
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.2"

      - name: Preflight exact repaired and unchanged authorities before source read
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/e2-gate2c2a-candidate58-repaired-machine-requalification.yml"
          test "$(git hash-object "$REQUAL_PROTOCOL")" = "$REQUAL_PROTOCOL_BLOB"
          test "$(git hash-object "$GATE2C1_FREEZE")" = "$GATE2C1_FREEZE_BLOB"

          test "$(git hash-object "$ORIGINAL_EXEC_PROTOCOL")" = "08fdbcf517feafc159f229460eb7d82947a0c71b"
          test "$(git hash-object protocols/RISU_DIFF_E2_CANDIDATE58_HARNESS_IMPLEMENTATION_FREEZE_v0.1.json)" = "2b681ecec8fa052d87a2ce3adcab1e20e1c5ba8a"
          test "$(git hash-object "$ORIGINAL_GATE1B1C_FREEZE")" = "24724a44a7a200e7f069e4e62b5ee16df673dcf2"
          test "$(git hash-object risu_e2_semantic/candidate58_harness.py)" = "4b317fd0afd9e41b92df5f6319af3096063f8143"
          test "$(git hash-object tools/e2_candidate58_stage_sources.py)" = "da0143b9126a4e506016baa2126c70ae5eb8607c"
          test "$(git hash-object tools/e2_candidate58_prepare_execution.py)" = "cdbe7c7c86fa10e34e83b90700cabc433a29349e"
          test "$(git hash-object tools/e2_candidate58_execution_harness_v2.py)" = "38a5e9d93b058ea106ca494701e2400b382891d5"
          test "$(git hash-object tools/e2_go_ir_extract.go)" = "26e752029d1b4a99b47f1c7024740b7b0ae14ef7"

          test "$(git hash-object risu_e2/observability_overlay.py)" = "6508ce30c2a19ccc864665935f4d4b77a9fb8bbd"
          test "$(git hash-object risu_e2_semantic/adapter_support.py)" = "b4ab1a323d611e18b98fddf627e851aca393b8ce"
          test "$(git hash-object risu_e2_semantic/primary_adapter.py)" = "acbed84babffb886b06bbf3485f4f084f650da56"
          test "$(git hash-object risu_e2_semantic/kernel.py)" = "e91e51397f4cc201452b1a0f80d130265dca2ea0"
          test "$(git hash-object risu_e2_semantic/certificate.py)" = "0006f4134f130fe1c3d8305f8f007d09b08ffc65"
          test "$(git hash-object risu_e2_semantic/closed_read_set.py)" = "5d98c4708e2bcab376d9fc67f660809c93c6e499"
          test "$(git hash-object risu_e2_c1/rechecker.py)" = "ec7e782c88fb8786eb5b3d267e44d81885707728"
          test "$(git hash-object risu_e2_c1/semantics.py)" = "17d7d614130897abdebf85a3fb0cda3b9d59574b"

          test "$(git hash-object protocols/RISU_DIFF_E2_CANONICAL_SEED_CONSEQUENCE_ANCHORS_v0.1.json)" = "ec8d8b287a80b87c815f0362be366be076d2b091"
          test "$(git hash-object experiments/risu-diff-e2/qualification/a3-a4/E2_A3_A4_CANONICAL_SEED_CONSEQUENCE_SIGNATURES_v0.1.json)" = "cfa7d78707599177afe690c3aad7faaa22cb1930"
          test "$(git hash-object experiments/risu-diff-e2/qualification/gate1b1c-canonical-bridge/E2_GATE1B1C_CANONICAL_EXECUTION_PROFILES.json)" = "02c6e01d1a86167a15823cf14b61bfa37212d700"
          test "$(git hash-object experiments/risu-diff-e2/qualification/gate1b1c-canonical-bridge/E2_GATE1B1C_DECLARED_FINITE_WORLDS.json)" = "24547f8e88c670fcb1b6e3d2f4d971634198fb90"
          test "$(git hash-object experiments/risu-diff-e2/qualification/anchor-transport/admission/E2_SANITIZED_OPAQUE_58_ADMISSION_MANIFEST.json)" = "f2fc78439d4bfadce5941bf71aadd15ec292bcb1"
          test "$(git rev-parse HEAD:experiments/risu-diff-e2/qualification/materialized/cells)" = "34a30574c7420728bff57958c815194979a622ab"

          echo "847d85c2274cd6b94a83eefe0f6153a8fb183dbad758efa75118a4fd368623e4  experiments/risu-diff-e2/qualification/anchor-transport/admission/E2_SANITIZED_OPAQUE_58_ADMISSION_MANIFEST.json" | sha256sum -c -
          echo "78c5f024c1af7a353844120879d3ec4487b5f56fb443bc6e063530f836a9f74c  experiments/risu-diff-e2/qualification/anchor-transport/blind58/E2_BLIND_58_ANCHOR_TRANSPORT_BUNDLE.json" | sha256sum -c -
          echo "7a652a508d53960dc0fcdb8860b9d358165f6a6c96b050e6b962edccc2a4549f  experiments/risu-diff-e2/qualification/a3-a4/E2_A3_A4_CANONICAL_SEED_CONSEQUENCE_SIGNATURES_v0.1.json" | sha256sum -c -
          echo "ab6cefe49670cb41213b924907d5170b0ce20b81cd14abe657701371d00b0d2b  experiments/risu-diff-e2/qualification/gate1b1c-canonical-bridge/E2_GATE1B1C_CANONICAL_EXECUTION_PROFILES.json" | sha256sum -c -
          echo "1254c3dfda6c69a51dd7b923c290287119d9a265e6896b57c00929c2dbdd0c80  experiments/risu-diff-e2/qualification/gate1b1c-canonical-bridge/E2_GATE1B1C_DECLARED_FINITE_WORLDS.json" | sha256sum -c -

          python - <<'PY'
          import json,platform,subprocess
          from pathlib import Path
          p=json.loads(Path('protocols/RISU_DIFF_E2_GATE2C2A_CANDIDATE58_REPAIRED_MACHINE_REQUALIFICATION_PROTOCOL_v0.1.json').read_text())
          assert p['status']=='PROSPECTIVE_SEALED_NOT_EXECUTED'
          assert p['population_lock']['case_drop_reselection_substitution_allowed'] is False
          assert p['scientific_firewall']['truth_or_gold_read_before_machine_freeze'] is False
          assert platform.python_implementation()=='CPython' and platform.python_version()=='3.13.5'
          gv=subprocess.check_output(['go','version'],text=True).strip(); assert 'go1.23.2' in gv,gv
          print('GATE2C2A_PRE_SOURCE_AUTHORITY_PREFLIGHT=PASS')
          PY

      - name: Build truth-free repaired capsule and stage exact opaque 58 source bytes
        shell: bash
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/c58-repaired"
          mkdir -p "$S/input" "$S/tools" "$S/candidates" "$S/prepared" "$S/replay1" "$S/replay2"
          cp "$REQUAL_PROTOCOL" "$S/input/gate2c2a-protocol.json"
          cp "$GATE2C1_FREEZE" "$S/input/gate2c1-implementation-freeze.json"
          cp "$ORIGINAL_EXEC_PROTOCOL" "$S/input/execution-protocol.json"
          cp "$ORIGINAL_GATE1B1C_FREEZE" "$S/input/gate1b1c-implementation-freeze.json"
          cp protocols/RISU_DIFF_E2_CANONICAL_SEED_CONSEQUENCE_ANCHORS_v0.1.json "$S/input/anchor-bundle.json"
          cp experiments/risu-diff-e2/qualification/anchor-transport/admission/E2_SANITIZED_OPAQUE_58_ADMISSION_MANIFEST.json "$S/input/admission.json"
          cp experiments/risu-diff-e2/qualification/anchor-transport/blind58/E2_BLIND_58_ANCHOR_TRANSPORT_BUNDLE.json "$S/input/blind-transport.json"
          cp experiments/risu-diff-e2/qualification/a3-a4/E2_A3_A4_CANONICAL_SEED_CONSEQUENCE_SIGNATURES_v0.1.json "$S/input/signatures.json"
          cp experiments/risu-diff-e2/qualification/gate1b1c-canonical-bridge/E2_GATE1B1C_CANONICAL_EXECUTION_PROFILES.json "$S/input/profiles.json"
          cp experiments/risu-diff-e2/qualification/gate1b1c-canonical-bridge/E2_GATE1B1C_DECLARED_FINITE_WORLDS.json "$S/input/worlds.json"
          cp tools/e2_go_ir_extract.go "$S/tools/e2_go_ir_extract.go"

          find experiments/risu-diff-e2/qualification -type f \( -name '*.json' -o -name '*.jsonl' \) -exec chmod 000 {} +
          python tools/e2_candidate58_stage_sources.py \
            --manifest "$S/input/admission.json" \
            --cells-dir experiments/risu-diff-e2/qualification/materialized/cells \
            --output-dir "$S/candidates" \
            --receipt "$S/staging_receipt.json"
          test "$(find "$S/candidates" -type f | wc -l)" -eq 58
          find experiments/risu-diff-e2/qualification -type f -exec chmod 000 {} +
          chmod 000 experiments/risu-diff-e2/qualification/materialized/cells
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=Path(os.environ['RUNNER_TEMP'])/'c58-repaired'; r=json.loads((s/'staging_receipt.json').read_text())
          assert r['status']=='PASS' and r['case_count']==58 and r['source_file_count_read']==58
          assert r['cell_json_read'] is False and r['mutation_truth_read'] is False
          assert r['expected_e2_prediction_read'] is False and r['mutation_operator_metadata_read'] is False
          print('GATE2C2A_OPAQUE_SOURCE_STAGING=PASS')
          PY

      - name: Prepare repaired A2 D1 D2 D3 evidence and close runtime read policy
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/c58-repaired"
          python tools/e2_candidate58_prepare_execution.py \
            --capsule-root "$S" \
            --candidate-dir "$S/candidates" \
            --output-root "$S/prepared" \
            --execution-protocol-path input/execution-protocol.json \
            --implementation-freeze-path input/gate1b1c-implementation-freeze.json \
            --admission-manifest-path input/admission.json \
            --blind-transport-path input/blind-transport.json \
            --anchor-bundle-path input/anchor-bundle.json \
            --signature-bundle-path input/signatures.json \
            --profile-bundle-path input/profiles.json \
            --world-bundle-path input/worlds.json \
            --go-helper tools/e2_go_ir_extract.go
          test -s "$S/prepared/prepared_execution_plan.json"
          test -s "$S/prepared/preparation_receipt.json"
          test -s "$S/prepared/closed_read_policy.json"

      - name: Execute repaired machine-only replay one
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/c58-repaired"; P_SHA="$(sha256sum "$S/prepared/closed_read_policy.json" | awk '{print $1}')"
          python tools/e2_candidate58_execution_harness_v2.py \
            --capsule-root "$S" \
            --read-policy "$S/prepared/closed_read_policy.json" \
            --read-policy-sha256 "$P_SHA" \
            --plan-path prepared/prepared_execution_plan.json \
            --preparation-receipt-path prepared/preparation_receipt.json \
            --execution-protocol-path input/execution-protocol.json \
            --implementation-freeze-path input/gate1b1c-implementation-freeze.json \
            --admission-manifest-path input/admission.json \
            --blind-transport-path input/blind-transport.json \
            --signature-bundle-path input/signatures.json \
            --profile-bundle-path input/profiles.json \
            --world-bundle-path input/worlds.json \
            --output-dir "$S/replay1"
          (cd "$S/replay1" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$S/replay1.logical-tree.sha256"

      - name: Execute mandatory repaired machine-only replay two
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/c58-repaired"; P_SHA="$(sha256sum "$S/prepared/closed_read_policy.json" | awk '{print $1}')"
          python tools/e2_candidate58_execution_harness_v2.py \
            --capsule-root "$S" \
            --read-policy "$S/prepared/closed_read_policy.json" \
            --read-policy-sha256 "$P_SHA" \
            --plan-path prepared/prepared_execution_plan.json \
            --preparation-receipt-path prepared/preparation_receipt.json \
            --execution-protocol-path input/execution-protocol.json \
            --implementation-freeze-path input/gate1b1c-implementation-freeze.json \
            --admission-manifest-path input/admission.json \
            --blind-transport-path input/blind-transport.json \
            --signature-bundle-path input/signatures.json \
            --profile-bundle-path input/profiles.json \
            --world-bundle-path input/worlds.json \
            --output-dir "$S/replay2"
          (cd "$S/replay2" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$S/replay2.logical-tree.sha256"

      - name: Require exact repaired replay identity and machine-only invariants
        shell: bash
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/c58-repaired"
          cmp "$S/replay1.logical-tree.sha256" "$S/replay2.logical-tree.sha256"
          diff -qr "$S/replay1" "$S/replay2"
          python - <<'PY'
          import hashlib,json,os,platform
          from pathlib import Path
          s=Path(os.environ['RUNNER_TEMP'])/'c58-repaired'
          h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          m=json.loads((s/'replay1/E2_CANDIDATE58_MACHINE_PREDICTION_MATRIX.json').read_text())
          r1=json.loads((s/'replay1/E2_CANDIDATE58_EXECUTION_RECEIPT.json').read_text())
          r2=json.loads((s/'replay2/E2_CANDIDATE58_EXECUTION_RECEIPT.json').read_text())
          assert m['case_count']==r1['case_count']==r2['case_count']==58
          assert r1['status']==r2['status']=='MACHINE_ONLY_COMPLETE_NOT_GOLD_JOINED'
          for r in (r1,r2):
              f=r['scientific_firewall']; assert f['candidate_truth_or_gold_read'] is False
              assert f['expected_e2_prediction_read'] is False and f['mutation_operator_metadata_read'] is False
              assert f['epistemic10_read'] is False and f['fresh_heldout_read'] is False and f['truth_join_executed'] is False
          definitive={'E2_PREDICTED_REGRESSION_WITNESS','E2_PREDICTED_PRESERVATION_EVIDENCE'}
          for row in m['cases']:
              if row['machine_prediction'] in definitive:
                  assert row['c1_checker_output']=='VALID_C1', row['case_id']
          out={
            'schema':'risu.e2-gate2c2a-repaired-machine-run-local-receipt/v0.1',
            'status':'FIRST_COMPLETE_REPAIRED_MACHINE_ONLY_TWO_REPLAY_IDENTICAL_NOT_REPOSITORY_FROZEN',
            'case_count':58,
            'requalification_protocol_git_blob':os.environ['REQUAL_PROTOCOL_BLOB'],
            'gate2c1_implementation_freeze_git_blob':os.environ['GATE2C1_FREEZE_BLOB'],
            'repaired_semantic_blobs':{'observability_overlay':'6508ce30c2a19ccc864665935f4d4b77a9fb8bbd','adapter_support':'b4ab1a323d611e18b98fddf627e851aca393b8ce','primary_adapter':'acbed84babffb886b06bbf3485f4f084f650da56'},
            'machine_matrix_sha256':h(s/'replay1/E2_CANDIDATE58_MACHINE_PREDICTION_MATRIX.json'),
            'execution_receipt_sha256':h(s/'replay1/E2_CANDIDATE58_EXECUTION_RECEIPT.json'),
            'preparation_plan_sha256':h(s/'prepared/prepared_execution_plan.json'),
            'preparation_receipt_sha256':h(s/'prepared/preparation_receipt.json'),
            'closed_read_policy_sha256':h(s/'prepared/closed_read_policy.json'),
            'staging_receipt_sha256':h(s/'staging_receipt.json'),
            'replay_logical_tree_manifest_sha256':h(s/'replay1.logical-tree.sha256'),
            'two_replay_logical_byte_identity':True,
            'python_runtime':platform.python_version(),'go_runtime':'go1.23.2',
            'github_run_id':os.environ['GITHUB_RUN_ID'],'github_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'truth_join_executed':False,'truth_or_gold_read':False,'epistemic10_read':False,'fresh_heldout_read':False,
            'original_candidate58_first_complete_replaced':False,
          }
          (s/'E2_GATE2C2A_REPAIRED_MACHINE_RUN_LOCAL_RECEIPT.json').write_text(json.dumps(out,sort_keys=True,separators=(',',':'))+'\n')
          print('GATE2C2A_REPAIRED_MACHINE_DUAL_REPLAY=PASS')
          PY

      - name: Prepare complete dual replay artifact payload
        shell: bash
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/c58-repaired"; A="$RUNNER_TEMP/gate2c2a-artifact"
          mkdir -p "$A"
          cp -a "$S/replay1" "$A/replay1"
          cp -a "$S/replay2" "$A/replay2"
          cp "$S/replay1.logical-tree.sha256" "$A/"
          cp "$S/replay2.logical-tree.sha256" "$A/"
          cp "$S/staging_receipt.json" "$A/"
          cp -a "$S/prepared" "$A/prepared"
          cp "$S/E2_GATE2C2A_REPAIRED_MACHINE_RUN_LOCAL_RECEIPT.json" "$A/"
          cp "$S/input/gate2c2a-protocol.json" "$A/"
          cp "$S/input/gate2c1-implementation-freeze.json" "$A/"

      - name: Upload complete repaired dual replay before repository freeze
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-gate2c2a-candidate58-repaired-machine-first-complete
          path: ${{ runner.temp }}/gate2c2a-artifact
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Materialize exact additive repository freeze payload
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/c58-repaired"
          R="experiments/risu-diff-e2/qualification/candidate58/gate2c2a-repaired-machine-requalification/first-complete"
          test ! -e "$R"
          mkdir -p "$R"
          cp "$S/replay1/E2_CANDIDATE58_MACHINE_PREDICTION_MATRIX.json" "$R/E2_GATE2C2A_REPAIRED_MACHINE_PREDICTION_MATRIX.json"
          cp "$S/replay1/E2_CANDIDATE58_EXECUTION_RECEIPT.json" "$R/E2_GATE2C2A_REPAIRED_EXECUTION_RECEIPT.json"
          cp "$S/prepared/prepared_execution_plan.json" "$R/E2_GATE2C2A_REPAIRED_PREPARATION_PLAN.json"
          cp "$S/prepared/preparation_receipt.json" "$R/E2_GATE2C2A_REPAIRED_PREPARATION_RECEIPT.json"
          cp "$S/prepared/closed_read_policy.json" "$R/E2_GATE2C2A_REPAIRED_CLOSED_READ_POLICY.json"
          cp "$S/staging_receipt.json" "$R/E2_GATE2C2A_REPAIRED_STAGING_RECEIPT.json"
          cp "$S/replay1.logical-tree.sha256" "$R/E2_GATE2C2A_REPAIRED_REPLAY_LOGICAL_TREE.sha256"
          cp "$S/E2_GATE2C2A_REPAIRED_MACHINE_RUN_LOCAL_RECEIPT.json" "$R/E2_GATE2C2A_REPAIRED_MACHINE_RUN_LOCAL_RECEIPT.json"
          export R
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path(os.environ['R']); h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          files={p.name:h(p) for p in sorted(r.iterdir()) if p.is_file()}
          out={
            'schema':'risu.e2-gate2c2a-repaired-machine-first-complete-immutable-freeze/v0.1',
            'status':'FIRST_COMPLETE_REPAIRED_CANDIDATE58_MACHINE_ONLY_IMMUTABLY_FROZEN_BY_CONTAINING_COMMIT',
            'case_count':58,
            'workflow_trigger_commit':os.environ['GITHUB_SHA'],'workflow_run_id':os.environ['GITHUB_RUN_ID'],
            'gate2c1_implementation_freeze_commit':'3ad22321808d6fe04155a276ff16009fb2c30c57',
            'requalification_protocol_git_blob':os.environ['REQUAL_PROTOCOL_BLOB'],
            'hosted_artifact':{'id':os.environ['ARTIFACT_ID'],'digest':os.environ['ARTIFACT_DIGEST'],'uploaded_before_repository_freeze':True},
            'frozen_files_sha256':files,
            'two_replay_logical_byte_identity':True,
            'machine_only_before_truth_join':True,
            'truth_or_gold_read':False,'expected_prediction_read':False,'mutation_operator_metadata_read':False,
            'epistemic10_read':False,'fresh_heldout_read':False,
            'original_candidate58_first_complete_replaced':False,
            'truth_join_allowed_only_additively_after_this_freeze':True,
          }
          (r/'E2_GATE2C2A_FIRST_COMPLETE_IMMUTABLE_FREEZE_RECEIPT.json').write_text(json.dumps(out,sort_keys=True,separators=(',',':'))+'\n')
          PY
          test "$(find "$R" -maxdepth 1 -type f | wc -l)" -eq 9

      - name: Commit and fast-forward push exact nine-file repaired machine freeze
        shell: bash
        run: |
          set -euo pipefail
          R="experiments/risu-diff-e2/qualification/candidate58/gate2c2a-repaired-machine-requalification/first-complete"
          git config user.name "RISU Evidence Freeze"
          git config user.email "risu-evidence-freeze@users.noreply.github.com"
          git add "$R"
          test "$(git diff --cached --name-only | wc -l)" -eq 9
          test -z "$(git diff --cached --name-only | grep -v '^experiments/risu-diff-e2/qualification/candidate58/gate2c2a-repaired-machine-requalification/first-complete/' || true)"
          git commit -m "Freeze repaired Candidate58 Gate2C2a machine requalification"
