name: E2 Candidate58 Gate2B4 Implementation Qualification

on:
  push:
    branches: [gate2b4-staging]
    paths:
      - ".github/workflows/e2-candidate58-gate2b4-implementation-qualification.yml"

permissions:
  contents: read

env:
  EXPECTED_PARENT: 6f2b699a49ecfbe23f1c7d87c611e7322e53367c
  PROTOCOL_PATH: protocols/RISU_DIFF_E2_CANDIDATE58_GATE2B4_COUNTERFACTUAL_OBLIGATION_SUFFICIENCY_PROTOCOL_v0.1.json
  ANALYZER_PATH: tools/e2_candidate58_gate2b4_counterfactual_obligation_sufficiency.py
  TEST_PATH: tests/test_e2_candidate58_gate2b4_counterfactual_obligation_sufficiency.py
  PROTOCOL_BLOB: bd5e896feb59a165e210e5c244c442a2bd7a2d9f
  ANALYZER_BLOB: 61f9eff43d3e21013aa62754e439bd3ef859b3a7
  TEST_BLOB: 5ea93304479079093616d465c96252486f9dccc6

jobs:
  synthetic-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact qualification revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 10
      - name: Prove prospective implementation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/e2-candidate58-gate2b4-implementation-qualification.yml"
          test "$(git hash-object "$PROTOCOL_PATH")" = "$PROTOCOL_BLOB"
          test "$(git hash-object "$ANALYZER_PATH")" = "$ANALYZER_BLOB"
          test "$(git hash-object "$TEST_PATH")" = "$TEST_BLOB"
          echo GATE2B4_SYNTHETIC_PREFLIGHT=PASS
      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.5"
      - name: Audit analyzer dependency surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,sys
          from pathlib import Path
          t=ast.parse(Path('tools/e2_candidate58_gate2b4_counterfactual_obligation_sufficiency.py').read_text())
          roots=[]
          for n in ast.walk(t):
              if isinstance(n,ast.Import): roots += [a.name.split('.',1)[0] for a in n.names]
              elif isinstance(n,ast.ImportFrom) and n.module: roots.append(n.module.split('.',1)[0])
          assert not [x for x in roots if x not in sys.stdlib_module_names and x!='__future__'], roots
          assert not [x for x in roots if x.startswith('risu')], roots
          print('GATE2B4_STDLIB_ONLY_AUDIT=PASS')
          PY
      - name: Execute synthetic fail-closed qualification twice
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$ANALYZER_PATH" "$TEST_PATH"
          python "$TEST_PATH" > "$RUNNER_TEMP/test1.txt" 2>&1
          python "$TEST_PATH" > "$RUNNER_TEMP/test2.txt" 2>&1
          cmp "$RUNNER_TEMP/test1.txt" "$RUNNER_TEMP/test2.txt"
          grep -q '^OK$' "$RUNNER_TEMP/test1.txt"
          echo GATE2B4_SYNTHETIC_DUAL_REPLAY=PASS
      - name: Materialize qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/gate2b4-qualification"
          mkdir -p "$OUT"
          python - <<'PY'
          import hashlib,json,os,platform,sys
          from pathlib import Path
          h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          r={
            'schema':'risu.e2-candidate58-gate2b4-implementation-qualification/v0.1',
            'status':'SYNTHETICALLY_QUALIFIED_NOT_REAL_EXECUTED',
            'workflow_run_id':os.environ['GITHUB_RUN_ID'],'workflow_sha':os.environ['GITHUB_SHA'],
            'python_version':platform.python_version(),
            'protocol_git_blob':os.environ['PROTOCOL_BLOB'],'analyzer_git_blob':os.environ['ANALYZER_BLOB'],'test_git_blob':os.environ['TEST_BLOB'],
            'analyzer_sha256':h(os.environ['ANALYZER_PATH']),'test_sha256':h(os.environ['TEST_PATH']),
            'synthetic_test_dual_replay_identical':True,
            'real_gate2b2_or_gate2b3_analyzer_execution':False,
            'semantic_engine_rerun':False,'truth_or_operator_read':False,'remediation':False,
          }
          Path(os.environ['OUT'],'E2_CANDIDATE58_GATE2B4_IMPLEMENTATION_QUALIFICATION_RECEIPT.json').write_text(json.dumps(r,sort_keys=True,separators=(',',':'))+'\n')
          PY
      - name: Upload qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-candidate58-gate2b4-implementation-qualification
          path: ${{ runner.temp }}/gate2b4-qualification/E2_CANDIDATE58_GATE2B4_IMPLEMENTATION_QUALIFICATION_RECEIPT.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
