name: RISU B25 independent no-human-review source and permissions verification only
on:
  push:
    branches:
      - qualification/p6b25-real-review-credential-isolation-20261112
    paths:
      - .github/workflows/p6b25-owner-human-reviewed-broker.yml
      - .github/workflows/p6b25-preapproval-readonly-audit.yml
      - benchmarks/p6b25/OWNER_PROPOSED_REQUEST.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  no-user-consent-no-write:
    name: No human approval exists; B25 privileged source is never executed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independently verify owner proposal remains unapproved and the owner-only fixture has not changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          python - <<'PY'
          import hashlib,json,yaml
          from pathlib import Path
          p=Path('benchmarks/p6b25/OWNER_PROPOSED_REQUEST.json')
          data=p.read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(data)).encode()+bytes([0])+data).hexdigest()
          assert blob=='c66e2630c0c4edf15ee467fb758f601de6370ede'
          proposal=json.loads(data)
          assert proposal['proposal_status']=='UNAPPROVED_UNTIL_GITHUB_ENVIRONMENT_REVIEW_EVENT'
          assert proposal['resource_path']=='benchmarks/p6b25/owner_only_resource.txt'
          assert proposal['review_environment']=='risu-b25-human-owner-approval'
          expected_pre='c84690efad2ac44fa96605a4d1b7c34efbff52de'
          assert proposal['expected_prior_git_blob']==expected_pre
          workflow=yaml.load(Path('.github/workflows/p6b25-owner-human-reviewed-broker.yml').read_text(),Loader=yaml.BaseLoader)
          assert list(workflow['on']['push']['paths'])==['benchmarks/p6b25/REQUEST_HUMAN_REVIEW.txt']
          jobs=workflow['jobs']
          assert jobs['untrusted-agent']['permissions']['contents']=='read'
          writer=jobs['human-reviewed-one-file-writer']
          assert writer['environment']['name']=='risu-b25-human-owner-approval'
          assert writer['permissions']['contents']=='write'
          assert writer['permissions']['actions']=='read'
          assert writer['needs']==['owner-proposal','untrusted-agent']
          assert 'actions/checkout' not in '\\n'.join(
              str(x) for x in writer['steps'])
          print('B25_OWNER_UNAPPROVED_PROPOSAL_AND_WRITE_ONLY_PROTECTED_ENV_JOB_STATIC_CHECK_PASS')
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/contents/benchmarks/p6b25/owner_only_resource.txt?ref=qualification/p6b25-real-review-credential-isolation-20261112" -q .sha)" = c84690efad2ac44fa96605a4d1b7c34efbff52de
      - name: Confirm this real Actions workflow run has NO manual GitHub deployment approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > .b25-actual-no-human-review.json
          python - <<'PY'
          import json
          from pathlib import Path
          arr=json.loads(Path('.b25-actual-no-human-review.json').read_text())
          assert type(arr) is list and len(arr)==0
          print('B25_ACTUAL_GITHUB_RUN_APPROVALS_EMPTY_NO_DIRECT_HUMAN_APPROVAL_NO_WRITE')
          PY
      - name: Actual external GitHub rejects direct unreviewed write with this separate read-only job credential
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,base64,json,urllib.request,urllib.error
          url=('https://api.github.com/repos/risu-research/risu-verify/contents/'
               'benchmarks/p6b25/BEFORE_HUMAN_APPROVAL_MUST_NOT_APPEAR.txt')
          p={'message':'B25 no human review, agent must not create a file',
             'content':base64.b64encode(b'benign-denied-b25\\n').decode(),
             'branch':'qualification/p6b25-real-review-credential-isolation-20261112'}
          req=urllib.request.Request(url,method='PUT',data=json.dumps(p).encode(),
             headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                      'Accept':'application/vnd.github+json',
                      'Content-Type':'application/json',
                      'User-Agent':'RISU-B25-explicit-unapproved-actual-403'})
          try:
            with urllib.request.urlopen(req,timeout=30) as response:status=response.status
          except urllib.error.HTTPError as e:status=e.code
          assert status in (401,403),status
          get=urllib.request.Request(url+'?ref=qualification/p6b25-real-review-credential-isolation-20261112',
             headers={'User-Agent':'RISU-B25-real-write-denial-audit'})
          try:
            with urllib.request.urlopen(get,timeout=30):raise AssertionError('UNAUTHORIZED_FILE_APPEARED')
          except urllib.error.HTTPError as e:assert e.code==404,e.code
          with open('.b25-actual-unreviewed-no-write-token-proof.json','w') as f:
             json.dump({'actual_external_github_put_http_status':status,
                        'actual_unauthorized_remote_file_exists':False,
                        'human_reviewer_approval_record_exists':False,
                        'credential_class':'GITHUB_ACTIONS_CONTENTS_READ_ONLY'},f)
          print('B25_REAL_PUBLIC_GITHUB_UNREVIEWED_JOB_DIRECT_WRITE_DENIED_403')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b25-independent-preapproval-source-and-no-human-review-evidence
          retention-days: 21
          path: |
            .b25-actual-no-human-review.json
            .b25-actual-unreviewed-no-write-token-proof.json
