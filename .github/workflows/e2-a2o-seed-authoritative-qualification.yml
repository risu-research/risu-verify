name: E2 A2O Seed Authoritative Qualification

on:
  push:
    branches:
      - e2-development
    paths:
      - "risu_e2/overlay_common.py"
      - "risu_e2/overlay_control.py"
      - "risu_e2/overlay_source.py"
      - "risu_e2/observability_overlay.py"
      - "tools/e2_a2o_seed_qualify.py"
      - "tools/e2_a2o_seed_independent_check.py"
      - "schemas/RISU_E2_OBSERVABILITY_OVERLAY_v0.1.schema.json"
      - "protocols/RISU_DIFF_E2_A2O_SEED_ONLY_QUALIFICATION_CONTRACT_v0.2.json"
      - ".github/workflows/e2-a2o-seed-authoritative-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoritative-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.2"

      - name: Compile authoritative qualification surface
        run: |
          set -euo pipefail
          python -m py_compile \
            risu_e2/overlay_common.py \
            risu_e2/overlay_control.py \
            risu_e2/overlay_source.py \
            risu_e2/observability_overlay.py \
            tools/e2_a2o_seed_qualify.py \
            tools/e2_a2o_seed_independent_check.py
          python -m json.tool protocols/RISU_DIFF_E2_A2O_SEED_ONLY_QUALIFICATION_CONTRACT_v0.2.json >/dev/null
          test "$(git hash-object risu_e2/model.py)" = "64baf95a4939f168881627830134b314a6ee6098"
          test "$(git hash-object risu_e2/ir.py)" = "d7edac40d4eeda86be74e5785bde3bfc28d4cf5e"

      - name: Produce seed overlays twice
        run: |
          set -euo pipefail
          mkdir -p primary1 primary2 independent1 independent2
          python tools/e2_a2o_seed_qualify.py \
            --overlay-output primary1/E2_A2O_SEED_OVERLAY_BUNDLE.json \
            --receipt-output primary1/E2_A2O_SEED_QUALIFICATION_RECEIPT.json \
            | tee primary1/summary.json
          python tools/e2_a2o_seed_qualify.py \
            --overlay-output primary2/E2_A2O_SEED_OVERLAY_BUNDLE.json \
            --receipt-output primary2/E2_A2O_SEED_QUALIFICATION_RECEIPT.json \
            | tee primary2/summary.json
          cmp primary1/E2_A2O_SEED_OVERLAY_BUNDLE.json primary2/E2_A2O_SEED_OVERLAY_BUNDLE.json
          cmp primary1/E2_A2O_SEED_QUALIFICATION_RECEIPT.json primary2/E2_A2O_SEED_QUALIFICATION_RECEIPT.json

      - name: Independently verify twice
        run: |
          set -euo pipefail
          python tools/e2_a2o_seed_independent_check.py \
            --overlay primary1/E2_A2O_SEED_OVERLAY_BUNDLE.json \
            --primary-receipt primary1/E2_A2O_SEED_QUALIFICATION_RECEIPT.json \
            --output independent1/E2_A2O_SEED_INDEPENDENT_CHECK_RECEIPT.json \
            | tee independent1/summary.json
          python tools/e2_a2o_seed_independent_check.py \
            --overlay primary1/E2_A2O_SEED_OVERLAY_BUNDLE.json \
            --primary-receipt primary1/E2_A2O_SEED_QUALIFICATION_RECEIPT.json \
            --output independent2/E2_A2O_SEED_INDEPENDENT_CHECK_RECEIPT.json \
            | tee independent2/summary.json
          cmp independent1/E2_A2O_SEED_INDEPENDENT_CHECK_RECEIPT.json independent2/E2_A2O_SEED_INDEPENDENT_CHECK_RECEIPT.json
          cp primary1/E2_A2O_SEED_OVERLAY_BUNDLE.json E2_A2O_SEED_OVERLAY_BUNDLE.json
          cp primary1/E2_A2O_SEED_QUALIFICATION_RECEIPT.json E2_A2O_SEED_QUALIFICATION_RECEIPT.json
          cp independent1/E2_A2O_SEED_INDEPENDENT_CHECK_RECEIPT.json E2_A2O_SEED_INDEPENDENT_CHECK_RECEIPT.json
          sha256sum E2_A2O_SEED_OVERLAY_BUNDLE.json E2_A2O_SEED_QUALIFICATION_RECEIPT.json E2_A2O_SEED_INDEPENDENT_CHECK_RECEIPT.json

      - name: Assert v0.2 authoritative gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("E2_A2O_SEED_QUALIFICATION_RECEIPT.json").read_text())
          r=json.loads(Path("E2_A2O_SEED_INDEPENDENT_CHECK_RECEIPT.json").read_text())
          assert p["status"] == "PASS"
          assert r["status"] == "PASS"
          assert not r["errors"]
          assert all(r["qualification_gates"].values())
          assert len(r["seed_rows"]) == 6
          assert len(r["control_witnesses"]) == 6
          assert len(r["mechanics_fixtures"]) == 9
          assert {x["language"] for x in r["mechanics_fixtures"]} == {"python","go","typescript_javascript"}
          assert {x["fixture_id"] for x in r["mechanics_fixtures"]} == {"D1_KILL","D1_JOIN","D1_REPRESENTATION_IDENTITY"}
          rs=r["read_set"]
          assert rs["materialized_mutant_cell_paths_read"] is False
          assert rs["mutation_truth_read"] is False
          assert rs["expected_e2_predictions_read"] is False
          assert rs["mutation_operator_metadata_read"] is False
          assert rs["fresh_target_bytes_read"] is False
          assert r["mutant_anchor_transport_authorized"] is False
          assert r["a3_a4_verdict_logic_authorized"] is False
          assert r["fresh_target_selection_authorized"] is False
          PY

      - name: Upload authoritative qualification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-a2o-seed-authoritative-qualification
          path: |
            E2_A2O_SEED_OVERLAY_BUNDLE.json
            E2_A2O_SEED_QUALIFICATION_RECEIPT.json
            E2_A2O_SEED_INDEPENDENT_CHECK_RECEIPT.json
            primary1/E2_A2O_SEED_OVERLAY_BUNDLE.json
            primary1/E2_A2O_SEED_QUALIFICATION_RECEIPT.json
            primary2/E2_A2O_SEED_OVERLAY_BUNDLE.json
            primary2/E2_A2O_SEED_QUALIFICATION_RECEIPT.json
            independent1/E2_A2O_SEED_INDEPENDENT_CHECK_RECEIPT.json
            independent2/E2_A2O_SEED_INDEPENDENT_CHECK_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
