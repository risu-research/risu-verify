name: E2 A3 A4 Candidate Observability Remediation v0.3 Prospective Qualification

on:
  push:
    paths:
      - 'risu_e2/frontend_js_v3.py'
      - 'risu_e2/ir_v3.py'
      - 'tools/e2_a3_a4_candidate_observability_remediation_v3_qualify.py'
      - 'tools/e2_a3_a4_candidate_observability_remediation_v3_independent.py'
      - '.github/workflows/e2-a3-a4-candidate-observability-remediation-v3-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prospective:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact qualification revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 16

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Verify prospective authorities and minimal scientific delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object protocols/RISU_DIFF_E2_A3_A4_CANDIDATE_OBSERVABILITY_REMEDIATION_v0.3.json)" = "64357f2671ad5bab89bc39dd78cb85374c494787"
          test "$(git hash-object experiments/risu-diff-e2/qualification/a3-a4/candidate-observability/remediation-v0.3/E2_A3_A4_CANDIDATE_OBSERVABILITY_REMEDIATION_V0_3_PROSPECTIVE_CORPUS.json)" = "0a930443990366a09671ddaa4e1fa63dbd658381"
          test "$(git hash-object experiments/risu-diff-e2/qualification/a3-a4/candidate-observability/remediation-v0.3/E2_A3_A4_CANDIDATE_OBSERVABILITY_REMEDIATION_V0_3_PREREGISTRATION_RECEIPT.json)" = "4e39406d827657a140e9d6262ea4a630c328c42a"

          test "$(git hash-object risu_e2/frontend_js_v2.py)" = "2fdf90b8c35c6c62c7f47d6b64f281f50c0852ce"
          test "$(git hash-object risu_e2/frontend_python_v2.py)" = "8b7e4d0e2bb9ef6487ef2b90d2390b55ced55ea9"
          test "$(git hash-object risu_e2/ir_v2.py)" = "a0676f228562fbf73a91d6449ab3af3a6783aa21"

          test "$(git hash-object risu_e2/frontend_js_v3.py)" = "13ffb1b149150b7e730591de7acf47e9322bdf02"
          test "$(git hash-object risu_e2/ir_v3.py)" = "1d95cfcb2e76563aa5d3ceb65815043eb8b2884a"
          test "$(git hash-object tools/e2_a3_a4_candidate_observability_remediation_v3_qualify.py)" = "f8775fbcb6d88f7a3c565433c71d7abed2eff479"
          test "$(git hash-object tools/e2_a3_a4_candidate_observability_remediation_v3_independent.py)" = "e5785ef7a359ef4bee9b3accc5b70fbfb4b8d640"
          test ! -e risu_e2/frontend_python_v3.py

          mapfile -t delta < <(git diff --name-only c2d0cc131f2209ac93596f9b7385aad3dd37d3a7 HEAD)
          test "${#delta[@]}" -eq 5
          for p in "${delta[@]}"; do
            case "$p" in
              risu_e2/frontend_js_v3.py|risu_e2/ir_v3.py|tools/e2_a3_a4_candidate_observability_remediation_v3_qualify.py|tools/e2_a3_a4_candidate_observability_remediation_v3_independent.py|.github/workflows/e2-a3-a4-candidate-observability-remediation-v3-qualification.yml) ;;
              *) echo "unauthorized v0.3 post-preregistration delta: $p"; exit 1 ;;
            esac
          done

          ! grep -E 'V3B|V3M|V2B|V2M|CQ_|JS_CALL_RESERVED_KEYWORD_PARENTHESIS_FALSE_POSITIVE|JS_OBJECT_SHORTHAND_RHS_IDENTIFIER_FALSE_POSITIVE' risu_e2/frontend_js_v3.py risu_e2/ir_v3.py

      - name: Compile separated versioned surface and checkers
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile risu_e2/frontend_js_v3.py risu_e2/ir_v3.py \
            tools/e2_a3_a4_candidate_observability_remediation_v3_qualify.py \
            tools/e2_a3_a4_candidate_observability_remediation_v3_independent.py
          ! grep -q 'e2_a3_a4_candidate_observability_remediation_v3_qualify' tools/e2_a3_a4_candidate_observability_remediation_v3_independent.py

      - name: Run sealed first complete v0.3 prospective qualification
        shell: bash
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/v0-3-prospective"
          mkdir -p "$S/risu_e2" "$S/tools" "$S/input" "$S/output"

          cp risu_e2/__init__.py "$S/risu_e2/"
          cp risu_e2/model.py "$S/risu_e2/"
          cp risu_e2/acquisition.py "$S/risu_e2/"
          cp risu_e2/frontend_go.py "$S/risu_e2/"
          # Pre-complete plumbing repair after run 34059236674: ir.py imports these
          # legacy modules at import time to expose Normalizer. Their scientific
          # bytes are not used as the v0.3 JS/Python extraction authorities.
          cp risu_e2/frontend_python.py "$S/risu_e2/"
          cp risu_e2/frontend_js.py "$S/risu_e2/"
          cp risu_e2/frontend_python_v2.py "$S/risu_e2/"
          cp risu_e2/frontend_js_v3.py "$S/risu_e2/"
          cp risu_e2/ir.py "$S/risu_e2/"
          cp risu_e2/ir_v3.py "$S/risu_e2/"
          cp risu_e2/overlay_common.py "$S/risu_e2/"
          cp risu_e2/overlay_control.py "$S/risu_e2/"
          cp tools/e2_a3_a4_candidate_observability_remediation_v3_qualify.py "$S/tools/primary.py"
          cp tools/e2_a3_a4_candidate_observability_remediation_v3_independent.py "$S/tools/independent.py"
          cp tools/e2_go_ir_extract.go "$S/tools/e2_go_ir_extract.go"
          cp protocols/RISU_DIFF_E2_A3_A4_CANDIDATE_OBSERVABILITY_REMEDIATION_v0.3.json "$S/input/protocol.json"
          cp experiments/risu-diff-e2/qualification/a3-a4/candidate-observability/remediation-v0.3/E2_A3_A4_CANDIDATE_OBSERVABILITY_REMEDIATION_V0_3_PROSPECTIVE_CORPUS.json "$S/input/corpus.json"

          test "$(find "$S" -type f | wc -l)" -eq 17
          ! find "$S" -type f -print | grep -E 'candidate.*58|blind.*58|frozen.*48|truth|operator|prediction'

          trap 'chmod u+rwx "$GITHUB_WORKSPACE" || true' EXIT
          chmod a-rwx "$GITHUB_WORKSPACE"
          cd "$S"
          export PYTHONPATH="$S"

          python tools/primary.py --protocol input/protocol.json --corpus input/corpus.json \
            --scientific-root "$S" --go-helper tools/e2_go_ir_extract.go --output output/primary-1.json
          python tools/primary.py --protocol input/protocol.json --corpus input/corpus.json \
            --scientific-root "$S" --go-helper tools/e2_go_ir_extract.go --output output/primary-2.json
          cmp output/primary-1.json output/primary-2.json

          python tools/independent.py --protocol input/protocol.json --corpus input/corpus.json \
            --scientific-root "$S" --output output/independent-1.json
          python tools/independent.py --protocol input/protocol.json --corpus input/corpus.json \
            --scientific-root "$S" --output output/independent-2.json
          cmp output/independent-1.json output/independent-2.json

          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=json.loads(Path("output/primary-1.json").read_bytes())
          i=json.loads(Path("output/independent-1.json").read_bytes())
          pm={r["fixture_id"]:(r["passed"],r["abstract_signature"]) for r in p["rows"]}
          im={r["fixture_id"]:(r["passed"],r["abstract_signature"]) for r in i["rows"]}
          doc={
            "schema":"risu.e2-a3-a4-candidate-observability-remediation-v0.3-cross-check/v0.1",
            "case_count":24,
            "same_fixture_set":sorted(pm)==sorted(im),
            "exact_per_case_and_signature_agreement":pm==im,
            "primary_status":p["status"],
            "independent_status":i["status"],
            "primary_variant_pair_failures":p["variant_pair_failures"],
            "independent_variant_pair_failures":i["variant_pair_failures"],
            "primary_sha256":hashlib.sha256(Path("output/primary-1.json").read_bytes()).hexdigest(),
            "independent_sha256":hashlib.sha256(Path("output/independent-1.json").read_bytes()).hexdigest(),
            "frozen_48_bytes_read":False,
            "candidate_58_bytes_read":False,
            "semantic_verdicts_emitted":False,
          }
          doc["status"]="PASS" if doc["same_fixture_set"] and doc["exact_per_case_and_signature_agreement"] else "FAIL"
          Path("output/cross-check.json").write_text(json.dumps(doc,sort_keys=True,separators=(",",":"))+"\n")
          print(json.dumps(doc,sort_keys=True,separators=(",",":")))
          PY

          chmod u+rwx "$GITHUB_WORKSPACE"
          cp output/primary-1.json "$GITHUB_WORKSPACE/E2_A3_A4_REMEDIATION_V0_3_PRIMARY.json"
          cp output/independent-1.json "$GITHUB_WORKSPACE/E2_A3_A4_REMEDIATION_V0_3_INDEPENDENT.json"
          cp output/cross-check.json "$GITHUB_WORKSPACE/E2_A3_A4_REMEDIATION_V0_3_CROSS_CHECK.json"

      - name: Upload first complete v0.3 prospective output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-a3-a4-remediation-v0-3-first-complete-prospective
          path: |
            E2_A3_A4_REMEDIATION_V0_3_PRIMARY.json
            E2_A3_A4_REMEDIATION_V0_3_INDEPENDENT.json
            E2_A3_A4_REMEDIATION_V0_3_CROSS_CHECK.json
          if-no-files-found: warn
          retention-days: 30

      - name: Assert gate only after artifact upload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open("E2_A3_A4_REMEDIATION_V0_3_PRIMARY.json"))
          i=json.load(open("E2_A3_A4_REMEDIATION_V0_3_INDEPENDENT.json"))
          c=json.load(open("E2_A3_A4_REMEDIATION_V0_3_CROSS_CHECK.json"))
          assert p["case_count"]==i["case_count"]==24
          assert p["passed_case_count"]==i["passed_case_count"]==24
          assert p["status"]==i["status"]==c["status"]=="PASS"
          assert not p["failed_fixture_ids"] and not i["failed_fixture_ids"]
          assert not p["variant_pair_failures"] and not i["variant_pair_failures"]
          assert p["specialization_scan"]["status"]==i["specialization_scan"]["status"]=="PASS"
          assert c["exact_per_case_and_signature_agreement"] is True
          assert p["read_set_attestation"]["frozen_48_bytes"] is False
          assert i["read_set_attestation"]["frozen_48_bytes"] is False
          assert p["read_set_attestation"]["candidate_58_bytes"] is False
          assert i["read_set_attestation"]["candidate_58_bytes"] is False
          PY
