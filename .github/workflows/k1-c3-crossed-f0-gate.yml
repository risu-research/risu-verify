name: K1 C3 crossed F0 gate

on:
  push:
    branches: [k1-closure-c3]
    paths:
      - 'kernel/k1_w8_cross_replay_driver.go'
      - 'tools/risu_kernel_k1_mfst_c3_crossed_gate.py'
      - '.github/workflows/k1-c3-crossed-f0-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossed-f0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin frozen C3, W7, W8, W5 and W6 inputs
        shell: bash
        run: |
          set -euo pipefail
          # Frozen C3 normative inputs / exact fixtures.
          test "$(git hash-object protocols/RISU_KERNEL_K1_MFST_C3_F0_FREEZE.json)" = "bb0b335d4a1a84087099afee9c5d60b1f5165d27"
          test "$(git hash-object protocols/RISU_KERNEL_K1_MFST_C3_PROFILE.json)" = "080a03f65e6602b5d36e07988d28b250c19620e8"
          test "$(git hash-object protocols/RISU_KERNEL_K1_MFST_C3_WIRE.json)" = "11896f05d1e3592228b973aaefaf13fd57f296c6"
          test "$(git hash-object protocols/RISU_KERNEL_K1_MFST_C3_AMENDMENT_001.json)" = "a4ecc1d98b46deb507466cc0efa56eec2f2b4c55"
          test "$(git hash-object protocols/RISU_KERNEL_K1_MEDIATION_REFINEMENT_C3_PROSPECTIVE.json)" = "adf5d9536546257f741f9916737990814af97214"
          test "$(git hash-object fixtures/k1_mfst_c3_f0/claim.json)" = "02fe5e2a56d8a9f2cd56316c57b18fb8c4912c88"
          test "$(git hash-object fixtures/k1_mfst_c3_f0/baseline.json)" = "3c4f386d0edef7cec56a0ff5eb7347924f84287e"
          echo 'f6b488c1e0ee8937e8695d9a38c9f00fd3f1c9d170f8265120f97bc1497bbd93  fixtures/k1_mfst_c3_f0/claim.json' | sha256sum -c -
          echo '2242114da4400ed5e91c5b4d68c1e2f0c451e63020882756b89b6b4234002581  fixtures/k1_mfst_c3_f0/baseline.json' | sha256sum -c -

          # Frozen W7 science implementation.
          test "$(git hash-object kernel/k1_w7_model.py)" = "3c351fd445b704d693e05ba01efe9cffa6a2801b"
          test "$(git hash-object kernel/k1_w7_exec.py)" = "8b1529dfbd8367e20776f0ab8ec3f5fa6559ca2a"
          test "$(git hash-object kernel/k1_checker_w7.py)" = "c011532efbe9b6dcd6ae440705ce7b38c5dde93b"

          # Frozen W8 science implementation.
          test "$(git hash-object kernel/k1_w8_json.go)" = "4e770c8ef7882b23705bb7068bd877c2cd9c3543"
          test "$(git hash-object kernel/k1_w8_model.go)" = "b53897a82255886d59b9dc05d7fbe8166aca1d35"
          test "$(git hash-object kernel/k1_w8_exec.go)" = "64254a8537d3777848b1d3f8176260c5a1c312e7"
          test "$(git hash-object kernel/k1_checker_w8.go)" = "f3e1e0c42e8106615b0aeeb2a85ceae3046e74a2"

          # Qualified C2 independent checkers.
          test "$(git hash-object kernel/k1_checker_w5.py)" = "cf08aff1ce9f9506df37d597c2fc348bfefd6331"
          test "$(git hash-object kernel/k1_checker_w6.go)" = "33464fe4132d6490b1a68cc71ef803d584e597f9"

          # New post-anchor crossed tooling is itself pinned for this gate revision.
          test "$(git hash-object kernel/k1_w8_cross_replay_driver.go)" = "f2b127e44af21d568bda19a641d3f2925bf93adb"
          test "$(git hash-object tools/risu_kernel_k1_mfst_c3_crossed_gate.py)" = "14d2a921db962352a5e5983c45d51f6280aeb75f"

      - name: Compile Python science components
        run: |
          python3 -m py_compile \
            kernel/k1_w7_model.py kernel/k1_w7_exec.py kernel/k1_checker_w7.py \
            kernel/k1_checker_w5.py tools/risu_kernel_k1_mfst_c3_crossed_gate.py

      - name: Verify and build frozen W8 and crossed replay driver
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -d kernel/k1_w8_json.go kernel/k1_w8_model.go kernel/k1_w8_exec.go kernel/k1_checker_w8.go kernel/k1_w8_cross_replay_driver.go)"
          mkdir -p build
          cd kernel
          GO111MODULE=off CGO_ENABLED=0 go vet k1_w8_json.go k1_w8_model.go k1_w8_exec.go k1_checker_w8.go
          CGO_ENABLED=0 go build -o ../build/k1_checker_w8 k1_w8_json.go k1_w8_model.go k1_w8_exec.go k1_checker_w8.go
          GO111MODULE=off CGO_ENABLED=0 go vet k1_w8_json.go k1_w8_model.go k1_w8_exec.go k1_w8_cross_replay_driver.go
          CGO_ENABLED=0 go build -o ../build/k1_w8_cross_replay k1_w8_json.go k1_w8_model.go k1_w8_exec.go k1_w8_cross_replay_driver.go

      - name: Verify and build qualified W6
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -d kernel/k1_checker_w6.go)"
          mkdir -p build
          GO111MODULE=off CGO_ENABLED=0 go vet kernel/k1_checker_w6.go
          CGO_ENABLED=0 go build -o build/k1_checker_w6 kernel/k1_checker_w6.go

      - name: Execute exact frozen 62-oracle crossed gate
        run: python3 tools/risu_kernel_k1_mfst_c3_crossed_gate.py
