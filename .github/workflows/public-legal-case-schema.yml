name: Public civil-case schema audit
on:
  push:
    paths:
      - 'tools/public_legal_case_schema.py'
      - '.github/workflows/public-legal-case-schema.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/public_legal_case_schema.py
