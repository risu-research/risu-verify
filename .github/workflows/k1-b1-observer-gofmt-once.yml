name: K1 B1 Observer Gofmt Once

on:
  push:
    branches:
      - k1-binding-b1
    paths:
      - '.github/workflows/k1-b1-observer-gofmt-once.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: k1-binding-b1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Canonicalize D2 observer only
        run: |
          set -euo pipefail
          gofmt -w tools/risu_kernel_k1_binding_b1_observer.go
          gofmt -d tools/risu_kernel_k1_binding_b1_observer.go | tee /tmp/after.diff
          test ! -s /tmp/after.diff
          git diff --check
          if git diff --quiet -- tools/risu_kernel_k1_binding_b1_observer.go; then
            echo 'Already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/risu_kernel_k1_binding_b1_observer.go
          git commit -m 'Canonicalize B1 D2 observer with gofmt'
          git push origin HEAD:k1-binding-b1
