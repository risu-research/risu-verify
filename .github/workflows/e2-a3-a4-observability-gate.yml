# Trigger-only refresh after initial workflow registration; no scientific logic changed.
name: E2 A3-A4 Observability Gate

on:
  push:
    branches:
      - e2-development
    paths:
      - "tools/e2_a3_a4_observability_gate.py"
      - "protocols/RISU_DIFF_E2_A3_A4_OBSERVABILITY_GATE_v0.1.json"
      - ".github/workflows/e2-a3-a4-observability-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.2"

      - name: Compile audit surface
        run: |
          set -euo pipefail
          python -m py_compile risu_e2/*.py tools/e2_a3_a4_observability_gate.py
          test -z "$(gofmt -d tools/e2_go_ir_extract.go)"

      - name: Execute 58-cell observability audit twice
        run: |
          set -euo pipefail
          python tools/e2_a3_a4_observability_gate.py > E2_A3_A4_OBSERVABILITY_ATTEMPT_1.json
          python tools/e2_a3_a4_observability_gate.py > E2_A3_A4_OBSERVABILITY_ATTEMPT_2.json
          cmp E2_A3_A4_OBSERVABILITY_ATTEMPT_1.json E2_A3_A4_OBSERVABILITY_ATTEMPT_2.json
          cp E2_A3_A4_OBSERVABILITY_ATTEMPT_1.json E2_A3_A4_OBSERVABILITY_AUDIT.json

      - name: Validate receipt and emit deterministic summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          p = Path("E2_A3_A4_OBSERVABILITY_AUDIT.json")
          raw = p.read_bytes()
          doc = json.loads(raw)

          assert doc["schema"] == "risu.diff-e2-a3-a4-observability-audit/v0.1"
          assert doc["cell_count"] == 58
          assert doc["truth_labels_consumed"] is False
          assert doc["mutation_operator_names_consumed_as_features"] is False
          assert doc["decision"] in {
              "A3_A4_MAY_PROCEED_ON_FROZEN_A2",
              "DO_NOT_IMPLEMENT_DEFINITIVE_A3_A4_ON_FROZEN_A2_V0_1",
          }

          sha = hashlib.sha256(raw).hexdigest()
          summary = {
              "schema": "risu.diff-e2-a3-a4-observability-run-receipt/v0.1",
              "head_sha": os.environ["GITHUB_SHA"],
              "audit_sha256": sha,
              "audit_bytes": len(raw),
              "byte_identical_replay": True,
              "cell_count": doc["cell_count"],
              "a1_a2_pass_cell_count": doc["a1_a2_pass_cell_count"],
              "a3_multi_definition_coalescing_cell_count": doc["a3_multi_definition_coalescing_cell_count"],
              "a4_sufficient_candidate_count": doc["a4_sufficient_candidate_count"],
              "decision": doc["decision"],
              "recommended_next": doc["recommended_next"],
              "truth_labels_consumed": False,
              "mutation_operator_names_consumed_as_features": False,
          }
          Path("E2_A3_A4_OBSERVABILITY_RUN_RECEIPT.json").write_text(
              json.dumps(summary, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True, separators=(",", ":")))
          PY

      - name: Upload audit receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-a3-a4-observability-gate
          path: |
            E2_A3_A4_OBSERVABILITY_AUDIT.json
            E2_A3_A4_OBSERVABILITY_ATTEMPT_1.json
            E2_A3_A4_OBSERVABILITY_ATTEMPT_2.json
            E2_A3_A4_OBSERVABILITY_RUN_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
