name: E2 A3 A4 Candidate Observability Root Cause Adjudication Freeze

on:
  push:
    paths:
      - '.github/workflows/e2-a3-a4-candidate-observability-root-cause-freeze.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout archival revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 16
      - name: Assert immutable diagnosis authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object protocols/RISU_DIFF_E2_A3_A4_CANDIDATE_OBSERVABILITY_POSTFREEZE_ROOT_CAUSE_ADJUDICATION_v0.1.json)" = "d25dc14d20fdca4712fe91a6323e9f4f2d9734f9"
          test "$(git hash-object experiments/risu-diff-e2/qualification/a3-a4/candidate-observability/root-cause/E2_A3_A4_CANDIDATE_OBSERVABILITY_ROOT_CAUSE_EVIDENCE_DOSSIER_v0.1.json)" = "f6d7b1fdb8ab632b2dd65e900267bd599070f972"
          test "$(git hash-object experiments/risu-diff-e2/qualification/a3-a4/candidate-observability/root-cause/E2_A3_A4_CANDIDATE_OBSERVABILITY_ROOT_CAUSE_ADJUDICATION_v0.1.json)" = "13bd7aba5cba2ac0dbd720bbaa79cef7a0781bae"
          test "$(git hash-object tools/e2_a3_a4_candidate_observability_root_cause_independent.py)" = "a03403c642a510bda7d8fd334c4d63bc455b2f70"
          test "$(git hash-object .github/workflows/e2-a3-a4-candidate-observability-root-cause-independent.yml)" = "b78dbd57db84daa3ff4d5b819f1d13a158d15622"
          test "$(git hash-object risu_e2/path_observability.py)" = "6eae3403f53b86f85bac47a31e751d28508e7225"
          test "$(git hash-object risu_e2/frontend_js.py)" = "6f3b6535caf0dcebb3c3c3679d898a23fdd8e795"
          test "$(git hash-object risu_e2/frontend_python.py)" = "e98cc7bbefa80d53b94fec3ef25845a3dbbedd93"
      - name: Download both independent second-pass artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/root-cause-final-freeze"
          mkdir -p "$T/a1" "$T/a2"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/risu-research/risu-verify/actions/artifacts/9995189672/zip" -o "$T/a1.zip"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/risu-research/risu-verify/actions/artifacts/9995198480/zip" -o "$T/a2.zip"
          echo "2d3f31acfe9b676b04a97cf91a380728311747651b4454f4e77c3f07754c00c1  $T/a1.zip" | sha256sum -c -
          echo "84a41ae42e62a322314707c1b513047951d83efa2a13409c67d54f0a49e60ca4  $T/a2.zip" | sha256sum -c -
          unzip -q "$T/a1.zip" -d "$T/a1"
          unzip -q "$T/a2.zip" -d "$T/a2"
          test "$(find "$T/a1" -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find "$T/a2" -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Cross-host exact-byte audit and construct final diagnosis receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])/'root-cause-final-freeze'
          names=['E2_A3_A4_CANDIDATE_OBSERVABILITY_ROOT_CAUSE_INDEPENDENT_SECOND_PASS_v0.1.json','E2_A3_A4_CANDIDATE_OBSERVABILITY_ROOT_CAUSE_CROSS_CHECK_v0.1.json']
          def h(b): return hashlib.sha256(b).hexdigest()
          logical={}
          for n in names:
            b1=(t/'a1'/n).read_bytes(); b2=(t/'a2'/n).read_bytes()
            assert b1==b2
            logical[n]={'sha256':h(b1),'bytes':len(b1),'byte_identical_across_attempts':True}
          independent=json.loads((t/'a1'/names[0]).read_bytes())
          cross=json.loads((t/'a1'/names[1]).read_bytes())
          primary=json.load(open('experiments/risu-diff-e2/qualification/a3-a4/candidate-observability/root-cause/E2_A3_A4_CANDIDATE_OBSERVABILITY_ROOT_CAUSE_ADJUDICATION_v0.1.json'))
          assert independent['status']=='PASS' and independent['case_count']==8 and not independent['unresolved_fixture_ids']
          assert independent['independence_attestation']['primary_adjudication_file_read'] is False
          assert independent['independence_attestation']['primary_category_labels_read'] is False
          assert cross['status']=='PASS' and cross['exact_primary_independent_category_and_mechanism_agreement'] is True
          assert primary['category_counts']==independent['category_counts']=={'FRONTEND_OBSERVABILITY_GAP':8}
          assert primary['mechanism_counts']==independent['mechanism_counts']=={
            'JS_TS_CALL_REGEX_FALSE_POSITIVE_ON_FUNCTION_DECLARATION':2,
            'JS_TS_RETURN_COMPARE_NOT_EMITTED':2,
            'JS_TS_RETURN_SPAN_NOT_COMPOSABLE_WITH_STRUCTURED_REPRESENTATION_SPAN':3,
            'PYTHON_RETURN_OUTER_CALL_SUPPRESSES_NESTED_CALL_VISIT':1}
          receipt={
            'schema':'risu.e2-a3-a4-candidate-observability-root-cause-adjudication-freeze-receipt/v0.1',
            'status':'ROOT_CAUSE_ADJUDICATION_FROZEN_PASS',
            'case_count':8,
            'primary_independent_exact_agreement':True,
            'category_counts':primary['category_counts'],
            'mechanism_counts':primary['mechanism_counts'],
            'authorities':{
              'frozen_candidate_observability_commit':'50079131e9d0ffa35bfa72e290cf3bec60ddd14e',
              'diagnosis_protocol_commit':'4de0b662a3b00bacb0406d4c0d797053423b4de3',
              'diagnosis_protocol_git_blob':'d25dc14d20fdca4712fe91a6323e9f4f2d9734f9',
              'category_free_evidence_freeze_commit':'d8f3e97484895a148b813e51c2d70990623326c4',
              'category_free_dossier_sha256':'76f2c895bf5a481e6fa7bf05d349a4e0bb5ac56cc6be2d81dd24a62bb8162da9',
              'primary_adjudication_commit':'e364f86d0ca76a9b7de51d9d48893a516e720558',
              'primary_adjudication_git_blob':'13bd7aba5cba2ac0dbd720bbaa79cef7a0781bae',
              'independent_checker_commit':'27746fe3af5c264e7cd12a881c6854d7c1c8d278',
              'independent_checker_git_blob':'a03403c642a510bda7d8fd334c4d63bc455b2f70',
              'independent_execution_head':'df7fec1fbec02a582c0cb9e7cee5cc0a3c4fab90'},
            'independent_hosted_replays':[
              {'github_run_id':34053252675,'run_attempt':1,'job_id':101540504671,'worker_id':'9b392d88-0556-4600-8fc1-2e2fa5bf58c9','azure_region':'westus3','artifact_id':9995189672,'artifact_zip_sha256':'2d3f31acfe9b676b04a97cf91a380728311747651b4454f4e77c3f07754c00c1'},
              {'github_run_id':34053252675,'run_attempt':2,'job_id':101540584237,'worker_id':'944052a8-f57c-4300-b472-fdd0178a2c37','azure_region':'westus3','artifact_id':9995198480,'artifact_zip_sha256':'84a41ae42e62a322314707c1b513047951d83efa2a13409c67d54f0a49e60ca4'}],
            'determinism':{'different_hosted_workers':True,'different_azure_regions':False,'within_each_worker_two_independent_derivations_byte_identical':True,'cross_worker_all_logical_files_byte_identical':True,'independent_output_sha256':'d0cf76df7565e6f02aa9908d5166064731c57bc0e8329245a64c3b4b7cd9ff36','logical_artifacts':logical},
            'causal_conclusion':{'primary_cause_for_all_eight':'FRONTEND_OBSERVABILITY_GAP','distinct_frontend_mechanisms':4,'path_state_logic_defect_adjudicated_as_primary_count':0,'fixture_contract_mismatch_adjudicated_as_primary_count':0,'genuinely_unsupported_construct_adjudicated_as_primary_count':0,'unknown_count':0},
            'firewall':{'candidate_58_bytes':False,'sanitized_58_manifest':False,'raw_blind_58_transport':False,'mutation_truth':False,'operator_metadata':False,'expected_e2_predictions':False,'fresh_target_bytes':False,'scientific_implementation_changes':False,'remediation_code_changes':False,'remediation_design_emitted':False,'a3_a4_58_verdict_execution':False},
            'authorization_boundary':{'candidate_58_observability_execution_authorized':False,'a3_a4_58_verdict_execution_authorized':False,'fresh_target_evaluation_authorized':False,'next_required_step':'PROSPECTIVELY PREREGISTER A REMEDIATION PROTOCOL FOR THE FOUR FROZEN FRONTEND MECHANISMS OR FORMALLY ACCEPT THE LIMITATION. DO NOT MODIFY SCIENTIFIC IMPLEMENTATION OR EXECUTE THE 58 CANDIDATES BEFORE THAT CHOICE IS FROZEN.'},
            'diagnostic_plumbing_history':[34052684980,34052767801,34053201362]}
          pre=(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n').encode(); receipt['freeze_receipt_preimage_sha256']=h(pre)
          final=(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n').encode(); (t/'freeze-receipt.json').write_bytes(final)
          print(json.dumps({'status':receipt['status'],'independent_sha256':receipt['determinism']['independent_output_sha256'],'freeze_receipt_sha256':h(final),'freeze_receipt_bytes':len(final),'category_counts':receipt['category_counts'],'mechanism_counts':receipt['mechanism_counts']},sort_keys=True,separators=(',',':')))
          PY
      - name: Commit exact independent artifacts and final diagnosis receipt
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/root-cause-final-freeze"
          D="experiments/risu-diff-e2/qualification/a3-a4/candidate-observability/root-cause"
          cp "$T/a1/E2_A3_A4_CANDIDATE_OBSERVABILITY_ROOT_CAUSE_INDEPENDENT_SECOND_PASS_v0.1.json" "$D/E2_A3_A4_CANDIDATE_OBSERVABILITY_ROOT_CAUSE_INDEPENDENT_SECOND_PASS_v0.1.json"
          cp "$T/a1/E2_A3_A4_CANDIDATE_OBSERVABILITY_ROOT_CAUSE_CROSS_CHECK_v0.1.json" "$D/E2_A3_A4_CANDIDATE_OBSERVABILITY_ROOT_CAUSE_CROSS_CHECK_v0.1.json"
          cp "$T/freeze-receipt.json" "$D/E2_A3_A4_CANDIDATE_OBSERVABILITY_ROOT_CAUSE_FREEZE_RECEIPT_v0.1.json"
          git config user.name "RISU Scientific Freeze"
          git config user.email "actions@users.noreply.github.com"
          git add "$D"
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 3
          for p in "${staged[@]}"; do case "$p" in "$D"/*) ;; *) echo "unexpected staged path: $p"; exit 1;; esac; done
          git commit -m "Freeze candidate observability root-cause adjudication"
          git push origin HEAD:e2-development
