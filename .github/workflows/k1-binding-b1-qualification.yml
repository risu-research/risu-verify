name: K1 Binding B1 Qualification

on:
  push:
    branches:
      - k1-binding-b1
    paths:
      - 'protocols/RISU_KERNEL_K1_BINDING_B1_QUALIFICATION.json'
      - 'tools/risu_kernel_k1_binding_b1_qualification_verify.py'
      - '.github/workflows/k1-binding-b1-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: '0'

jobs:
  qualify-b1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Replay complete B1 qualification evidence chain
        run: |
          set -euo pipefail
          python tools/risu_kernel_k1_binding_b1_qualification_verify.py \
            --manifest protocols/RISU_KERNEL_K1_BINDING_B1_QUALIFICATION.json \
            --output /tmp/k1-binding-b1-qualification.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/k1-binding-b1-qualification.json',encoding='utf-8'))
          assert x['status']=='PASS'
          assert x['b1_gate']['passed']==16 and x['b1_gate']['vector_count']==16 and x['b1_gate']['failed']==[]
          assert x['d2_gate']['passed']==8 and x['d2_gate']['vector_count']==8 and x['d2_gate']['failed']==[]
          assert all(x['checks'].values())
          print('K1 B1 composite qualification: PASS')
          PY
