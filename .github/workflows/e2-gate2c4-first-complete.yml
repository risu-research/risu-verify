name: E2 Gate2C4 First Complete

on:
  push:
    branches: [e2-development]
    paths:
      - ".github/workflows/e2-gate2c4-first-complete.yml"

permissions:
  contents: write
  actions: read

env:
  EXPECTED_PARENT: c1de0a87e9ee176eb10ac433a0d861c0c5a3389b
  PROTOCOL: protocols/RISU_DIFF_E2_GATE2C4_PROJECTION_SHAPE_TRIANGULATION_PROTOCOL_v0.1.json
  AMEND1: protocols/RISU_DIFF_E2_GATE2C4_PROJECTION_SHAPE_TRIANGULATION_PROTOCOL_AMENDMENT_001.json
  AMEND2: protocols/RISU_DIFF_E2_GATE2C4_PROJECTION_SHAPE_TRIANGULATION_PROTOCOL_AMENDMENT_002.json
  IMPL_FREEZE: protocols/RISU_DIFF_E2_GATE2C4_IMPLEMENTATION_FREEZE_v0.1.json
  ANALYZER: tools/e2_gate2c4_projection_shape_triangulation.py
  TEST: tests/test_e2_gate2c4_projection_shape_triangulation.py
  PROFILES: experiments/risu-diff-e2/qualification/gate1b1c-canonical-bridge/E2_GATE1B1C_CANONICAL_EXECUTION_PROFILES.json
  GATE2C3_LEDGER: experiments/risu-diff-e2/qualification/candidate58/gate2c3-python-c1-world-evaluation-provenance/first-complete/E2_GATE2C3_WORLD_EVAL_PROVENANCE_LEDGER.json
  G2C2A_FREEZE: experiments/risu-diff-e2/qualification/candidate58/gate2c2a-repaired-machine-requalification/first-complete/E2_GATE2C2A_FIRST_COMPLETE_IMMUTABLE_FREEZE_RECEIPT.json
  MATRIX: experiments/risu-diff-e2/qualification/candidate58/gate2c2a-repaired-machine-requalification/first-complete/E2_GATE2C2A_REPAIRED_MACHINE_PREDICTION_MATRIX.json
  PROTOCOL_BLOB: 1b3d3c4f29e9ff754e40f41444882177f8adfb3f
  AMEND1_BLOB: 0d64325d21a9068287ade17871febd5093cb2779
  AMEND2_BLOB: 1128cbd05a492df96cdb8ff66caae7e3eab32bf4
  IMPL_FREEZE_BLOB: 72447bbde949e014f100a25dbba29a9299dd2b95
  ANALYZER_BLOB: 87d75d242af14e8ac2b1ed6aba20b3fb815fc5c1
  TEST_BLOB: 127227a21b3b550e879401d423d56ed20c8fac07
  PROFILES_BLOB: 02c6e01d1a86167a15823cf14b61bfa37212d700
  GATE2C3_LEDGER_BLOB: a0b2cc3904693a3b499cd8747c1e9eca9261eb18
  G2C2A_FREEZE_BLOB: 0a5853950905ecd2fca219945c4e8f3844f6af81
  MATRIX_SHA: da8cb707a5cc71b36881eafc01a377ba040bb5148ae3d3997ecd95f7572138d3
  G2C2A_RUN_ID: "34159645664"
  G2C2A_ARTIFACT_ID: "10032162026"
  G2C2A_ARTIFACT_DIGEST: fe9ba1bcd2d8510acd487f6c5ff41592864bafe1b09df9a00e1a3706817d4b1d
  RESULT_DIR: experiments/risu-diff-e2/qualification/candidate58/gate2c4-projection-shape-triangulation/first-complete

jobs:
  first-complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact first-read revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove frozen boundary and empty first-complete slot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/e2-gate2c4-first-complete.yml"
          test "$(git hash-object "$PROTOCOL")" = "$PROTOCOL_BLOB"
          test "$(git hash-object "$AMEND1")" = "$AMEND1_BLOB"
          test "$(git hash-object "$AMEND2")" = "$AMEND2_BLOB"
          test "$(git hash-object "$IMPL_FREEZE")" = "$IMPL_FREEZE_BLOB"
          test "$(git hash-object "$ANALYZER")" = "$ANALYZER_BLOB"
          test "$(git hash-object "$TEST")" = "$TEST_BLOB"
          test "$(git hash-object "$PROFILES")" = "$PROFILES_BLOB"
          test "$(git hash-object "$GATE2C3_LEDGER")" = "$GATE2C3_LEDGER_BLOB"
          test "$(git hash-object "$G2C2A_FREEZE")" = "$G2C2A_FREEZE_BLOB"
          echo "$MATRIX_SHA  $MATRIX" | sha256sum -c -
          test ! -e "$RESULT_DIR"
          test "$(git ls-remote origin refs/heads/e2-development | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path(os.environ['PROTOCOL']).read_text())
          a1=json.loads(Path(os.environ['AMEND1']).read_text())
          a2=json.loads(Path(os.environ['AMEND2']).read_text())
          f=json.loads(Path(os.environ['IMPL_FREEZE']).read_text())
          g=json.loads(Path(os.environ['G2C2A_FREEZE']).read_text())
          assert p['population']['confirmatory_case_count']==6
          assert p['population']['confirmatory_role_observation_count']==12
          assert a1['read_boundary']['six_confirmatory_semantic_slices_opened_before_this_amendment'] is False
          assert a2['read_boundary']['six_confirmatory_primary_slices_opened'] is False
          assert f['status']=='IMPLEMENTATION_FROZEN_SYNTHETICALLY_QUALIFIED_BEFORE_CONFIRMATORY_PRIMARY_SLICE_READ'
          assert f['population_lock']['confirmatory_primary_semantic_slices_read_before_freeze'] is False
          assert f['real_execution_lock']['raw_candidate_source_read_forbidden'] is True
          assert f['real_execution_lock']['adapter_receipt_read_forbidden'] is True
          assert f['real_execution_lock']['c1_report_read_forbidden'] is True
          assert g['workflow_run_id']==os.environ['G2C2A_RUN_ID']
          assert g['hosted_artifact']['id']==os.environ['G2C2A_ARTIFACT_ID']
          assert g['hosted_artifact']['digest']==os.environ['G2C2A_ARTIFACT_DIGEST']
          assert g['frozen_files_sha256']['E2_GATE2C2A_REPAIRED_MACHINE_PREDICTION_MATRIX.json']==os.environ['MATRIX_SHA']
          print('GATE2C4_FIRST_READ_PREFLIGHT=PASS')
          PY

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.5"

      - name: Open exact seven primary semantic slices and verify immutable identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/gate2c2a.zip"; META="$RUNNER_TEMP/gate2c2a-meta.json"; PRIMARY="$RUNNER_TEMP/gate2c4-primary"; export ZIP META PRIMARY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$G2C2A_ARTIFACT_ID" > "$META"
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path(os.environ['META']).read_text())
          assert int(m['id'])==int(os.environ['G2C2A_ARTIFACT_ID'])
          assert m.get('expired') is False
          assert m.get('digest')=='sha256:'+os.environ['G2C2A_ARTIFACT_DIGEST']
          wr=m.get('workflow_run') or {}
          assert str(wr.get('id'))==os.environ['G2C2A_RUN_ID']
          print('GATE2C4_HOSTED_ARTIFACT_BINDING=PASS')
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$G2C2A_ARTIFACT_ID/zip" > "$ZIP"
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          protocol=json.loads(Path(os.environ['PROTOCOL']).read_text())
          matrix=json.loads(Path(os.environ['MATRIX']).read_text())
          pilot=str(protocol['population']['pilot_case_id'])
          confirm=[str(x) for x in protocol['population']['confirmatory_case_ids']]
          ids=[pilot]+confirm
          assert len(confirm)==6 and len(set(ids))==7
          rows={str(r['case_id']):r for r in matrix['cases']}
          root=Path(os.environ['PRIMARY']); root.mkdir(parents=True,exist_ok=True)
          z=zipfile.ZipFile(os.environ['ZIP']); verified=[]
          for cid in ids:
              row=rows[cid]
              n1=f'replay1/cases/{cid}/semantic_slice.json'; n2=f'replay2/cases/{cid}/semantic_slice.json'
              b1=z.read(n1); b2=z.read(n2)
              assert b1==b2,(cid,'primary_replay_mismatch')
              got=hashlib.sha256(b1).hexdigest(); assert got==row['semantic_slice_sha256'],(cid,got,row['semantic_slice_sha256'])
              d=root/cid; d.mkdir(); (d/'semantic_slice.json').write_bytes(b1)
              verified.append({'case_id':cid,'population':'PILOT_DESCRIPTIVE' if cid==pilot else 'CONFIRMATORY','semantic_slice_sha256':got})
          assert len(verified)==7 and sum(x['population']=='CONFIRMATORY' for x in verified)==6
          rec={'schema':'risu.e2-gate2c4-primary-input-verification/v0.1','gate2c2a_freeze_receipt_git_blob':os.environ['G2C2A_FREEZE_BLOB'],'gate2c2a_artifact_id':int(os.environ['G2C2A_ARTIFACT_ID']),'gate2c2a_artifact_digest_sha256':os.environ['G2C2A_ARTIFACT_DIGEST'],'gate2c2a_matrix_sha256':os.environ['MATRIX_SHA'],'pilot_case_previously_inspected':True,'confirmatory_case_count_first_opened_in_this_run':6,'semantic_slice_file_count_exposed':7,'replay1_replay2_byte_identical':True,'all_semantic_slice_sha256_match_frozen_matrix':True,'raw_source_files_exposed':0,'adapter_receipt_files_exposed':0,'c1_report_files_exposed':0,'verified':verified}
          Path(os.environ['RUNNER_TEMP'],'E2_GATE2C4_PRIMARY_INPUT_VERIFICATION_RECEIPT.json').write_text(json.dumps(rec,sort_keys=True,separators=(',',':'))+'\n')
          print('GATE2C4_PRIMARY_INPUTS=7_VERIFIED_CONFIRMATORY_FIRST_READ_6')
          PY

      - name: Execute first deterministic Gate2C4 replay
        shell: bash
        run: |
          set -euo pipefail
          python "$ANALYZER" --protocol "$PROTOCOL" --profiles "$PROFILES" --gate2c3-ledger "$GATE2C3_LEDGER" --matrix "$MATRIX" --primary-dir "$RUNNER_TEMP/gate2c4-primary" --output "$RUNNER_TEMP/replay1"
          test -f "$RUNNER_TEMP/replay1/E2_GATE2C4_PROJECTION_SHAPE_TRIANGULATION_LEDGER.json"
          test -f "$RUNNER_TEMP/replay1/E2_GATE2C4_PROJECTION_SHAPE_TRIANGULATION_SUMMARY.json"
          echo GATE2C4_FIRST_REPLAY=COMPLETE

      - name: Execute mandatory second replay and require byte identity
        shell: bash
        run: |
          set -euo pipefail
          python "$ANALYZER" --protocol "$PROTOCOL" --profiles "$PROFILES" --gate2c3-ledger "$GATE2C3_LEDGER" --matrix "$MATRIX" --primary-dir "$RUNNER_TEMP/gate2c4-primary" --output "$RUNNER_TEMP/replay2"
          cmp "$RUNNER_TEMP/replay1/E2_GATE2C4_PROJECTION_SHAPE_TRIANGULATION_LEDGER.json" "$RUNNER_TEMP/replay2/E2_GATE2C4_PROJECTION_SHAPE_TRIANGULATION_LEDGER.json"
          cmp "$RUNNER_TEMP/replay1/E2_GATE2C4_PROJECTION_SHAPE_TRIANGULATION_SUMMARY.json" "$RUNNER_TEMP/replay2/E2_GATE2C4_PROJECTION_SHAPE_TRIANGULATION_SUMMARY.json"
          echo GATE2C4_DUAL_REPLAY_BYTE_IDENTITY=PASS

      - name: Materialize first-complete receipts without taxonomy interpretation
        shell: bash
        run: |
          set -euo pipefail
          PAY="$RUNNER_TEMP/gate2c4-payload"; export PAY; mkdir -p "$PAY/replay1" "$PAY/replay2"
          cp "$RUNNER_TEMP/E2_GATE2C4_PRIMARY_INPUT_VERIFICATION_RECEIPT.json" "$PAY/"
          cp "$RUNNER_TEMP/replay1/"*.json "$PAY/replay1/"
          cp "$RUNNER_TEMP/replay2/"*.json "$PAY/replay2/"
          python - <<'PY'
          import hashlib,json,os,platform
          from pathlib import Path
          pay=Path(os.environ['PAY']);h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          receipt={'schema':'risu.e2-gate2c4-diagnostic-receipt/v0.1','status':'FIRST_COMPLETE_REAL_DIAGNOSTIC_PRE_FREEZE','workflow_run_id':os.environ['GITHUB_RUN_ID'],'trigger_commit':os.environ['GITHUB_SHA'],'python_version':platform.python_version(),'authority':{'protocol_git_blob':os.environ['PROTOCOL_BLOB'],'amendment1_git_blob':os.environ['AMEND1_BLOB'],'amendment2_git_blob':os.environ['AMEND2_BLOB'],'implementation_freeze_git_blob':os.environ['IMPL_FREEZE_BLOB'],'analyzer_git_blob':os.environ['ANALYZER_BLOB'],'profiles_git_blob':os.environ['PROFILES_BLOB'],'gate2c3_ledger_git_blob':os.environ['GATE2C3_LEDGER_BLOB'],'gate2c2a_freeze_receipt_git_blob':os.environ['G2C2A_FREEZE_BLOB'],'gate2c2a_artifact_id':int(os.environ['G2C2A_ARTIFACT_ID']),'gate2c2a_artifact_digest_sha256':os.environ['G2C2A_ARTIFACT_DIGEST'],'gate2c2a_matrix_sha256':os.environ['MATRIX_SHA']},'read_boundary':{'pilot_primary_semantic_slice_previously_inspected':True,'confirmatory_primary_semantic_slices_first_opened_in_this_run':6,'raw_source_files_read':0,'adapter_receipt_files_read':0,'c1_report_files_read':0,'truth_or_mutation_operator_read':False,'epistemic10_read':False},'outputs':{'primary_input_verification_sha256':h(pay/'E2_GATE2C4_PRIMARY_INPUT_VERIFICATION_RECEIPT.json'),'ledger_sha256':h(pay/'replay1/E2_GATE2C4_PROJECTION_SHAPE_TRIANGULATION_LEDGER.json'),'summary_sha256':h(pay/'replay1/E2_GATE2C4_PROJECTION_SHAPE_TRIANGULATION_SUMMARY.json')},'dual_replay_byte_identical':True,'taxonomy_interpreted_before_archive':False,'c1_rerun':False,'semantic_engine_rerun':False,'kernel_rerun':False,'remediation':False,'repair_soundness_inferred':False}
          (pay/'E2_GATE2C4_DIAGNOSTIC_RECEIPT.json').write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n')
          tree={'schema':'risu.e2-gate2c4-logical-tree/v0.1','files':{p.name:h(p) for p in sorted((pay/'replay1').glob('*.json'))},'primary_input_verification_sha256':h(pay/'E2_GATE2C4_PRIMARY_INPUT_VERIFICATION_RECEIPT.json'),'diagnostic_receipt_sha256':h(pay/'E2_GATE2C4_DIAGNOSTIC_RECEIPT.json')}
          (pay/'E2_GATE2C4_LOGICAL_TREE.json').write_text(json.dumps(tree,sort_keys=True,separators=(',',':'))+'\n')
          execution={'schema':'risu.e2-gate2c4-first-real-execution-receipt/v0.1','status':'FIRST_COMPLETE_REAL_REPLAY_BYTE_IDENTICAL_READY_FOR_ARCHIVE','workflow_run_id':os.environ['GITHUB_RUN_ID'],'trigger_commit':os.environ['GITHUB_SHA'],'pilot_case_count':1,'confirmatory_case_count':6,'confirmatory_role_observation_count':12,'dual_replay_byte_identical':True,'artifact_upload_required_before_repository_freeze':True,'truth_read':False,'epistemic10_read':False,'remediation':False}
          (pay/'E2_GATE2C4_FIRST_REAL_EXECUTION_RECEIPT.json').write_text(json.dumps(execution,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Upload exact first-complete dual replay before repository freeze
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-gate2c4-first-complete
          path: ${{ runner.temp }}/gate2c4-payload
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Materialize exact seven-file immutable repository payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ART=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="e2-gate2c4-first-complete") | [.id,.digest] | @tsv')
          test "$(printf '%s\n' "$ART" | wc -l)" -eq 1
          ART_ID=$(printf '%s' "$ART" | cut -f1); ART_DIGEST=$(printf '%s' "$ART" | cut -f2 | sed 's/^sha256://')
          test -n "$ART_ID"; test "${#ART_DIGEST}" -eq 64
          test ! -e "$RESULT_DIR"; mkdir -p "$RESULT_DIR"
          cp "$RUNNER_TEMP/gate2c4-payload/E2_GATE2C4_PRIMARY_INPUT_VERIFICATION_RECEIPT.json" "$RESULT_DIR/"
          cp "$RUNNER_TEMP/gate2c4-payload/replay1/E2_GATE2C4_PROJECTION_SHAPE_TRIANGULATION_LEDGER.json" "$RESULT_DIR/"
          cp "$RUNNER_TEMP/gate2c4-payload/replay1/E2_GATE2C4_PROJECTION_SHAPE_TRIANGULATION_SUMMARY.json" "$RESULT_DIR/"
          cp "$RUNNER_TEMP/gate2c4-payload/E2_GATE2C4_DIAGNOSTIC_RECEIPT.json" "$RESULT_DIR/"
          cp "$RUNNER_TEMP/gate2c4-payload/E2_GATE2C4_LOGICAL_TREE.json" "$RESULT_DIR/"
          cp "$RUNNER_TEMP/gate2c4-payload/E2_GATE2C4_FIRST_REAL_EXECUTION_RECEIPT.json" "$RESULT_DIR/"
          export ART_ID ART_DIGEST
          python - <<'PY'
          import json,os
          from pathlib import Path
          freeze={'schema':'risu.e2-gate2c4-first-complete-immutable-freeze/v0.1','status':'FIRST_COMPLETE_REAL_GATE2C4_IMMUTABLY_FROZEN_BY_CONTAINING_COMMIT','repository':'risu-research/risu-verify','branch':'e2-development','trigger_commit':os.environ['GITHUB_SHA'],'hosted_artifact':{'id':int(os.environ['ART_ID']),'name':'e2-gate2c4-first-complete','digest_sha256':os.environ['ART_DIGEST'],'uploaded_before_repository_freeze':True},'authority':{'protocol_git_blob':os.environ['PROTOCOL_BLOB'],'amendment1_git_blob':os.environ['AMEND1_BLOB'],'amendment2_git_blob':os.environ['AMEND2_BLOB'],'implementation_freeze_git_blob':os.environ['IMPL_FREEZE_BLOB'],'analyzer_git_blob':os.environ['ANALYZER_BLOB'],'profiles_git_blob':os.environ['PROFILES_BLOB'],'gate2c3_ledger_git_blob':os.environ['GATE2C3_LEDGER_BLOB'],'gate2c2a_freeze_receipt_git_blob':os.environ['G2C2A_FREEZE_BLOB'],'gate2c2a_matrix_sha256':os.environ['MATRIX_SHA']},'execution':{'pilot_case_count':1,'pilot_previously_inspected':True,'confirmatory_case_count':6,'confirmatory_primary_semantic_slices_first_opened_in_trigger_run':True,'confirmatory_role_observation_count':12,'primary_semantic_slice_files_verified_to_frozen_matrix':7,'dual_replay_byte_identical':True,'first_complete_result_may_not_be_replaced':True},'scientific_firewall':{'raw_source_read':False,'adapter_receipt_read':False,'c1_report_read':False,'truth_read':False,'mutation_operator_read':False,'epistemic10_read':False,'fresh_target_read':False,'c1_rerun':False,'semantic_engine_rerun':False,'kernel_rerun':False,'remediation':False,'repair_soundness_inferred':False},'interpretation_boundary':{'taxonomy_counts_not_used_to_modify_first_complete_result':True,'later_diagnostics_or_repairs_additive_only':True}}
          Path(os.environ['RESULT_DIR'],'E2_GATE2C4_FIRST_COMPLETE_IMMUTABLE_FREEZE_RECEIPT.json').write_text(json.dumps(freeze,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Commit and fast-forward push exact seven-file first-complete freeze
        shell: bash
        run: |
          set -euo pipefail
          git add "$RESULT_DIR"
          mapfile -t files < <(git diff --cached --name-only); test "${#files[@]}" -eq 7
          for f in "${files[@]}"; do case "$f" in "$RESULT_DIR"/*) ;; *) echo "unexpected staged file:$f"; exit 1;; esac; done
          test "$(git diff --cached --name-status | awk '$1!="A"{n++} END{print n+0}')" -eq 0
          test "$(git ls-remote origin refs/heads/e2-development | cut -f1)" = "$GITHUB_SHA"
          git config user.name "RISU Evidence Freeze"; git config user.email "risu-evidence-freeze@users.noreply.github.com"
          git commit -m "Freeze first complete Candidate58 Gate2C4 projection triangulation"
          git push origin HEAD:e2-development

      - name: Post-push exact remote verification
        shell: bash
        run: |
          set -euo pipefail
          LOCAL=$(git rev-parse HEAD); REMOTE=$(git ls-remote origin refs/heads/e2-development | cut -f1)
          test "$LOCAL" = "$REMOTE"; test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          mapfile -t files < <(git diff --name-only HEAD^ HEAD); test "${#files[@]}" -eq 7
          for f in "${files[@]}"; do case "$f" in "$RESULT_DIR"/*) ;; *) exit 1;; esac; done
          echo GATE2C4_FIRST_COMPLETE_REMOTE_FREEZE=PASS
