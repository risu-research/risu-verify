name: RISU Corpus 0.1 generic primary

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Repository-relative generated PRIMARY_RUN_MANIFEST.json path"
        required: true
        type: string

permissions:
  contents: read

jobs:
  primary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore executable entrypoints
        run: |
          chmod +x risu-verify
          chmod +x tools/*.py

      - name: Execute sealed manifest-driven primary under infrastructure v0.8
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .risu
          python tools/corpus01_primary_v08.py \
            "${{ inputs.manifest }}" \
            --json 2>&1 | tee .risu/corpus-primary-v08.log

      - name: Upload complete v0.8 primary evidence even on infrastructure failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-primary-v08-${{ github.sha }}-${{ github.run_id }}
          path: |
            .risu/corpus01-v08/**
            .risu/corpus-primary-v08.log
          if-no-files-found: warn
          retention-days: 90
