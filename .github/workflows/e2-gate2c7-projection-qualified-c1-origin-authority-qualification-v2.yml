name: E2 Gate2C7 Projection-Qualified C1 Origin Authority Qualification v2

on:
  push:
    branches: [e2-development]
    paths:
      - ".github/workflows/e2-gate2c7-projection-qualified-c1-origin-authority-qualification-v2.yml"

permissions:
  contents: read

env:
  EXPECTED_PARENT: 1dd07617de61b1bbd3e39f11a73594d0d98f4433
  IMPLEMENTATION_COMMIT: 1dd07617de61b1bbd3e39f11a73594d0d98f4433
  FAILED_V1_RUN_ID: "34174765144"
  PROTOCOL_COMMIT: c9b0e1b805fa7193972894bd6a83f3390cb4be75
  PROTOCOL: protocols/RISU_DIFF_E2_GATE2C7_PROJECTION_QUALIFIED_C1_ORIGIN_AUTHORITY_PROTOCOL_v0.1.json
  PROJECTION: risu_e2_c1/projection_authority.py
  SOURCE_EXTRACT: risu_e2_c1/source_extract.py
  PRODUCER: tools/e2_gate2c7_synthetic_qualify.py
  CHECKER: tools/e2_gate2c7_check_projection_qualified_c1_origin_authority.py
  TEST: tests/test_e2_gate2c7_projection_qualified_c1_origin_authority.py
  PROTOCOL_BLOB: 9b62376d6a260c21510621bfa769593fdcbaf732
  PROJECTION_BLOB: 64e9b0bff2f5dac7b51389cdf8d50745111787e0
  SOURCE_EXTRACT_BLOB: 88e26b65ebfc98ce5567da774acf2a67780cd05b
  PRODUCER_BLOB: df5251c1246ff7c5ccc891aa71dd9f59eb7abbc5
  CHECKER_BLOB: 1cc62483d67923d90589c532fe5a80f47b09eb11
  TEST_BLOB: 64963d65f76b81dfc20d42f1471332c93ae89745
  PYTHONPATH: ${{ github.workspace }}

jobs:
  synthetic-qualification-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact orchestration-correction revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3

      - name: Prove failure-preserving orchestration-only correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/e2-gate2c7-projection-qualified-c1-origin-authority-qualification-v2.yml"
          test "$(git hash-object "$PROTOCOL")" = "$PROTOCOL_BLOB"
          test "$(git hash-object "$PROJECTION")" = "$PROJECTION_BLOB"
          test "$(git hash-object "$SOURCE_EXTRACT")" = "$SOURCE_EXTRACT_BLOB"
          test "$(git hash-object "$PRODUCER")" = "$PRODUCER_BLOB"
          test "$(git hash-object "$CHECKER")" = "$CHECKER_BLOB"
          test "$(git hash-object "$TEST")" = "$TEST_BLOB"
          test ! -e experiments/risu-diff-e2/qualification/candidate58/gate2c7-projection-qualified-c1-origin-authority/first-complete
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path(os.environ["PROTOCOL"]).read_text())
          assert p["status"]=="PROSPECTIVE_SEALED_BEFORE_GATE2C7_IMPLEMENTATION_OR_C1_RERUN"
          assert p["population"]["candidate_execution_before_synthetic_pass"] is False
          assert p["scientific_firewall"]["epistemic10_read"] is False
          print("GATE2C7_V2_ORCHESTRATION_ONLY_BOUNDARY=PASS")
          PY

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.5"

      - name: Re-audit immutable implementation independence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, os, sys
          from pathlib import Path
          assert '.'.join(map(str,sys.version_info[:3]))=="3.13.5"
          checker=Path(os.environ["CHECKER"]).read_text()
          projection=Path(os.environ["PROJECTION"]).read_text()
          producer=Path(os.environ["PRODUCER"]).read_text()
          assert "risu_e2_c1" not in checker
          assert "e2_gate2c7_synthetic_qualify" not in checker
          assert "risu_e2_semantic" not in projection and "risu_e2." not in projection
          forbidden=("e2_gate2c5_build_canonical_projection_identity","e2_gate2c6_candidate_projection_match")
          assert not any(x in checker for x in forbidden)
          assert not any(x in producer for x in forbidden)
          assert not any(x in projection for x in forbidden)
          tree=ast.parse(checker); roots=[]
          for n in ast.walk(tree):
              if isinstance(n,ast.Import):
                  roots.extend(a.name.split(".",1)[0] for a in n.names)
              elif isinstance(n,ast.ImportFrom) and n.module:
                  roots.append(n.module.split(".",1)[0])
          bad=[x for x in roots if x not in sys.stdlib_module_names and x!="__future__"]
          assert not bad,bad
          print("GATE2C7_V2_INDEPENDENCE=PASS")
          PY

      - name: Preserve successful pre-failure tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$PROJECTION" "$SOURCE_EXTRACT" "$PRODUCER" "$CHECKER" "$TEST"
          python -m unittest tests.test_e2_c1_rechecker
          python -m unittest tests.test_e2_gate2c7_projection_qualified_c1_origin_authority
          echo GATE2C7_V2_BASELINE_AND_ADVERSARIAL_UNIT=PASS

      - name: Execute frozen adversarial producer and checker twice with corrected import path
        shell: bash
        run: |
          set -euo pipefail
          python "$PRODUCER" --output "$RUNNER_TEMP/producer1.json" > "$RUNNER_TEMP/producer1.stdout"
          python "$PRODUCER" --output "$RUNNER_TEMP/producer2.json" > "$RUNNER_TEMP/producer2.stdout"
          cmp "$RUNNER_TEMP/producer1.json" "$RUNNER_TEMP/producer2.json"
          cmp "$RUNNER_TEMP/producer1.stdout" "$RUNNER_TEMP/producer2.stdout"
          python "$CHECKER" --producer "$RUNNER_TEMP/producer1.json" --output "$RUNNER_TEMP/checker1.json" > "$RUNNER_TEMP/checker1.stdout"
          python "$CHECKER" --producer "$RUNNER_TEMP/producer2.json" --output "$RUNNER_TEMP/checker2.json" > "$RUNNER_TEMP/checker2.stdout"
          cmp "$RUNNER_TEMP/checker1.json" "$RUNNER_TEMP/checker2.json"
          cmp "$RUNNER_TEMP/checker1.stdout" "$RUNNER_TEMP/checker2.stdout"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])
          p=json.loads((r/"producer1.json").read_text())
          c=json.loads((r/"checker1.json").read_text())
          assert p["status"]=="PASS" and p["case_count"]==14 and p["all_expected_decisions_exact"] is True
          assert p["candidate_c1_executed"] is False and p["epistemic10_read"] is False
          assert c["status"]=="PASS" and c["case_count"]==14
          assert c["producer_checker_decision_agreement"] is True
          assert c["checker_imports_production_helper"] is False
          print("GATE2C7_V2_SYNTHETIC_DUAL_REPLAY=PASS")
          PY

      - name: Materialize successful qualification receipt with retained failed-run provenance
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/gate2c7-qualification"; export OUT; mkdir -p "$OUT"
          cp "$RUNNER_TEMP/producer1.json" "$OUT/E2_GATE2C7_SYNTHETIC_PRODUCER.json"
          cp "$RUNNER_TEMP/checker1.json" "$OUT/E2_GATE2C7_SYNTHETIC_INDEPENDENT_CHECKER.json"
          cp "$RUNNER_TEMP/producer1.stdout" "$OUT/E2_GATE2C7_SYNTHETIC_PRODUCER.stdout"
          cp "$RUNNER_TEMP/checker1.stdout" "$OUT/E2_GATE2C7_SYNTHETIC_INDEPENDENT_CHECKER.stdout"
          python - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          out=Path(os.environ["OUT"])
          receipt={
            "schema":"risu.e2-gate2c7-implementation-qualification/v0.1",
            "status":"SYNTHETICALLY_QUALIFIED_CANDIDATE_C1_RERUN_AUTHORIZED",
            "workflow_run_id":os.environ["GITHUB_RUN_ID"],
            "workflow_sha":os.environ["GITHUB_SHA"],
            "implementation_commit":os.environ["IMPLEMENTATION_COMMIT"],
            "protocol_commit":os.environ["PROTOCOL_COMMIT"],
            "python_version":platform.python_version(),
            "protocol_git_blob":os.environ["PROTOCOL_BLOB"],
            "projection_git_blob":os.environ["PROJECTION_BLOB"],
            "source_extract_git_blob":os.environ["SOURCE_EXTRACT_BLOB"],
            "producer_git_blob":os.environ["PRODUCER_BLOB"],
            "checker_git_blob":os.environ["CHECKER_BLOB"],
            "test_git_blob":os.environ["TEST_BLOB"],
            "synthetic_producer_sha256":h(out/"E2_GATE2C7_SYNTHETIC_PRODUCER.json"),
            "synthetic_checker_sha256":h(out/"E2_GATE2C7_SYNTHETIC_INDEPENDENT_CHECKER.json"),
            "synthetic_case_count":14,
            "all_expected_decisions_exact":True,
            "producer_checker_decision_agreement":True,
            "producer_dual_replay_byte_identical":True,
            "checker_dual_replay_byte_identical":True,
            "checker_imports_production_helper":False,
            "candidate_c1_executed":False,
            "candidate_source_bytes_read_by_qualification":0,
            "primary_adapter_modified":False,
            "truth_read":False,
            "epistemic10_read":False,
            "mutation_algebra_opened":False,
            "go_support_added":False,
            "typescript_support_added":False,
            "elapsed_or_wall_clock_fields_emitted":False,
            "historical_failed_qualification_attempts":[{
              "run_id":int(os.environ["FAILED_V1_RUN_ID"]),
              "classification":"SYNTHETIC_RUNNER_PYTHON_IMPORT_PATH",
              "candidate_c1_executed":False,
              "scientific_result_observed":False
            }]
          }
          (out/"E2_GATE2C7_IMPLEMENTATION_QUALIFICATION_RECEIPT.json").write_text(json.dumps(receipt,sort_keys=True,separators=(",",":"))+"\n")
          PY

      - name: Upload qualification artifact before candidate C1 rerun
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-gate2c7-projection-qualified-c1-origin-authority-qualification-v2
          path: ${{ runner.temp }}/gate2c7-qualification/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
