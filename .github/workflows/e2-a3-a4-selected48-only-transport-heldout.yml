name: E2 Selected 48 Only Transport + Heldout Execution

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Exact explicit authorization phrase for the first selected-48 source read
        required: true
        type: string
      launch_authority_commit:
        description: Exact workflow-freeze commit SHA whose parent is the frozen orchestration commit
        required: true
        type: string
      preregistration_authority_commit:
        description: Exact preregistration-receipt commit SHA directly atop the workflow-freeze commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  selected48-heldout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: risu-research/risu-verify
      AUTH_PHRASE: AUTHORIZE_EXACT_SELECTED48_FIRST_READ
      STAGE2_COMMIT: e4d995ed5869b9f6dcfa176f0d940d461adbda2b
      WORKFLOW_PATH: .github/workflows/e2-a3-a4-selected48-only-transport-heldout.yml
      RECEIPT_PATH: experiments/risu-diff-e2/qualification/a3-a4/frozen-48-requalification/selected-48-execution/E2_A3_A4_SELECTED_48_ONLY_TRANSPORT_HELDOUT_EXECUTION_PREREGISTRATION_RECEIPT_v0.1.json
      ROOT: /tmp/e2-selected48-sealed
      OUT: /tmp/e2-selected48-output
      SELECTED_BLOBS: /tmp/e2-selected48-exact-blobs
      SELECTED_SOURCES: /tmp/e2-selected48-selected-sources
    steps:
      - name: Verify explicit authorization and two-commit launch authority before any selected source read
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_AUTHORIZATION: ${{ inputs.authorization }}
          LAUNCH_AUTHORITY_COMMIT: ${{ inputs.launch_authority_commit }}
          PREREGISTRATION_AUTHORITY_COMMIT: ${{ inputs.preregistration_authority_commit }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.parse, urllib.request
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          auth=os.environ['REQUESTED_AUTHORIZATION']; launch=os.environ['LAUNCH_AUTHORITY_COMMIT']
          prereg=os.environ['PREREGISTRATION_AUTHORITY_COMMIT']; current=os.environ['CURRENT_SHA']
          stage2=os.environ['STAGE2_COMMIT']; workflow=os.environ['WORKFLOW_PATH']; receipt=os.environ['RECEIPT_PATH']
          if auth != os.environ['AUTH_PHRASE']:
              raise SystemExit('AUTHORIZATION_PHRASE_MISMATCH')
          for label,value in [('launch',launch),('preregistration',prereg),('current',current)]:
              if not re.fullmatch(r'[0-9a-f]{40}',value): raise SystemExit(f'{label.upper()}_SHA_MALFORMED')
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'risu-selected48-sealed'}
          def api(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.loads(r.read())
          lc=api('/commits/'+launch)
          if [p['sha'] for p in lc.get('parents',[])] != [stage2]: raise SystemExit('LAUNCH_PARENT_NOT_EXACT_STAGE2')
          if [f['filename'] for f in lc.get('files',[])] != [workflow]: raise SystemExit('LAUNCH_COMMIT_NOT_WORKFLOW_ONLY')
          pc=api('/commits/'+prereg)
          if [p['sha'] for p in pc.get('parents',[])] != [launch]: raise SystemExit('PREREG_PARENT_NOT_EXACT_LAUNCH')
          if [f['filename'] for f in pc.get('files',[])] != [receipt]: raise SystemExit('PREREG_COMMIT_NOT_RECEIPT_ONLY')
          if current != prereg:
              comp=api('/compare/'+prereg+'...'+current)
              if comp.get('status') != 'ahead' or comp.get('merge_base_commit',{}).get('sha') != prereg:
                  raise SystemExit('CURRENT_SHA_NOT_DESCENDANT_OF_PREREG')
          def contents_sha(ref):
              encoded=urllib.parse.quote(workflow,safe='/')
              return api('/contents/'+encoded+'?ref='+ref)['sha']
          frozen_workflow_blob=contents_sha(launch)
          current_workflow_blob=contents_sha(current)
          if current_workflow_blob != frozen_workflow_blob: raise SystemExit('WORKFLOW_CHANGED_AFTER_LAUNCH_FREEZE')
          out={
            'schema':'risu.e2-a3-a4-selected48-launch-authority-preflight/v0.1',
            'status':'PASS','semantic_authority':False,
            'stage2_commit':stage2,'launch_authority_commit':launch,
            'preregistration_authority_commit':prereg,'current_sha':current,
            'workflow_git_blob':frozen_workflow_blob,
            'authorization_phrase_matched':True,
            'selected48_source_bytes_read':False,'epistemic10_source_bytes_read':False,
            'candidate58_bytes_read':False,'raw_blind58_transport_read':False,
            'a3_a4_semantic_verdicts_emitted':False,
          }
          pathlib.Path(os.environ['OUT'],'authority_preflight.json').write_text(json.dumps(out,sort_keys=True,separators=(',',':')))
          print('LAUNCH_AUTHORITY_PREFLIGHT=PASS')
          PY

      - name: Set up exact Python toolchain
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up exact Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.2"

      - name: Materialize only frozen safe authorities and restore frozen transport engine
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT" "$SELECTED_BLOBS" "$SELECTED_SOURCES"
          mkdir -p "$ROOT" "$SELECTED_BLOBS" "$SELECTED_SOURCES"
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, tarfile, urllib.request
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']; root=pathlib.Path(os.environ['ROOT'])
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'risu-selected48-safe-authorities'}
          def git_blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def fetch_blob(sha):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: obj=json.loads(r.read())
              if obj.get('encoding')!='base64': raise SystemExit('UNEXPECTED_GIT_BLOB_ENCODING')
              data=base64.b64decode(obj['content'])
              if git_blob(data)!=sha: raise SystemExit('GIT_BLOB_IDENTITY_MISMATCH:'+sha)
              return data
          specs=[
            ('tools/e2_a3_a4_selected48_transport_heldout_orchestrator.py','189e51b80aa7630064fc0164efe0ada30c324963'),
            ('tools/e2_frozen48_requalification_primary.py','56ad7ec667f59f962585c6d5ed81b5dc98a363e2'),
            ('tools/e2_frozen48_requalification_independent.py','8a68cd1b80e2abeac68a3ca7aed6ab7cfc28c105'),
            ('risu_e2/__init__.py','90422cd39eead48484f1007859968b2e670e5ca1'),
            ('risu_e2/model.py','64baf95a4939f168881627830134b314a6ee6098'),
            ('risu_e2/acquisition.py','b81aec3803c22a7b74d47fe1cfec5fabe71a3492'),
            ('risu_e2/frontend_python.py','e98cc7bbefa80d53b94fec3ef25845a3dbbedd93'),
            ('risu_e2/frontend_js.py','6f3b6535caf0dcebb3c3c3679d898a23fdd8e795'),
            ('risu_e2/frontend_python_v2.py','8b7e4d0e2bb9ef6487ef2b90d2390b55ced55ea9'),
            ('risu_e2/frontend_js_v3.py','13ffb1b149150b7e730591de7acf47e9322bdf02'),
            ('risu_e2/frontend_go.py','4fc017fd65c8ede67cf11b5e27200c11bbac9d31'),
            ('risu_e2/ir.py','d7edac40d4eeda86be74e5785bde3bfc28d4cf5e'),
            ('risu_e2/ir_v3.py','1d95cfcb2e76563aa5d3ceb65815043eb8b2884a'),
            ('risu_e2/overlay_common.py','9975fe509fba30a2bbbbb8606f174faa5912a2f1'),
            ('risu_e2/overlay_control.py','00e06b85d91ce9f75676476c5dc47d15d51d2d35'),
            ('risu_e2/overlay_source.py','09f6e444cb20654cab1c7ac61ef45eaff44469d6'),
            ('risu_e2/observability_overlay.py','77be5ea1dad30aa6daa889e0753ce7d1aaa6f07a'),
            ('risu_e2/path_observability.py','6eae3403f53b86f85bac47a31e751d28508e7225'),
            ('tools/e2_go_ir_extract.go','26e752029d1b4a99b47f1c7024740b7b0ae14ef7'),
            ('input/selection.json','8336a8e33e189e373a8a59cca57c4cab20fdc5f7'),
            ('protocols/RISU_DIFF_E2_CANONICAL_SEED_CONSEQUENCE_ANCHORS_v0.1.json','ec8d8b287a80b87c815f0362be366be076d2b091'),
            ('input/signatures.json','cfa7d78707599177afe690c3aad7faaa22cb1930'),
          ]
          for path,sha in specs:
              data=fetch_blob(sha); dst=root/path; dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(data)
          chunk_specs=[
            ('chunk-00.b64','d0a5ed7980d9ae0d2f2740624ac29a6e161ac9b9'),
            ('chunk-01.b64','d196782d6dced42ac761e9cf923022ad45c79110'),
            ('chunk-02.b64','a58cbdbf9fe5cb2cc03ca4f3e779f72c44632049'),
            ('chunk-03.b64','0882b17589095ae526f1ed533a9d60a43609932d'),
          ]
          chunk_bytes=[fetch_blob(sha) for _,sha in chunk_specs]
          archive=base64.b64decode(b''.join(chunk_bytes))
          if hashlib.sha256(archive).hexdigest()!='7e08347694e82210bdcf53a8cec3f0684dcda5089020ad0d33e21b144fb88278':
              raise SystemExit('FROZEN_TRANSPORT_ARCHIVE_SHA256_MISMATCH')
          wanted={
            'anchor_transport.py':('risu_e2/anchor_transport.py','3b626fc83fe76a1dfafdcf896efc8a16440bbeec062cfb1dbb86badd23b7af4c'),
            'e2_anchor_transport_independent_check.py':('tools/e2_anchor_transport_independent_check.py','a24d6350636098e6083629f31db142e8061525f0b0d6af3538bab9a2d96048c6'),
          }
          found={}
          with tarfile.open(fileobj=io.BytesIO(archive),mode='r:gz') as tf:
              for member in tf.getmembers():
                  name=pathlib.PurePosixPath(member.name).name
                  if name in wanted:
                      if not member.isfile() or name in found: raise SystemExit('FROZEN_TRANSPORT_ARCHIVE_MEMBER_INVALID:'+name)
                      f=tf.extractfile(member)
                      if f is None: raise SystemExit('FROZEN_TRANSPORT_ARCHIVE_MEMBER_UNREADABLE:'+name)
                      found[name]=f.read()
          if set(found)!=set(wanted): raise SystemExit('FROZEN_TRANSPORT_ARCHIVE_MEMBER_SET_MISMATCH')
          for name,(dst_rel,expected_sha) in wanted.items():
              data=found[name]
              if hashlib.sha256(data).hexdigest()!=expected_sha: raise SystemExit('FROZEN_TRANSPORT_MEMBER_SHA256_MISMATCH:'+name)
              dst=root/dst_rel; dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(data)
          anchors=json.loads((root/'protocols/RISU_DIFF_E2_CANONICAL_SEED_CONSEQUENCE_ANCHORS_v0.1.json').read_bytes())
          contracts=anchors.get('contracts',[])
          if len(contracts)!=6: raise SystemExit('CANONICAL_ANCHOR_COUNT_MISMATCH')
          baseline_count=0
          for entry in contracts:
              src=entry['declaration']['source']; rel=pathlib.PurePosixPath(src['path'])
              if rel.is_absolute() or '..' in rel.parts: raise SystemExit('UNSAFE_BASELINE_PATH')
              data=fetch_blob(src['git_blob_sha'])
              if hashlib.sha256(data).hexdigest()!=src['sha256']: raise SystemExit('BASELINE_SHA256_MISMATCH')
              dst=root/'baseline'/pathlib.Path(*rel.parts); dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(data); baseline_count+=1
          if baseline_count!=6: raise SystemExit('BASELINE_COUNT_MISMATCH')
          print('SAFE_AUTHORITY_MATERIALIZATION=PASS')
          PY
          cd "$ROOT"
          PYTHONPATH=. python3 -m py_compile tools/e2_a3_a4_selected48_transport_heldout_orchestrator.py tools/e2_frozen48_requalification_primary.py tools/e2_frozen48_requalification_independent.py risu_e2/anchor_transport.py
          PYTHONPATH=. python3 tools/e2_a3_a4_selected48_transport_heldout_orchestrator.py project-admission \
            --selection input/selection.json --output input/runtime_admission.json
          cp input/runtime_admission.json "$OUT/runtime_admission.json"

      - name: Reassert adapter specialization firewall before selected source read
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,os
          root=pathlib.Path(os.environ['ROOT'])
          paths=[root/'tools/e2_frozen48_requalification_primary.py',root/'tools/e2_frozen48_requalification_independent.py']
          forbidden=[r'Q[0-9]{3}',r'V[23][A-Z][0-9]{2}',r'M_PLUS',r'M_ZERO',r'M_QUESTION',r'expected_truth',r'expected_e2',r'operator_id',r'operator_name',r'operator_class']
          for p in paths:
              text=p.read_text()
              for pat in forbidden:
                  if re.search(pat,text): raise SystemExit(f'SPECIALIZATION_TOKEN:{p.name}:{pat}')
              if re.search(r'(?<![0-9a-f])[0-9a-f]{40}(?![0-9a-f])',text): raise SystemExit(f'SOURCE_HASH_SPECIALIZATION_LITERAL:{p.name}')
          print('ADAPTER_SPECIALIZATION_FIREWALL=PASS')
          PY

      - name: First selected-48 source read by exact Git blob allowlist only
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_AUTHORIZATION: ${{ inputs.authorization }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REQUESTED_AUTHORIZATION" = "$AUTH_PHRASE"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']; root=pathlib.Path(os.environ['ROOT'])
          blob_dir=pathlib.Path(os.environ['SELECTED_BLOBS']); out=pathlib.Path(os.environ['OUT'])
          admission=json.loads((root/'input/runtime_admission.json').read_bytes())
          rows=admission.get('selected_cells',[])
          if len(rows)!=48: raise SystemExit('RUNTIME_ADMISSION_NOT_EXACT_48')
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'risu-selected48-exact-blob-first-read'}
          def git_blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          count=0
          for row in rows:
              if set(row)!={'cell_id','language','source_git_blob_identity','source_file_path_metadata'}: raise SystemExit('ADMISSION_FIELD_FIREWALL_FAIL')
              blobs=row['source_git_blob_identity']
              if len(blobs)!=1: raise SystemExit('ADMISSION_BLOB_CARDINALITY_FAIL')
              sha=blobs[0]
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: obj=json.loads(r.read())
              if obj.get('encoding')!='base64': raise SystemExit('UNEXPECTED_SELECTED_BLOB_ENCODING')
              data=base64.b64decode(obj['content'])
              if git_blob(data)!=sha: raise SystemExit('SELECTED_BLOB_IDENTITY_MISMATCH')
              (blob_dir/sha).write_bytes(data); count+=1
          if count!=48 or len(list(blob_dir.iterdir()))!=48: raise SystemExit('EXACT_SELECTED_BLOB_FETCH_COUNT_MISMATCH')
          receipt={'schema':'risu.e2-a3-a4-selected48-exact-blob-fetch-receipt/v0.1','status':'PASS','case_count':48,'exact_git_blob_endpoint_only':True,'tree_walk_used':False,'path_fetch_used':False,'raw_source_emitted':False,'epistemic10_source_bytes_read':False,'candidate58_bytes_read':False,'raw_blind58_transport_read':False}
          (out/'selected_source_fetch_receipt.json').write_text(json.dumps(receipt,sort_keys=True,separators=(',',':')))
          print('SELECTED48_FIRST_SOURCE_READ=AUTHORIZED_EXACT_BLOBS_ONLY')
          PY
          cd "$ROOT"
          PYTHONPATH=. python3 tools/e2_a3_a4_selected48_transport_heldout_orchestrator.py stage-selected \
            --authorization "$REQUESTED_AUTHORIZATION" \
            --admission input/runtime_admission.json \
            --blob-dir "$SELECTED_BLOBS" \
            --source-root "$SELECTED_SOURCES"

      - name: Recompute selected-48-only transport with exact frozen engine
        env:
          REQUESTED_AUTHORIZATION: ${{ inputs.authorization }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          PYTHONPATH=. python3 tools/e2_a3_a4_selected48_transport_heldout_orchestrator.py transport \
            --authorization "$REQUESTED_AUTHORIZATION" \
            --admission input/runtime_admission.json \
            --anchors protocols/RISU_DIFF_E2_CANONICAL_SEED_CONSEQUENCE_ANCHORS_v0.1.json \
            --baseline-root "$ROOT/baseline" \
            --source-root "$SELECTED_SOURCES" \
            --output "$OUT/transport_bundle.json"

      - name: Execute frozen Primary and Independent twice each on the exact same staged 48
        id: heldout
        shell: bash
        run: |
          set -u
          cd "$ROOT"
          SELECTION='input/runtime_admission.json'
          TRANSPORT="$OUT/transport_bundle.json"
          ANCHORS='protocols/RISU_DIFF_E2_CANONICAL_SEED_CONSEQUENCE_ANCHORS_v0.1.json'
          SIGS='input/signatures.json'
          GO='tools/e2_go_ir_extract.go'
          set +e
          PYTHONPATH=. python3 tools/e2_frozen48_requalification_primary.py heldout --selection "$SELECTION" --transport "$TRANSPORT" --anchors "$ANCHORS" --signatures "$SIGS" --source-root "$SELECTED_SOURCES" --go-helper "$GO" --output "$OUT/primary_run1.json"; P1=$?
          PYTHONPATH=. python3 tools/e2_frozen48_requalification_primary.py heldout --selection "$SELECTION" --transport "$TRANSPORT" --anchors "$ANCHORS" --signatures "$SIGS" --source-root "$SELECTED_SOURCES" --go-helper "$GO" --output "$OUT/primary_run2.json"; P2=$?
          PYTHONPATH=. python3 tools/e2_frozen48_requalification_independent.py heldout --selection "$SELECTION" --transport "$TRANSPORT" --anchors "$ANCHORS" --signatures "$SIGS" --source-root "$SELECTED_SOURCES" --go-helper "$GO" --output "$OUT/independent_run1.json"; I1=$?
          PYTHONPATH=. python3 tools/e2_frozen48_requalification_independent.py heldout --selection "$SELECTION" --transport "$TRANSPORT" --anchors "$ANCHORS" --signatures "$SIGS" --source-root "$SELECTED_SOURCES" --go-helper "$GO" --output "$OUT/independent_run2.json"; I2=$?
          set -e
          python3 - <<PY
          import json,pathlib
          pathlib.Path('$OUT/exit_codes.json').write_text(json.dumps({'primary_run1':$P1,'primary_run2':$P2,'independent_run1':$I1,'independent_run2':$I2},sort_keys=True,separators=(',',':')))
          PY
          echo "primary1=$P1 primary2=$P2 independent1=$I1 independent2=$I2"
          exit 0

      - name: Freeze repeat determinism observation and canonical checker cross-check
        if: always()
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['OUT'])
          pairs=[('primary_run1.json','primary_run2.json'),('independent_run1.json','independent_run2.json')]
          present={name:(out/name).is_file() for pair in pairs for name in pair}
          primary_same=present.get('primary_run1.json',False) and present.get('primary_run2.json',False) and (out/'primary_run1.json').read_bytes()==(out/'primary_run2.json').read_bytes()
          independent_same=present.get('independent_run1.json',False) and present.get('independent_run2.json',False) and (out/'independent_run1.json').read_bytes()==(out/'independent_run2.json').read_bytes()
          doc={'schema':'risu.e2-a3-a4-selected48-repeat-check/v0.1','status':'PASS' if primary_same and independent_same else 'FAIL','semantic_authority':False,'outputs_present':present,'primary_byte_identical':primary_same,'independent_byte_identical':independent_same}
          (out/'repeat_check.json').write_text(json.dumps(doc,sort_keys=True,separators=(',',':')))
          PY
          cd "$ROOT"
          PYTHONPATH=. python3 tools/e2_a3_a4_selected48_transport_heldout_orchestrator.py cross-check \
            --primary "$OUT/primary_run1.json" --independent "$OUT/independent_run1.json" --output "$OUT/cross_check.json"
          CROSS=$?
          echo "cross_check_exit=$CROSS"
          exit 0

      - name: Assemble first-complete state and prove upload surface contains no selected source text
        if: always()
        env:
          LAUNCH_AUTHORITY_COMMIT: ${{ inputs.launch_authority_commit }}
          PREREGISTRATION_AUTHORITY_COMMIT: ${{ inputs.preregistration_authority_commit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['OUT']); selected=pathlib.Path(os.environ['SELECTED_SOURCES'])
          expected=['transport_bundle.json','primary_run1.json','primary_run2.json','independent_run1.json','independent_run2.json','cross_check.json','repeat_check.json','exit_codes.json']
          present={name:(out/name).is_file() for name in expected}
          complete=all(present.values())
          files={}
          for p in sorted(out.iterdir()) if out.exists() else []:
              if p.is_file():
                  data=p.read_bytes(); files[p.name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          provenance={
            'schema':'risu.e2-a3-a4-selected48-heldout-execution-provenance/v0.1',
            'status':'FIRST_COMPLETE_OBSERVED' if complete else 'PRE_COMPLETE_EXECUTION_FAILURE',
            'semantic_authority':False,'complete_scientific_bundle':complete,
            'expected_outputs_present':present,'output_files':files,
            'stage2_commit':os.environ['STAGE2_COMMIT'],
            'launch_authority_commit':os.environ['LAUNCH_AUTHORITY_COMMIT'],
            'preregistration_authority_commit':os.environ['PREREGISTRATION_AUTHORITY_COMMIT'],
            'selected48_source_bytes_read':(out/'selected_source_fetch_receipt.json').is_file(),
            'epistemic10_source_bytes_read':False,'candidate58_bytes_read':False,
            'raw_blind58_transport_read':False,'mutation_truth_read':False,
            'mutation_operator_metadata_read':False,'expected_e2_prediction_read':False,
            'fresh_target_bytes_read':False,'a3_a4_semantic_verdicts_emitted':False,
          }
          (out/'execution_provenance.json').write_text(json.dumps(provenance,sort_keys=True,separators=(',',':')))
          allowed={'authority_preflight.json','runtime_admission.json','selected_source_fetch_receipt.json','transport_bundle.json','primary_run1.json','primary_run2.json','independent_run1.json','independent_run2.json','cross_check.json','repeat_check.json','exit_codes.json','execution_provenance.json'}
          names={p.name for p in out.iterdir() if p.is_file()}
          if not names.issubset(allowed): raise SystemExit('UNAPPROVED_ARTIFACT_FILE:'+repr(sorted(names-allowed)))
          forbidden_keys={'source','source_text','source_bytes','candidate_source','raw_source','source_code'}
          def walk(value):
              if isinstance(value,dict):
                  for k,v in value.items():
                      if str(k).lower() in forbidden_keys: raise SystemExit('RAW_SOURCE_KEY_IN_ARTIFACT:'+str(k))
                      walk(v)
              elif isinstance(value,list):
                  for v in value: walk(v)
          for p in out.glob('*.json'):
              try: walk(json.loads(p.read_bytes()))
              except json.JSONDecodeError: raise SystemExit('NON_JSON_EXPECTED_JSON_ARTIFACT:'+p.name)
          if selected.exists():
              output_blobs=[p.read_bytes() for p in out.iterdir() if p.is_file()]
              for src in selected.rglob('*'):
                  if not src.is_file(): continue
                  raw=src.read_bytes()
                  if raw and any(raw in blob for blob in output_blobs): raise SystemExit('COMPLETE_SELECTED_SOURCE_LEAK_IN_ARTIFACT')
                  for line in raw.splitlines():
                      stripped=line.strip()
                      if len(stripped)<24: continue
                      try: encoded=json.dumps(stripped.decode('utf-8'),ensure_ascii=False)[1:-1].encode('utf-8')
                      except UnicodeDecodeError: continue
                      if encoded and any(encoded in blob for blob in output_blobs): raise SystemExit('SELECTED_SOURCE_LINE_LEAK_IN_ARTIFACT')
          print('ARTIFACT_RAW_SOURCE_FIREWALL=PASS')
          PY

      - name: Upload execution evidence before final PASS assertion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-selected48-only-transport-heldout-execution
          path: /tmp/e2-selected48-output/
          if-no-files-found: error
          retention-days: 90

      - name: Assert first-complete selected-48 gate only after evidence upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ['OUT'])
          required=['execution_provenance.json','repeat_check.json','cross_check.json','exit_codes.json']
          if not all((out/n).is_file() for n in required): raise SystemExit('PRE_COMPLETE_EXECUTION_FAILURE')
          provenance=json.loads((out/'execution_provenance.json').read_text())
          repeat=json.loads((out/'repeat_check.json').read_text())
          cross=json.loads((out/'cross_check.json').read_text())
          codes=json.loads((out/'exit_codes.json').read_text())
          if provenance.get('status')!='FIRST_COMPLETE_OBSERVED' or not provenance.get('complete_scientific_bundle'): raise SystemExit('NOT_FIRST_COMPLETE')
          if repeat.get('status')!='PASS': raise SystemExit('REPEAT_DETERMINISM_FAIL')
          if cross.get('status')!='PASS': raise SystemExit('CANONICAL_CROSS_CHECK_FAIL')
          if any(value!=0 for value in codes.values()): raise SystemExit('HELDOUT_ADAPTER_NONZERO:'+repr(codes))
          print('SELECTED48_FIRST_COMPLETE_GATE=PASS')
          PY
