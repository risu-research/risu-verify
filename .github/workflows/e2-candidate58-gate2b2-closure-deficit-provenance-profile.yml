name: E2 Candidate58 Gate2B2 Closure Deficit Provenance Profile

on:
  push:
    branches: [e2-development]
    paths:
      - ".github/workflows/e2-candidate58-gate2b2-closure-deficit-provenance-profile.yml"

permissions:
  contents: write

concurrency:
  group: e2-candidate58-gate2b2-first-complete
  cancel-in-progress: false

env:
  GATE2B2_PARENT: cbbb24b471c5d1533c7230001f4d81a0a1264e57
  GATE2B1_FREEZE: bb9174f33d4c199e26b079ccebc2845c91fa2826
  PROTOCOL_PATH: protocols/RISU_DIFF_E2_CANDIDATE58_GATE2B2_CLOSURE_DEFICIT_PROVENANCE_PROFILE_PROTOCOL_v0.1.json
  ANALYZER_PATH: tools/e2_candidate58_gate2b2_closure_deficit_provenance_profile.py
  IMPLEMENTATION_FREEZE_PATH: protocols/RISU_DIFF_E2_CANDIDATE58_GATE2B2_IMPLEMENTATION_FREEZE_v0.1.json
  GATE2B1_LEDGER_PATH: experiments/risu-diff-e2/qualification/candidate58/gate2b1-frozen-kernel-nondefinitive-admission-profile/E2_CANDIDATE58_GATE2B1_ADMISSION_PROFILE_LEDGER.json
  GATE2B1_SUMMARY_PATH: experiments/risu-diff-e2/qualification/candidate58/gate2b1-frozen-kernel-nondefinitive-admission-profile/E2_CANDIDATE58_GATE2B1_ADMISSION_PROFILE_SUMMARY.json
  GATE2B1_FREEZE_RECEIPT_PATH: experiments/risu-diff-e2/qualification/candidate58/gate2b1-frozen-kernel-nondefinitive-admission-profile/E2_CANDIDATE58_GATE2B1_FIRST_COMPLETE_IMMUTABLE_FREEZE_RECEIPT.json
  PROTOCOL_BLOB: 7bf11e1cd27d3fb74176abad7f4883a57b2875d1
  ANALYZER_BLOB: ce1328e43ab86af5c2021ef57444818cc227bef2
  IMPLEMENTATION_FREEZE_BLOB: 81cadee2e00f558e2f9f90377cf62fab41e099d2
  GATE2B1_LEDGER_BLOB: 7c5684ffdb7f3c6050e7c385fcbf407bd8bf63dd
  GATE2B1_SUMMARY_BLOB: fd62dd62ff07d5abf10fe1085324a1edee62f6cb
  GATE2B1_FREEZE_RECEIPT_BLOB: 1cb3696d6dc7caa2e6db0637b11fd376d14cb32f
  PRIMARY_ADAPTER_BLOB: c1b5d5e666bdd1b8f9bb1e041f76368f7f7a741c
  ADAPTER_SUPPORT_BLOB: 5558d4bc91a0e51c4f836b4ae6db69bcf6abafe7
  KERNEL_BLOB: e91e51397f4cc201452b1a0f80d130265dca2ea0
  GATE2B1_LEDGER_SHA256: e487cfdcac7e6ed4d024086e989560bdf8054e4d5181c7a5929af1187801fa63
  GATE2B1_SUMMARY_SHA256: c41e17b964fbf3877c66842c44c22c6b9662a69647ac00a1752d8afbc27c822e

jobs:
  first-complete-gate2b2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Gate2B2 orchestration revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 12

      - name: Prove additive provenance-only boundary before aggregation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$GATE2B2_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/e2-candidate58-gate2b2-closure-deficit-provenance-profile.yml"
          git merge-base --is-ancestor "$GATE2B1_FREEZE" HEAD
          test "$(git hash-object "$PROTOCOL_PATH")" = "$PROTOCOL_BLOB"
          test "$(git hash-object "$ANALYZER_PATH")" = "$ANALYZER_BLOB"
          test "$(git hash-object "$IMPLEMENTATION_FREEZE_PATH")" = "$IMPLEMENTATION_FREEZE_BLOB"
          test "$(git hash-object "$GATE2B1_LEDGER_PATH")" = "$GATE2B1_LEDGER_BLOB"
          test "$(git hash-object "$GATE2B1_SUMMARY_PATH")" = "$GATE2B1_SUMMARY_BLOB"
          test "$(git hash-object "$GATE2B1_FREEZE_RECEIPT_PATH")" = "$GATE2B1_FREEZE_RECEIPT_BLOB"
          test "$(git hash-object risu_e2_semantic/primary_adapter.py)" = "$PRIMARY_ADAPTER_BLOB"
          test "$(git hash-object risu_e2_semantic/adapter_support.py)" = "$ADAPTER_SUPPORT_BLOB"
          test "$(git hash-object risu_e2_semantic/kernel.py)" = "$KERNEL_BLOB"
          echo "$GATE2B1_LEDGER_SHA256  $GATE2B1_LEDGER_PATH" | sha256sum -c -
          echo "$GATE2B1_SUMMARY_SHA256  $GATE2B1_SUMMARY_PATH" | sha256sum -c -
          python - <<'PY'
          import ast, subprocess, sys
          expected={
            'protocols/RISU_DIFF_E2_CANDIDATE58_GATE2B2_CLOSURE_DEFICIT_PROVENANCE_PROFILE_PROTOCOL_v0.1.json',
            'tools/e2_candidate58_gate2b2_closure_deficit_provenance_profile.py',
            'protocols/RISU_DIFF_E2_CANDIDATE58_GATE2B2_IMPLEMENTATION_FREEZE_v0.1.json',
            '.github/workflows/e2-candidate58-gate2b2-closure-deficit-provenance-profile.yml',
          }
          names=set(subprocess.check_output(['git','diff','--name-only','bb9174f33d4c199e26b079ccebc2845c91fa2826..HEAD'],text=True).splitlines())
          assert names==expected, (names, expected)
          src=open('tools/e2_candidate58_gate2b2_closure_deficit_provenance_profile.py',encoding='utf-8').read()
          tree=ast.parse(src)
          tops=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.Import): tops += [a.name.split('.')[0] for a in node.names]
              elif isinstance(node,ast.ImportFrom) and node.module: tops.append(node.module.split('.')[0])
          bad=sorted({x for x in tops if x not in sys.stdlib_module_names and x!='__future__'})
          assert not bad, bad
          assert not any(x.startswith('risu') for x in tops), tops
          print('GATE2B2_POST_GATE2B1_ADDITIVE_FIREWALL=PASS')
          print('GATE2B2_ANALYZER_STDLIB_ONLY_STATIC_IMPORT_CHECK=PASS')
          PY

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.5"

      - name: Qualify frozen provenance analyzer before real aggregation
        shell: bash
        run: |
          set -euo pipefail
          python "$ANALYZER_PATH" \
            --protocol "$PROTOCOL_PATH" \
            --gate2b1-ledger "$GATE2B1_LEDGER_PATH" \
            --gate2b1-summary "$GATE2B1_SUMMARY_PATH" \
            --gate2b1-freeze-receipt "$GATE2B1_FREEZE_RECEIPT_PATH" \
            --self-test

      - name: Execute first deterministic Gate2B2 provenance replay
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gate2b2"
          mkdir -p "$ROOT"
          python "$ANALYZER_PATH" \
            --protocol "$PROTOCOL_PATH" \
            --gate2b1-ledger "$GATE2B1_LEDGER_PATH" \
            --gate2b1-summary "$GATE2B1_SUMMARY_PATH" \
            --gate2b1-freeze-receipt "$GATE2B1_FREEZE_RECEIPT_PATH" \
            --output-dir "$ROOT/replay1"
          (cd "$ROOT/replay1" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$ROOT/replay1.logical-tree.sha256"

      - name: Execute mandatory second deterministic Gate2B2 provenance replay
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gate2b2"
          python "$ANALYZER_PATH" \
            --protocol "$PROTOCOL_PATH" \
            --gate2b1-ledger "$GATE2B1_LEDGER_PATH" \
            --gate2b1-summary "$GATE2B1_SUMMARY_PATH" \
            --gate2b1-freeze-receipt "$GATE2B1_FREEZE_RECEIPT_PATH" \
            --output-dir "$ROOT/replay2"
          (cd "$ROOT/replay2" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$ROOT/replay2.logical-tree.sha256"

      - name: Require exact byte identity and zero unmapped provenance atoms
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gate2b2"
          cmp "$ROOT/replay1.logical-tree.sha256" "$ROOT/replay2.logical-tree.sha256"
          diff -qr "$ROOT/replay1" "$ROOT/replay2"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'gate2b2'
          s=json.loads((root/'replay1/E2_CANDIDATE58_GATE2B2_CLOSURE_PROVENANCE_SUMMARY.json').read_text())
          r=json.loads((root/'replay1/E2_CANDIDATE58_GATE2B2_DIAGNOSTIC_RECEIPT.json').read_text())
          l=json.loads((root/'replay1/E2_CANDIDATE58_GATE2B2_CLOSURE_PROVENANCE_LEDGER.json').read_text())
          assert s['case_count']==l['case_count']==39
          assert len(l['rows'])==39
          assert s['unmapped_producer_atom_count']==0
          assert r['integrity']['zero_unmapped_producer_atoms'] is True
          assert r['scientific_firewall']=={
            'candidate_source_read':False,
            'semantic_slice_read':False,
            'kernel_result_or_machine_bundle_read':False,
            'adapter_receipt_read':False,
            'certificate_or_c1_read':False,
            'semantic_engine_kernel_adapter_or_c1_rerun':False,
            'gate2a_truth_join_input':False,
            'truth_or_operator_read':False,
            'fresh_heldout_read':False,
            'remediation':False,
            'semantic_rule_change':False,
          }
          print('GATE2B2_TWO_REPLAY_IDENTITY_AND_FIREWALL=PASS')
          PY

      - name: Upload both exact Gate2B2 replays before repository freeze
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-candidate58-gate2b2-first-complete-provenance-profile
          path: |
            ${{ runner.temp }}/gate2b2/replay1
            ${{ runner.temp }}/gate2b2/replay2
            ${{ runner.temp }}/gate2b2/replay1.logical-tree.sha256
            ${{ runner.temp }}/gate2b2/replay2.logical-tree.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Materialize exact first-complete Gate2B2 repository freeze payload
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gate2b2"
          D="experiments/risu-diff-e2/qualification/candidate58/gate2b2-closure-deficit-provenance-profile"
          test ! -e "$D"
          mkdir -p "$D"
          cp "$ROOT/replay1/E2_CANDIDATE58_GATE2B2_CLOSURE_PROVENANCE_LEDGER.json" "$D/"
          cp "$ROOT/replay1/E2_CANDIDATE58_GATE2B2_CLOSURE_PROVENANCE_SUMMARY.json" "$D/"
          cp "$ROOT/replay1/E2_CANDIDATE58_GATE2B2_DIAGNOSTIC_RECEIPT.json" "$D/"
          cp "$ROOT/replay1.logical-tree.sha256" "$D/E2_CANDIDATE58_GATE2B2_LOGICAL_TREE.sha256"
          export D
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          d=Path(os.environ['D'])
          h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          ledger=d/'E2_CANDIDATE58_GATE2B2_CLOSURE_PROVENANCE_LEDGER.json'
          summary=d/'E2_CANDIDATE58_GATE2B2_CLOSURE_PROVENANCE_SUMMARY.json'
          diag=d/'E2_CANDIDATE58_GATE2B2_DIAGNOSTIC_RECEIPT.json'
          logical=d/'E2_CANDIDATE58_GATE2B2_LOGICAL_TREE.sha256'
          s=json.loads(summary.read_text())
          receipt={
            'schema':'risu.e2-candidate58-gate2b2-first-complete-immutable-freeze/v0.1',
            'status':'FIRST_COMPLETE_GATE2B2_CLOSURE_PROVENANCE_PROFILE_IMMUTABLY_FROZEN_BY_CONTAINING_COMMIT',
            'repository':'risu-research/risu-verify',
            'branch':'e2-development',
            'gate2b1_first_complete_freeze_commit':'bb9174f33d4c199e26b079ccebc2845c91fa2826',
            'gate2b2_protocol_git_blob':'7bf11e1cd27d3fb74176abad7f4883a57b2875d1',
            'gate2b2_analyzer_git_blob':'ce1328e43ab86af5c2021ef57444818cc227bef2',
            'gate2b2_implementation_freeze_git_blob':'81cadee2e00f558e2f9f90377cf62fab41e099d2',
            'workflow_trigger_commit':os.environ['GITHUB_SHA'],
            'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
            'workflow_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
            'case_count':39,
            'closure_provenance_ledger_sha256':h(ledger),
            'closure_provenance_summary_sha256':h(summary),
            'diagnostic_receipt_sha256':h(diag),
            'logical_tree_manifest_sha256':h(logical),
            'two_replay_logical_byte_identity':True,
            'zero_unmapped_producer_atoms':s['unmapped_producer_atom_count']==0,
            'hosted_artifact_uploaded_before_repository_freeze':True,
            'prior_visibility_disclosure_preserved':True,
            'scientific_firewall':{
              'semantic_engine_kernel_adapter_or_c1_rerun':False,
              'candidate_source_semantic_slice_or_kernel_result_read':False,
              'truth_or_operator_read':False,
              'gate2a_truth_join_input':False,
              'fresh_heldout_read':False,
              'remediation_performed':False,
              'semantic_rule_changed':False,
            },
            'interpretation_boundary':{
              'producer_site_provenance_is_not_semantic_root_cause':True,
              'wrapper_leaf_separation_is_not_causal_dominance':True,
              'counterfactual_remediation_gain_not_inferred':True,
              'remediation_priority_not_authorized':True,
            },
            'immutability_rule':{
              'this_first_complete_gate2b2_result_may_not_be_replaced':True,
              'Gate2A_Gate2B0_Gate2B1_artifacts_remain_immutable':True,
              'later_source_level_tracing_or_remediation_must_be_additive':True,
            },
          }
          (d/'E2_CANDIDATE58_GATE2B2_FIRST_COMPLETE_IMMUTABLE_FREEZE_RECEIPT.json').write_bytes((json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n').encode())
          PY

      - name: Create one immutable Gate2B2 result commit and push fast-forward only
        shell: bash
        run: |
          set -euo pipefail
          D="experiments/risu-diff-e2/qualification/candidate58/gate2b2-closure-deficit-provenance-profile"
          git config user.name "risu-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- "$D"
          python - <<'PY'
          import subprocess
          prefix='experiments/risu-diff-e2/qualification/candidate58/gate2b2-closure-deficit-provenance-profile/'
          expected={
            prefix+'E2_CANDIDATE58_GATE2B2_CLOSURE_PROVENANCE_LEDGER.json',
            prefix+'E2_CANDIDATE58_GATE2B2_CLOSURE_PROVENANCE_SUMMARY.json',
            prefix+'E2_CANDIDATE58_GATE2B2_DIAGNOSTIC_RECEIPT.json',
            prefix+'E2_CANDIDATE58_GATE2B2_LOGICAL_TREE.sha256',
            prefix+'E2_CANDIDATE58_GATE2B2_FIRST_COMPLETE_IMMUTABLE_FREEZE_RECEIPT.json',
          }
          names=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert names==expected, (names,expected)
          print('GATE2B2_RESULT_COMMIT_DELTA_FIREWALL=PASS')
          PY
          git commit -m "Freeze first complete Candidate58 Gate2B2 closure provenance profile"
          git push origin HEAD:e2-development
          echo "GATE2B2_FIRST_COMPLETE_FREEZE_COMMIT=$(git rev-parse HEAD)"

      - name: Post-push immutable-boundary verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | grep -v '^$' | wc -l)" -eq 5
          D="experiments/risu-diff-e2/qualification/candidate58/gate2b2-closure-deficit-provenance-profile"
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('experiments/risu-diff-e2/qualification/candidate58/gate2b2-closure-deficit-provenance-profile')
          r=json.loads((d/'E2_CANDIDATE58_GATE2B2_FIRST_COMPLETE_IMMUTABLE_FREEZE_RECEIPT.json').read_text())
          assert r['status']=='FIRST_COMPLETE_GATE2B2_CLOSURE_PROVENANCE_PROFILE_IMMUTABLY_FROZEN_BY_CONTAINING_COMMIT'
          assert r['case_count']==39 and r['two_replay_logical_byte_identity'] is True
          assert r['zero_unmapped_producer_atoms'] is True
          print('GATE2B2_FIRST_COMPLETE_REPOSITORY_FREEZE=PASS')
          PY
