name: Public record linkage preflight
on:
  push:
    paths:
      - 'tools/public_record_linkage_preflight.py'
      - '.github/workflows/public-record-linkage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/public_record_linkage_preflight.py
