name: K1 C3 W8 format once
on:
  push:
    branches: [k1-closure-c3]
    paths:
      - 'kernel/k1_w8_*.go'
      - 'kernel/k1_checker_w8.go'
      - '.github/workflows/k1-c3-w8-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Go source only
        run: |
          gofmt -w kernel/k1_w8_json.go kernel/k1_w8_model.go kernel/k1_w8_exec.go kernel/k1_checker_w8.go
          if git diff --quiet -- kernel/k1_w8_json.go kernel/k1_w8_model.go kernel/k1_w8_exec.go kernel/k1_checker_w8.go; then
            echo 'W8_FORMAT_ALREADY_CLEAN'
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add kernel/k1_w8_json.go kernel/k1_w8_model.go kernel/k1_w8_exec.go kernel/k1_checker_w8.go
          git commit -m 'c3 w8: normalize Go source formatting'
          git push
