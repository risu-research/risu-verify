name: v0.7 to K1 Compatibility A0

on:
  push:
    branches:
      - k1-adversarial-gate-a0
    paths:
      - 'compatibility/v07_k1/VBE_CALIBRATION_4ROW_SNAPSHOT.json'
      - 'adapters/v07_to_k1_compat_a0.py'
      - 'tools/risu_v07_to_k1_compat_a0_verify.py'
      - 'kernel/k1_checker_w1.py'
      - 'docs/RISU_V07_TO_K1_COMPATIBILITY_A0.md'
      - '.github/workflows/v07-to-k1-compat-a0.yml'
  pull_request:
    paths:
      - 'compatibility/v07_k1/VBE_CALIBRATION_4ROW_SNAPSHOT.json'
      - 'adapters/v07_to_k1_compat_a0.py'
      - 'tools/risu_v07_to_k1_compat_a0_verify.py'
      - 'kernel/k1_checker_w1.py'
      - 'docs/RISU_V07_TO_K1_COMPATIBILITY_A0.md'
      - '.github/workflows/v07-to-k1-compat-a0.yml'

permissions:
  contents: read

jobs:
  compatibility-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run v0.7 to K1 adversarial compatibility gate
        run: python3 tools/risu_v07_to_k1_compat_a0_verify.py
