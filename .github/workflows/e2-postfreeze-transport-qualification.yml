name: E2 Post-Freeze Transport Qualification

on:
  push:
    branches: [e2-development]
    paths:
      - "tools/e2_postfreeze_transport_compat_errata.py"
      - ".github/workflows/e2-postfreeze-transport-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 8

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Verify frozen errata views and all scientific authorities
        shell: bash
        run: |
          set -euo pipefail
          PROTOCOL="protocols/RISU_DIFF_E2_POST_FREEZE_TRANSPORT_QUALIFICATION_v0.1.json"
          ERR1="protocols/RISU_DIFF_E2_POST_FREEZE_TRANSPORT_QUALIFICATION_v0.1_ERRATUM_001.json"
          ERR2="protocols/RISU_DIFF_E2_POST_FREEZE_TRANSPORT_QUALIFICATION_v0.1_ERRATUM_002.json"
          BUNDLE="experiments/risu-diff-e2/qualification/anchor-transport/blind58/E2_BLIND_58_ANCHOR_TRANSPORT_BUNDLE.json"
          FREEZE="experiments/risu-diff-e2/qualification/anchor-transport/blind58/E2_BLIND_58_ANCHOR_TRANSPORT_FREEZE_RECEIPT.json"
          ADMISSION="experiments/risu-diff-e2/qualification/anchor-transport/admission/E2_SANITIZED_OPAQUE_58_ADMISSION_MANIFEST.json"
          RECEIPT_SCHEMA="schemas/RISU_E2_MUTATION_BLIND_ANCHOR_TRANSPORT_RECEIPT_v0.1.schema.json"
          MATRIX="experiments/risu-diff-e2/qualification/MUTATION_QUALIFICATION_MATRIX_EXPANDED.jsonl"
          CELLS="experiments/risu-diff-e2/qualification/materialized/cells"

          test "$(git hash-object "$PROTOCOL")" = "8d1860312d259e628e86070416a4757c570ba05f"
          test "$(git hash-object "$ERR1")" = "a226d19994b55e7668658a94604db2d1ce07cb05"
          test "$(git hash-object "$ERR2")" = "663673cc3b1b4fdad07541dc0113b15de3e00fa2"
          test "$(git hash-object "$BUNDLE")" = "95f7338e6f21bc3e0a8fc3209296d2e98c1c6f12"
          echo "78c5f024c1af7a353844120879d3ec4487b5f56fb443bc6e063530f836a9f74c  $BUNDLE" | sha256sum -c -
          test "$(git hash-object "$FREEZE")" = "1c97eb8df5bafcfd8523ee6aba0c5a2b981b5df0"
          test "$(git hash-object "$ADMISSION")" = "f2fc78439d4bfadce5941bf71aadd15ec292bcb1"
          echo "847d85c2274cd6b94a83eefe0f6153a8fb183dbad758efa75118a4fd368623e4  $ADMISSION" | sha256sum -c -
          test "$(git hash-object "$RECEIPT_SCHEMA")" = "09a35d3c505b7ceaa0ecdefc682945fd61adfe37"
          test "$(git rev-parse HEAD:"$CELLS")" = "34a30574c7420728bff57958c815194979a622ab"
          echo "afd681d308a6f4ec8c183edd9b139c6b914fe501936cf84e5845a6a1c0d6b7cb  $MATRIX" | sha256sum -c -

          test "$(git hash-object tools/e2_postfreeze_transport_qualify.py)" = "3b5cbe1bac55503e135426ccaab5ed73b65e5480"
          test "$(git hash-object tools/e2_postfreeze_transport_audit.py)" = "9bae752a306c762576c2b10f8cafbf400674566b"
          test "$(git hash-object tools/e2_postfreeze_transport_qualify_erratum001.py)" = "e8fa82b3282253b33c4930c5d885a44db588909c"
          test "$(git hash-object tools/e2_postfreeze_transport_compat_errata.py)" = "d479596d6e2e683c067537be03a0d40e05e49cc4"
          python -m py_compile \
            tools/e2_postfreeze_transport_qualify.py \
            tools/e2_postfreeze_transport_audit.py \
            tools/e2_postfreeze_transport_compat_errata.py
          test "$(find "$CELLS" -mindepth 1 -maxdepth 1 -type d -name 'Q[0-9][0-9][0-9]' | wc -l)" -eq 58

      - name: Execute frozen qualifier twice through ERRATUM 001 plus 002 views
        shell: bash
        run: |
          set -euo pipefail
          PROTOCOL="protocols/RISU_DIFF_E2_POST_FREEZE_TRANSPORT_QUALIFICATION_v0.1.json"
          ERR1="protocols/RISU_DIFF_E2_POST_FREEZE_TRANSPORT_QUALIFICATION_v0.1_ERRATUM_001.json"
          ERR2="protocols/RISU_DIFF_E2_POST_FREEZE_TRANSPORT_QUALIFICATION_v0.1_ERRATUM_002.json"
          BUNDLE="experiments/risu-diff-e2/qualification/anchor-transport/blind58/E2_BLIND_58_ANCHOR_TRANSPORT_BUNDLE.json"
          ADMISSION="experiments/risu-diff-e2/qualification/anchor-transport/admission/E2_SANITIZED_OPAQUE_58_ADMISSION_MANIFEST.json"
          RECEIPT_SCHEMA="schemas/RISU_E2_MUTATION_BLIND_ANCHOR_TRANSPORT_RECEIPT_v0.1.schema.json"
          MATRIX="experiments/risu-diff-e2/qualification/MUTATION_QUALIFICATION_MATRIX_EXPANDED.jsonl"
          CELLS="experiments/risu-diff-e2/qualification/materialized/cells"
          OUT="$RUNNER_TEMP/e2-postfreeze-qualification"
          mkdir -p "$OUT/q1" "$OUT/q2" "$OUT/a1" "$OUT/a2"

          for d in q1 q2; do
            python tools/e2_postfreeze_transport_compat_errata.py qualify \
              --qualifier tools/e2_postfreeze_transport_qualify.py \
              --root "$GITHUB_WORKSPACE" \
              --protocol "$PROTOCOL" \
              --erratum1 "$ERR1" \
              --erratum2 "$ERR2" \
              --transport-bundle "$BUNDLE" \
              --admission "$ADMISSION" \
              --receipt-schema "$RECEIPT_SCHEMA" \
              --matrix "$MATRIX" \
              --cells "$CELLS" \
              --output "$OUT/$d/qualification.json" \
              --attestation "$OUT/$d/view-attestation.json"
          done
          cmp "$OUT/q1/qualification.json" "$OUT/q2/qualification.json"
          cmp "$OUT/q1/view-attestation.json" "$OUT/q2/view-attestation.json"

          for d in a1 a2; do
            python tools/e2_postfreeze_transport_compat_errata.py audit \
              --auditor tools/e2_postfreeze_transport_audit.py \
              --protocol "$PROTOCOL" \
              --erratum1 "$ERR1" \
              --erratum2 "$ERR2" \
              --transport-bundle "$BUNDLE" \
              --admission "$ADMISSION" \
              --receipt-schema "$RECEIPT_SCHEMA" \
              --matrix "$MATRIX" \
              --cells "$CELLS" \
              --qualification "$OUT/q1/qualification.json" \
              --output "$OUT/$d/audit.json" \
              --attestation "$OUT/$d/view-attestation.json"
          done
          cmp "$OUT/a1/audit.json" "$OUT/a2/audit.json"
          cmp "$OUT/a1/view-attestation.json" "$OUT/a2/view-attestation.json"

      - name: Freeze first complete joined output without outcome-driven modification
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/e2-postfreeze-qualification"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          out = Path(os.environ["RUNNER_TEMP"]) / "e2-postfreeze-qualification"
          qraw = (out / "q1/qualification.json").read_bytes()
          araw = (out / "a1/audit.json").read_bytes()
          qvraw = (out / "q1/view-attestation.json").read_bytes()
          avraw = (out / "a1/view-attestation.json").read_bytes()
          q = json.loads(qraw)
          a = json.loads(araw)
          qv = json.loads(qvraw)
          av = json.loads(avraw)
          h = lambda b: hashlib.sha256(b).hexdigest()

          # Integrity-only gates from the preregistered protocol. There is no
          # gate on any favorable transport rate, operator outcome, or narrative.
          assert q["status"] == "PASS"
          assert q["qualification_pass_meaning"] == "PROVENANCE_AND_AGGREGATION_INTEGRITY_ONLY"
          assert q["execution_head_sha"] == os.environ["GITHUB_SHA"]
          assert q["integrity"]["cell_count"] == 58
          assert q["integrity"]["transport_receipt_count"] == 58
          assert q["integrity"]["matrix_row_count"] == 58
          assert q["integrity"]["bijective_join_count"] == 58
          assert q["integrity"]["unconsumed_transport_receipts"] == 0
          assert q["integrity"]["excluded_cells"] == 0
          assert q["integrity"]["class_counts"] == {
              "M_PLUS_SEMANTIC_LOSS": 24,
              "M_QUESTION_EPISTEMIC_ADVERSARIAL": 10,
              "M_ZERO_SEMANTIC_PRESERVING": 24,
          }
          assert q["authorities"]["protocol_git_blob"] == "8d1860312d259e628e86070416a4757c570ba05f"
          assert q["authorities"]["transport_bundle_sha256"] == "78c5f024c1af7a353844120879d3ec4487b5f56fb443bc6e063530f836a9f74c"
          assert q["claim_boundary"] == {
              "a3_a4_verdict_logic_executed": False,
              "fresh_target_selection_or_evaluation_executed": False,
              "post_unblinding_cell_exclusion_performed": False,
              "post_unblinding_metric_redefinition_performed": False,
              "transport_outputs_modified": False,
          }
          assert a["status"] == "PASS" and not a["errors"] and a["case_count"] == 58
          assert a["qualification_sha256"] == h(qraw)
          assert a["bijective_join_recomputed_independently"] is True
          assert a["all_predeclared_aggregates_recomputed_independently"] is True
          assert a["qualifier_aggregation_code_imported"] is False
          assert a["transport_outputs_modified"] is False
          assert a["a3_a4_verdict_logic_executed"] is False

          for view, role, scientific_hash in ((qv, "qualifier", h(qraw)), (av, "auditor", h(araw))):
              assert view["status"] == "PASS"
              assert view["semantic_authority"] is False
              assert view["errata"] == {
                  "ERRATUM_001_OPERATOR_ID_REPRESENTATION": "a226d19994b55e7668658a94604db2d1ce07cb05",
                  "ERRATUM_002_TRANSPORT_RECEIPT_REPRESENTATION": "663673cc3b1b4fdad07541dc0113b15de3e00fa2",
              }
              assert view["projection_counts"] == {
                  "language_fields_projected": 58,
                  "other_receipt_fields_projected": 0,
                  "receipt_count": 58,
                  "receipt_digest_aliases_projected": 58,
              }
              assert view["method"]["raw_protocol_bytes_returned_to_frozen_tool_unchanged"] is True
              assert view["method"]["raw_bundle_bytes_returned_to_frozen_tool_unchanged"] is True
              assert view["method"]["frozen_tool_source_modified"] is False
              assert view["method"]["frozen_transport_bytes_modified"] is False
              assert view["method"]["join_key_semantics_modified"] is False
              assert view["method"]["metrics_modified"] is False
              assert view["method"]["strata_modified"] is False
              assert view["execution"]["role"] == role
              assert view["execution"]["scientific_output_sha256"] == scientific_hash
              assert view["execution"]["scientific_output_modified_after_frozen_tool_return"] is False
          assert qv["view_digests"] == av["view_digests"]

          receipt = {
              "schema": "risu.e2-post-freeze-transport-qualification-authoritative-execution/v0.2",
              "status": "PASS",
              "qualification_pass_meaning": "PROVENANCE_AND_AGGREGATION_INTEGRITY_ONLY",
              "head_sha": os.environ["GITHUB_SHA"],
              "case_count": 58,
              "class_counts": q["integrity"]["class_counts"],
              "qualification_sha256": h(qraw),
              "independent_audit_sha256": h(araw),
              "qualifier_view_attestation_sha256": h(qvraw),
              "auditor_view_attestation_sha256": h(avraw),
              "parent_protocol_git_blob": "8d1860312d259e628e86070416a4757c570ba05f",
              "erratum_001_git_blob": "a226d19994b55e7668658a94604db2d1ce07cb05",
              "erratum_002_git_blob": "663673cc3b1b4fdad07541dc0113b15de3e00fa2",
              "compatibility_wrapper_git_blob": "d479596d6e2e683c067537be03a0d40e05e49cc4",
              "frozen_qualifier_git_blob": "3b5cbe1bac55503e135426ccaab5ed73b65e5480",
              "frozen_independent_auditor_git_blob": "9bae752a306c762576c2b10f8cafbf400674566b",
              "frozen_transport_bundle_sha256": "78c5f024c1af7a353844120879d3ec4487b5f56fb443bc6e063530f836a9f74c",
              "expanded_truth_matrix_sha256": "afd681d308a6f4ec8c183edd9b139c6b914fe501936cf84e5845a6a1c0d6b7cb",
              "materialized_cells_tree_git_sha": "34a30574c7420728bff57958c815194979a622ab",
              "pre_execution_harness_staging_history": [
                  "d286e536ef7049f336c0c9b2c63331dff3d1dbba",
                  "2db33d8870d08cd64ad318cc0df7cccf30a9b6c4",
              ],
              "first_complete_joined_output_generated": True,
              "qualification_output_is_exact_frozen_tool_output": True,
              "outcome_driven_code_metric_or_join_modification_after_first_complete_output": False,
              "transport_outputs_modified": False,
              "a3_a4_verdict_logic_executed": False,
              "fresh_target_selection_or_evaluation_executed": False,
              "second_hosted_replay_required_before_final_repo_freeze": True,
              "next_authorized_step": "RERUN_THIS_EXACT_JOB_ON_THE_SAME_HEAD_WITHOUT_CODE_METRIC_JOIN_OR_VIEW_CHANGES; THEN BYTE-COMPARE_ALL_FIVE_LOGICAL_OUTPUTS_AND FREEZE THEM REGARDLESS_OF SCIENTIFIC_FAVORABILITY",
          }
          pre = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()
          receipt["receipt_digest_sha256"] = h(pre)
          raw = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()
          (out / "authoritative.json").write_bytes(raw)

          print(json.dumps({
              "status": "PASS",
              "case_count": 58,
              "qualification_sha256": h(qraw),
              "audit_sha256": h(araw),
              "qualifier_view_sha256": h(qvraw),
              "auditor_view_sha256": h(avraw),
              "receipt_sha256": h(raw),
          }, sort_keys=True, separators=(",", ":")))
          PY

          cp "$OUT/q1/qualification.json" E2_POSTFREEZE_TRANSPORT_QUALIFICATION.json
          cp "$OUT/a1/audit.json" E2_POSTFREEZE_TRANSPORT_QUALIFICATION_INDEPENDENT_AUDIT.json
          cp "$OUT/q1/view-attestation.json" E2_POSTFREEZE_TRANSPORT_QUALIFIER_COMPATIBILITY_VIEW_ATTESTATION.json
          cp "$OUT/a1/view-attestation.json" E2_POSTFREEZE_TRANSPORT_AUDITOR_COMPATIBILITY_VIEW_ATTESTATION.json
          cp "$OUT/authoritative.json" E2_POSTFREEZE_TRANSPORT_QUALIFICATION_AUTHORITATIVE_RECEIPT.json
          sha256sum E2_POSTFREEZE_TRANSPORT_*.json

      - name: Upload immutable first-complete-output artifact set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-postfreeze-transport-qualification-errata001-002
          path: |
            E2_POSTFREEZE_TRANSPORT_QUALIFICATION.json
            E2_POSTFREEZE_TRANSPORT_QUALIFICATION_INDEPENDENT_AUDIT.json
            E2_POSTFREEZE_TRANSPORT_QUALIFIER_COMPATIBILITY_VIEW_ATTESTATION.json
            E2_POSTFREEZE_TRANSPORT_AUDITOR_COMPATIBILITY_VIEW_ATTESTATION.json
            E2_POSTFREEZE_TRANSPORT_QUALIFICATION_AUTHORITATIVE_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
