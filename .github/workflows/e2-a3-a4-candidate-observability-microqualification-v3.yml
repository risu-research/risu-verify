name: E2 A3 A4 Candidate Observability Microqualification v3

on:
  push:
    branches: [e2-development]
    paths:
      - ".github/workflows/e2-a3-a4-candidate-observability-microqualification-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  microqualification-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.2"

      - name: Verify frozen scientific and fail-closed implementation authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object protocols/RISU_DIFF_E2_A3_A4_CANDIDATE_OBSERVABILITY_QUALIFICATION_v0.1.json)" = "cdd6dd1329c5fb77318f2ecf7c04c53cb9797b33"
          test "$(git hash-object experiments/risu-diff-e2/qualification/a3-a4/candidate-observability/E2_A3_A4_CANDIDATE_OBSERVABILITY_MICROFIXTURES_v0.1.json)" = "f990130b782ab242e4e341b45d0d58d298f4f316"
          test "$(git hash-object experiments/risu-diff-e2/qualification/a3-a4/candidate-observability/E2_A3_A4_CANDIDATE_OBSERVABILITY_MICROQUALIFICATION_IMPLEMENTATION_FREEZE_v0.1.2.json)" = "dfa315983099e5ce561672289922b115adced384"
          test "$(git hash-object tools/e2_candidate_observability_microcorpus_digest_compat.py)" = "87b6437ac895c901847e4f43b32173585fd3c789"
          test "$(git hash-object tools/e2_a3_a4_candidate_observability_microqualify.py)" = "204d45bab7395b545c736d83a3f4901b23febf3d"
          test "$(git hash-object tools/e2_a3_a4_candidate_observability_microqualify_v2.py)" = "720e1c50191d43e314a0cb847477508b6a510c62"
          test "$(git hash-object tools/e2_a3_a4_candidate_observability_microcheck.py)" = "867ac117f3396aee39f6756eb6b8e66f553c9096"
          test "$(git hash-object tools/e2_a3_a4_candidate_observability_microcheck_v2.py)" = "4baf300d2602b1185632164524f05de852d3e154"
          test "$(git hash-object risu_e2/path_observability.py)" = "6eae3403f53b86f85bac47a31e751d28508e7225"
          test "$(git hash-object risu_e2/acquisition.py)" = "b81aec3803c22a7b74d47fe1cfec5fabe71a3492"
          test "$(git hash-object risu_e2/model.py)" = "64baf95a4939f168881627830134b314a6ee6098"
          test "$(git hash-object risu_e2/ir.py)" = "d7edac40d4eeda86be74e5785bde3bfc28d4cf5e"
          test "$(git hash-object risu_e2/frontend_python.py)" = "e98cc7bbefa80d53b94fec3ef25845a3dbbedd93"
          test "$(git hash-object risu_e2/frontend_js.py)" = "6f3b6535caf0dcebb3c3c3679d898a23fdd8e795"
          test "$(git hash-object risu_e2/frontend_go.py)" = "4fc017fd65c8ede67cf11b5e27200c11bbac9d31"
          test "$(git hash-object risu_e2/observability_overlay.py)" = "77be5ea1dad30aa6daa889e0753ce7d1aaa6f07a"
          test "$(git hash-object risu_e2/overlay_common.py)" = "9975fe509fba30a2bbbbb8606f174faa5912a2f1"
          test "$(git hash-object risu_e2/overlay_control.py)" = "00e06b85d91ce9f75676476c5dc47d15d51d2d35"
          test "$(git hash-object risu_e2/overlay_source.py)" = "09f6e444cb20654cab1c7ac61ef45eaff44469d6"
          test "$(git hash-object tools/e2_go_ir_extract.go)" = "26e752029d1b4a99b47f1c7024740b7b0ae14ef7"
          echo "9eb55e2bd64f82f443a4765544f1d10e20166eb6a48076678a3e11835612d7ed  experiments/risu-diff-e2/qualification/a3-a4/candidate-observability/E2_A3_A4_CANDIDATE_OBSERVABILITY_MICROFIXTURES_v0.1.json" | sha256sum -c -
          ! grep -Eq 'e2_a3_a4_candidate_observability_microqualify_v2|risu_e2\.path_observability' tools/e2_a3_a4_candidate_observability_microcheck_v2.py
          ! grep -Eq 'from[[:space:]]+risu_e2\.path_observability|import[[:space:]]+risu_e2\.path_observability' tools/e2_a3_a4_candidate_observability_microcheck.py

      - name: Build sealed synthetic-only sandbox
        shell: bash
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/candidate-observability-micro-v3"
          mkdir -p "$S/risu_e2" "$S/tools" "$S/input" "$S/output"
          cp risu_e2/*.py "$S/risu_e2/"
          cp tools/e2_go_ir_extract.go "$S/tools/"
          cp tools/e2_candidate_observability_microcorpus_digest_compat.py "$S/tools/"
          cp tools/e2_a3_a4_candidate_observability_microqualify.py "$S/tools/"
          cp tools/e2_a3_a4_candidate_observability_microqualify_v2.py "$S/tools/"
          cp tools/e2_a3_a4_candidate_observability_microcheck.py "$S/tools/"
          cp tools/e2_a3_a4_candidate_observability_microcheck_v2.py "$S/tools/"
          cp protocols/RISU_DIFF_E2_A3_A4_CANDIDATE_OBSERVABILITY_QUALIFICATION_v0.1.json "$S/input/protocol.json"
          cp experiments/risu-diff-e2/qualification/a3-a4/candidate-observability/E2_A3_A4_CANDIDATE_OBSERVABILITY_MICROFIXTURES_v0.1.json "$S/input/corpus.frozen.json"
          cp experiments/risu-diff-e2/qualification/a3-a4/candidate-observability/E2_A3_A4_CANDIDATE_OBSERVABILITY_MICROQUALIFICATION_IMPLEMENTATION_FREEZE_v0.1.2.json "$S/input/implementation-freeze.json"
          python "$S/tools/e2_candidate_observability_microcorpus_digest_compat.py" \
            --input "$S/input/corpus.frozen.json" \
            --output "$S/input/corpus.compat.json" \
            --attestation "$S/output/corpus-compat-attestation.json"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          s=Path(os.environ['RUNNER_TEMP'])/'candidate-observability-micro-v3'
          old=json.loads((s/'input/corpus.frozen.json').read_bytes()); new=json.loads((s/'input/corpus.compat.json').read_bytes())
          od=old.pop('corpus_digest_sha256'); nd=new.pop('corpus_digest_sha256')
          assert old==new
          assert od=='720029930f003b3a0cc66691a3b3dd09c10617aedb603780f80bda1a7ac1ab04'
          assert nd=='8d5c5cc3cac3603c8b2b4be8324d0803d8886380865046a55ef97fbaadf3771f'
          assert old['fixture_count']==48 and old['family_count']==16
          assert old['claim_boundary']['candidate_58_bytes_included'] is False
          files=[]
          for p in sorted(x for x in s.rglob('*') if x.is_file()):
              rel=p.relative_to(s).as_posix(); raw=p.read_bytes()
              files.append({'path':rel,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
          forbidden=('materialized/cells','SANITIZED_OPAQUE_58','BLIND_58_ANCHOR_TRANSPORT','admission.json','transport.json')
          assert not any(any(token in x['path'] for token in forbidden) for x in files)
          doc={'schema':'risu.e2-a3-a4-candidate-observability-micro-sandbox-inventory/v0.2','status':'PASS','candidate_58_bytes_staged':False,'file_count':len(files),'files':files}
          raw=json.dumps(doc,sort_keys=True,separators=(',',':')).encode(); (s/'output/sandbox-inventory.json').write_bytes(raw)
          print(json.dumps({'status':'PASS','candidate_58_bytes_staged':False,'files':len(files),'sha256':hashlib.sha256(raw).hexdigest()},sort_keys=True,separators=(',',':')))
          PY
          python -m py_compile "$S"/risu_e2/*.py "$S"/tools/*.py

      - name: Emit two complete primary matrices and two independent audits
        shell: bash
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/candidate-observability-micro-v3"
          restore_repo() { chmod u+rwx "$GITHUB_WORKSPACE" 2>/dev/null || true; }
          trap restore_repo EXIT
          chmod a-rwx "$GITHUB_WORKSPACE"
          cd "$S"
          export PYTHONPATH="$S:$S/tools"
          set +e
          python tools/e2_a3_a4_candidate_observability_microqualify_v2.py --protocol input/protocol.json --corpus input/corpus.compat.json --go-helper tools/e2_go_ir_extract.go --output output/primary-1.json
          P1=$?
          python tools/e2_a3_a4_candidate_observability_microqualify_v2.py --protocol input/protocol.json --corpus input/corpus.compat.json --go-helper tools/e2_go_ir_extract.go --output output/primary-2.json
          P2=$?
          A1=99; A2=99
          if test -f output/primary-1.json; then
            python tools/e2_a3_a4_candidate_observability_microcheck_v2.py --protocol input/protocol.json --corpus input/corpus.compat.json --primary output/primary-1.json --go-helper tools/e2_go_ir_extract.go --output output/audit-1.json
            A1=$?
            python tools/e2_a3_a4_candidate_observability_microcheck_v2.py --protocol input/protocol.json --corpus input/corpus.compat.json --primary output/primary-1.json --go-helper tools/e2_go_ir_extract.go --output output/audit-2.json
            A2=$?
          fi
          set -e
          test -f output/primary-1.json && test -f output/primary-2.json
          test -f output/audit-1.json && test -f output/audit-2.json
          test "$P1" -eq "$P2"
          test "$P1" -eq 0 -o "$P1" -eq 1
          test "$A1" -eq 0 && test "$A2" -eq 0
          cmp output/primary-1.json output/primary-2.json
          cmp output/audit-1.json output/audit-2.json
          python - "$P1" "$P2" "$A1" "$A2" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          p1,p2,a1,a2=map(int,sys.argv[1:]); out=Path('output')
          primary=json.loads((out/'primary-1.json').read_bytes()); audit=json.loads((out/'audit-1.json').read_bytes())
          assert primary['fixture_count']==48 and primary['family_count']==16 and primary['complete_matrix_emitted'] is True and len(primary['rows'])==48
          assert audit['fixture_count']==48 and audit['family_count']==16 and audit['complete_matrix_independently_replayed'] is True and len(audit['rows'])==48
          assert audit['status']=='PASS' and not audit['integrity_errors']
          assert audit['qualification_status']==primary['status']
          assert sorted(audit['qualification_failed_fixture_ids'])==sorted(primary['failed_fixture_ids'])
          assert primary['read_set_attestation']['candidate_58_bytes'] is False and audit['read_set_attestation']['candidate_58_bytes'] is False
          h=lambda n:hashlib.sha256((out/n).read_bytes()).hexdigest()
          doc={'schema':'risu.e2-a3-a4-candidate-observability-micro-run-diagnostic/v0.2','execution_integrity_status':'PASS','qualification_status':primary['status'],'fixture_count':48,'family_count':16,'failed_fixture_ids':primary['failed_fixture_ids'],'infrastructure_invalid_fixture_ids':primary['infrastructure_invalid_fixture_ids'],'primary_return_codes':[p1,p2],'independent_return_codes':[a1,a2],'primary_byte_identical':True,'independent_byte_identical':True,'primary_sha256':h('primary-1.json'),'independent_audit_sha256':h('audit-1.json'),'candidate_58_bytes_read':False}
          raw=json.dumps(doc,sort_keys=True,separators=(',',':')).encode(); (out/'run-diagnostic.json').write_bytes(raw)
          print(json.dumps(doc,sort_keys=True,separators=(',',':')))
          PY
          restore_repo
          trap - EXIT

      - name: Emit hosted execution receipt without changing scientific status
        shell: bash
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/candidate-observability-micro-v3"
          O="$S/output"
          python - <<'PY'
          import hashlib,json,os,platform,subprocess
          from pathlib import Path
          o=Path(os.environ['RUNNER_TEMP'])/'candidate-observability-micro-v3/output'
          names=['primary-1.json','audit-1.json','corpus-compat-attestation.json','sandbox-inventory.json','run-diagnostic.json']
          raw={n:(o/n).read_bytes() for n in names}
          primary=json.loads(raw['primary-1.json']); audit=json.loads(raw['audit-1.json']); diag=json.loads(raw['run-diagnostic.json'])
          assert primary['complete_matrix_emitted'] is True and len(primary['rows'])==48
          assert audit['status']=='PASS' and audit['complete_matrix_independently_replayed'] is True and not audit['integrity_errors']
          assert diag['execution_integrity_status']=='PASS' and diag['qualification_status']==primary['status']
          h=lambda b:hashlib.sha256(b).hexdigest()
          receipt={
            'schema':'risu.e2-a3-a4-candidate-observability-microqualification-hosted-receipt/v0.2',
            'execution_integrity_status':'PASS',
            'qualification_status':primary['status'],
            'fixture_count':48,
            'family_count':16,
            'failed_fixture_ids':primary['failed_fixture_ids'],
            'infrastructure_invalid_fixture_ids':primary['infrastructure_invalid_fixture_ids'],
            'logical_artifacts':{n:{'sha256':h(raw[n]),'bytes':len(raw[n])} for n in names},
            'within_host':{'primary_runs':2,'independent_runs':2,'primary_byte_identical':True,'independent_byte_identical':True},
            'authority':{'protocol_git_blob':'cdd6dd1329c5fb77318f2ecf7c04c53cb9797b33','corpus_git_blob':'f990130b782ab242e4e341b45d0d58d298f4f316','implementation_freeze_git_blob':'dfa315983099e5ce561672289922b115adced384','primary_v2_git_blob':'720e1c50191d43e314a0cb847477508b6a510c62','independent_v2_git_blob':'4baf300d2602b1185632164524f05de852d3e154','path_observability_git_blob':'6eae3403f53b86f85bac47a31e751d28508e7225'},
            'hosted_provenance':{'github_run_id':os.environ['GITHUB_RUN_ID'],'github_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'github_sha':os.environ['GITHUB_SHA'],'runner_os':os.environ.get('RUNNER_OS'),'runner_arch':os.environ.get('RUNNER_ARCH'),'python':platform.python_version(),'go':subprocess.check_output(['go','version'],text=True).strip()},
            'read_set_attestation':{'candidate_58_bytes':False,'sanitized_58_manifest':False,'raw_blind_58_transport':False,'mutation_truth':False,'operator_metadata':False,'expected_e2_predictions':False,'fresh_target_bytes':False},
            'claim_boundary':{'microqualification_only':True,'a3_a4_semantic_verdicts_emitted':False,'mutant_58_observability_executed':False,'scientific_failure_if_any_preserved_without_repair':True}
          }
          pre=json.dumps(receipt,sort_keys=True,separators=(',',':')).encode(); receipt['receipt_digest_sha256']=h(pre)
          b=json.dumps(receipt,sort_keys=True,separators=(',',':')).encode(); (o/'hosted-receipt.json').write_bytes(b)
          print(json.dumps({'execution_integrity_status':'PASS','qualification_status':primary['status'],'failed':len(primary['failed_fixture_ids']),'receipt_sha256':h(b)},sort_keys=True,separators=(',',':')))
          PY
          cp "$O/primary-1.json" E2_A3_A4_CANDIDATE_OBSERVABILITY_MICROQUALIFICATION_PRIMARY.json
          cp "$O/audit-1.json" E2_A3_A4_CANDIDATE_OBSERVABILITY_MICROQUALIFICATION_INDEPENDENT_AUDIT.json
          cp "$O/corpus-compat-attestation.json" E2_A3_A4_CANDIDATE_OBSERVABILITY_MICROQUALIFICATION_CORPUS_COMPAT_ATTESTATION.json
          cp "$O/sandbox-inventory.json" E2_A3_A4_CANDIDATE_OBSERVABILITY_MICROQUALIFICATION_SANDBOX_INVENTORY.json
          cp "$O/run-diagnostic.json" E2_A3_A4_CANDIDATE_OBSERVABILITY_MICROQUALIFICATION_RUN_DIAGNOSTIC.json
          cp "$O/hosted-receipt.json" E2_A3_A4_CANDIDATE_OBSERVABILITY_MICROQUALIFICATION_HOSTED_RECEIPT.json
          sha256sum E2_A3_A4_CANDIDATE_OBSERVABILITY_MICROQUALIFICATION_*.json

      - name: Upload complete logical outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-a3-a4-candidate-observability-microqualification-v3-attempt-${{ github.run_attempt }}
          path: |
            E2_A3_A4_CANDIDATE_OBSERVABILITY_MICROQUALIFICATION_PRIMARY.json
            E2_A3_A4_CANDIDATE_OBSERVABILITY_MICROQUALIFICATION_INDEPENDENT_AUDIT.json
            E2_A3_A4_CANDIDATE_OBSERVABILITY_MICROQUALIFICATION_CORPUS_COMPAT_ATTESTATION.json
            E2_A3_A4_CANDIDATE_OBSERVABILITY_MICROQUALIFICATION_SANDBOX_INVENTORY.json
            E2_A3_A4_CANDIDATE_OBSERVABILITY_MICROQUALIFICATION_RUN_DIAGNOSTIC.json
            E2_A3_A4_CANDIDATE_OBSERVABILITY_MICROQUALIFICATION_HOSTED_RECEIPT.json
          if-no-files-found: warn
          retention-days: 30
