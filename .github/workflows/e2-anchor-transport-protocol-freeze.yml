name: E2 Anchor Transport Protocol Freeze

on:
  push:
    branches:
      - e2-development
    paths:
      - ".github/workflows/e2-anchor-transport-protocol-freeze.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 3

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Assert frozen Git identities and additive diff
        run: |
          set -euo pipefail
          test "$(git hash-object protocols/RISU_DIFF_E2_MUTATION_BLIND_ANCHOR_TRANSPORT_v0.1.json)" = "7da7d3ac536d5edda56aa2c2636db1c8b02569b3"
          test "$(git hash-object protocols/RISU_DIFF_E2_MUTATION_BLIND_ANCHOR_TRANSPORT_QUALIFICATION_v0.1.json)" = "b15de9fb465efc52adc57fe2a5f00236a398c313"
          test "$(git hash-object schemas/RISU_E2_MUTATION_BLIND_ANCHOR_TRANSPORT_RECEIPT_v0.1.schema.json)" = "09a35d3c505b7ceaa0ecdefc682945fd61adfe37"
          test "$(git hash-object protocols/RISU_DIFF_E2_MUTATION_BLIND_ANCHOR_TRANSPORT_DESIGN_FREEZE_MANIFEST_v0.2.json)" = "9a3c82e2c8317778abbc4d2abf217c9de2e1d488"
          test "$(git rev-parse 588e813ac69ade78407bb503da6d653da2854344^{tree})" = "853dd5ba6c52ebbec45dc0972d05cf422276c83f"
          git diff --name-only e848be3cb39c098073f3638eac9d798749f13e63 588e813ac69ade78407bb503da6d653da2854344 > freeze_paths.txt
          cat > expected_paths.txt <<'EOF'
          protocols/RISU_DIFF_E2_MUTATION_BLIND_ANCHOR_TRANSPORT_DESIGN_FREEZE_MANIFEST_v0.2.json
          protocols/RISU_DIFF_E2_MUTATION_BLIND_ANCHOR_TRANSPORT_QUALIFICATION_v0.1.json
          protocols/RISU_DIFF_E2_MUTATION_BLIND_ANCHOR_TRANSPORT_v0.1.json
          schemas/RISU_E2_MUTATION_BLIND_ANCHOR_TRANSPORT_RECEIPT_v0.1.schema.json
          EOF
          diff -u expected_paths.txt freeze_paths.txt
          test "$(git hash-object risu_e2/model.py)" = "64baf95a4939f168881627830134b314a6ee6098"
          test "$(git hash-object risu_e2/ir.py)" = "d7edac40d4eeda86be74e5785bde3bfc28d4cf5e"

      - name: Recompute semantic and raw digests twice
        run: |
          set -euo pipefail
          mkdir -p attempt1 attempt2
          for d in attempt1 attempt2; do
            OUT="$d/E2_ANCHOR_TRANSPORT_PROTOCOL_STATIC_VALIDATION_RECEIPT.json" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          files = {
              "protocols/RISU_DIFF_E2_MUTATION_BLIND_ANCHOR_TRANSPORT_v0.1.json": {
                  "git_blob_sha": "7da7d3ac536d5edda56aa2c2636db1c8b02569b3",
                  "canonical_semantic_sha256": "a9c50caa20ed65cadb42d27ad14c0fbedb7a3f0bf344a2e50dc8269ce1314854",
              },
              "protocols/RISU_DIFF_E2_MUTATION_BLIND_ANCHOR_TRANSPORT_QUALIFICATION_v0.1.json": {
                  "git_blob_sha": "b15de9fb465efc52adc57fe2a5f00236a398c313",
                  "canonical_semantic_sha256": "48a3cace9ff31b39204f9d7b4f466c2be38deb118fe41f2b3fbb918a795ce51f",
              },
              "schemas/RISU_E2_MUTATION_BLIND_ANCHOR_TRANSPORT_RECEIPT_v0.1.schema.json": {
                  "git_blob_sha": "09a35d3c505b7ceaa0ecdefc682945fd61adfe37",
                  "canonical_semantic_sha256": "c2fbcefefdc47bd8a75fcc1098f20ab3d9037094b45c4c454729e937986c0f67",
              },
              "protocols/RISU_DIFF_E2_MUTATION_BLIND_ANCHOR_TRANSPORT_DESIGN_FREEZE_MANIFEST_v0.2.json": {
                  "git_blob_sha": "9a3c82e2c8317778abbc4d2abf217c9de2e1d488",
                  "canonical_semantic_sha256": "95e3a9deea4eb5b115517654528c4de2029aee363b36ebe3cd1a8b230b9f176a",
              },
          }
          rows = []
          for path, expected in sorted(files.items()):
              raw = Path(path).read_bytes()
              obj = json.loads(raw.decode("utf-8"))
              canonical = json.dumps(obj, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
              semantic_sha = hashlib.sha256(canonical).hexdigest()
              assert semantic_sha == expected["canonical_semantic_sha256"], (path, semantic_sha)
              rows.append({
                  "path": path,
                  "bytes": len(raw),
                  "raw_sha256": hashlib.sha256(raw).hexdigest(),
                  "canonical_semantic_sha256": semantic_sha,
                  "git_blob_sha": expected["git_blob_sha"],
              })

          protocol = json.loads(Path("protocols/RISU_DIFF_E2_MUTATION_BLIND_ANCHOR_TRANSPORT_v0.1.json").read_text())
          qual = json.loads(Path("protocols/RISU_DIFF_E2_MUTATION_BLIND_ANCHOR_TRANSPORT_QUALIFICATION_v0.1.json").read_text())
          assert protocol["status"] == "PRE_IMPLEMENTATION_TRANSPORT_PROTOCOL_FROZEN"
          assert protocol["authoring_firewall"]["materialized_mutant_cells_consulted"] is False
          assert protocol["authoring_firewall"]["mutation_truth_consulted"] is False
          assert protocol["authoring_firewall"]["expected_e2_predictions_consulted"] is False
          assert protocol["authoring_firewall"]["mutation_operator_id_name_or_class_consulted"] is False
          assert protocol["claim_boundary"]["a3_a4_verdict_logic_authorized"] is False
          assert "58_CANDIDATE_REVISIONS_YET" in protocol["next_authorized_step"]
          assert qual["status"] == "PRE_IMPLEMENTATION_QUALIFICATION_FROZEN"
          assert qual["fixture_policy"]["family_count"] == 12
          assert qual["fixture_policy"]["required_languages"] == ["python", "go", "typescript_javascript"]
          assert len(qual["qualification_gates"]) == 12

          receipt = {
              "schema": "risu.e2-anchor-transport-protocol-static-validation/v0.1",
              "status": "PASS",
              "scientific_freeze_commit": "588e813ac69ade78407bb503da6d653da2854344",
              "scientific_freeze_tree": "853dd5ba6c52ebbec45dc0972d05cf422276c83f",
              "pre_freeze_head": "e848be3cb39c098073f3638eac9d798749f13e63",
              "files": rows,
              "read_set": {
                  "materialized_58_candidate_revision_bytes": False,
                  "mutation_truth": False,
                  "expected_e2_predictions": False,
                  "mutation_operator_metadata": False,
                  "fresh_target_bytes": False,
              },
              "claim_boundary": {
                  "transport_engine_implemented": False,
                  "candidate_58_transport_authorized": False,
                  "a3_a4_verdict_logic_authorized": False,
              },
          }
          out = json.dumps(receipt, sort_keys=True, separators=(",", ":"), ensure_ascii=False)
          Path(os.environ["OUT"]).write_text(out, encoding="utf-8")
          print(json.dumps({"status":"PASS","receipt_sha256":hashlib.sha256(out.encode()).hexdigest()}, separators=(",", ":")))
          PY
          done
          cmp attempt1/E2_ANCHOR_TRANSPORT_PROTOCOL_STATIC_VALIDATION_RECEIPT.json attempt2/E2_ANCHOR_TRANSPORT_PROTOCOL_STATIC_VALIDATION_RECEIPT.json
          cp attempt1/E2_ANCHOR_TRANSPORT_PROTOCOL_STATIC_VALIDATION_RECEIPT.json E2_ANCHOR_TRANSPORT_PROTOCOL_STATIC_VALIDATION_RECEIPT.json
          sha256sum E2_ANCHOR_TRANSPORT_PROTOCOL_STATIC_VALIDATION_RECEIPT.json

      - name: Upload validation receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-anchor-transport-protocol-freeze
          path: |
            E2_ANCHOR_TRANSPORT_PROTOCOL_STATIC_VALIDATION_RECEIPT.json
            attempt1/E2_ANCHOR_TRANSPORT_PROTOCOL_STATIC_VALIDATION_RECEIPT.json
            attempt2/E2_ANCHOR_TRANSPORT_PROTOCOL_STATIC_VALIDATION_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
