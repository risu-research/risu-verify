name: Public dataset schema smoke test
on:
  push:
    paths:
      - 'tools/public_dataset_schema_check.py'
      - '.github/workflows/public-dataset-schema.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/public_dataset_schema_check.py
