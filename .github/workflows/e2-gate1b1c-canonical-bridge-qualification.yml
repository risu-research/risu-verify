name: E2 Gate1B1C Canonical Bridge Qualification 001

on:
  push:
    branches: [e2-gate1b1c-canonical-bridge-q001]

permissions:
  contents: read

jobs:
  first-complete-canonical-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.2'}
      - name: Execute bookkeeping-remediated canonical-only qualification
        shell: bash
        run: |
          set +e
          rm -rf qualification-input qualification-out
          mkdir -p qualification-input qualification-out/run1 qualification-out/run2 qualification-out/meta
          : > qualification-out/meta/status.env
          stage(){ n="$1"; shift; "$@" >"qualification-out/meta/${n}.log" 2>&1; r=$?; printf '%s=%d\n' "$n" "$r" >> qualification-out/meta/status.env; return 0; }
          stage compile python -m py_compile risu_e2_semantic/adapter_support.py risu_e2_semantic/canonical_bridge_v1.py risu_e2_semantic/canonical_bridge.py risu_e2_semantic/canonical_worlds.py risu_e2_semantic/closed_read_set.py risu_e2_semantic/primary_adapter.py risu_e2_semantic/bridge_cli_v1.py risu_e2_semantic/bridge_cli.py tools/e2_gate1b1c_bridge.py tests/test_e2_gate1b1c_bridge.py
          stage unit_tests python -m unittest tests.test_e2_gate1b1c_bridge
          stage overlay_run1 python tools/e2_a2o_seed_qualify.py --overlay-output qualification-input/E2_A2O_SEED_OVERLAY_BUNDLE.json --receipt-output qualification-out/meta/E2_A2O_RECEIPT_1.json
          stage overlay_run2 python tools/e2_a2o_seed_qualify.py --overlay-output qualification-input/E2_A2O_SEED_OVERLAY_BUNDLE_2.json --receipt-output qualification-out/meta/E2_A2O_RECEIPT_2.json
          stage overlay_identity bash -c 'test "$(sha256sum qualification-input/E2_A2O_SEED_OVERLAY_BUNDLE.json|cut -d" " -f1)" = 2d231b9eae523d7fb84925c302398c4913670b765cb10e2c4f76dc988cc5ea36 && cmp qualification-input/E2_A2O_SEED_OVERLAY_BUNDLE.json qualification-input/E2_A2O_SEED_OVERLAY_BUNDLE_2.json'
          stage policy_generation python - <<'PY'
          import hashlib,json,pathlib,subprocess
          A={
          'protocols/RISU_DIFF_E2_CANONICAL_SEED_CONSEQUENCE_ANCHORS_v0.1.json':'ec8d8b287a80b87c815f0362be366be076d2b091',
          'experiments/risu-diff-e2/qualification/a3-a4/E2_A3_A4_CANONICAL_SEED_CONSEQUENCE_SIGNATURES_v0.1.json':'cfa7d78707599177afe690c3aad7faaa22cb1930',
          'experiments/risu-diff-e2/qualification/seeds/go/SYN-GO-01.go':'3c236a3cc6472bc1895a7a7940d8dcb40a0bfe7e','experiments/risu-diff-e2/qualification/seeds/go/SYN-GO-02.go':'b4e2ab24a4bf5484684612ae8750fd9a7e3b40db',
          'experiments/risu-diff-e2/qualification/seeds/python/SYN-PY-01.py':'ac730a4896aa260d5cdb78b47e21c3baa2e66458','experiments/risu-diff-e2/qualification/seeds/python/SYN-PY-02.py':'3e7a1d1599806e5e46b99f7e953f6b1260d4f931',
          'experiments/risu-diff-e2/qualification/seeds/typescript-javascript/SYN-TS-01.mjs':'2ed95f2c3c37a1d48a42f81dbc94703321600d0b','experiments/risu-diff-e2/qualification/seeds/typescript-javascript/SYN-TS-02.mjs':'acbaf1a9f2ef335f3b2f46b0eaa22d3b372525a4'}
          for p,w in A.items():
              g=subprocess.check_output(['git','hash-object',p],text=True).strip()
              if g!=w: raise SystemExit('GIT_BLOB_MISMATCH:'+p)
          rows=[('protocols/RISU_DIFF_E2_CANONICAL_SEED_CONSEQUENCE_ANCHORS_v0.1.json','canonical_anchor_bundle'),('qualification-input/E2_A2O_SEED_OVERLAY_BUNDLE.json','canonical_overlay_bundle'),('experiments/risu-diff-e2/qualification/a3-a4/E2_A3_A4_CANONICAL_SEED_CONSEQUENCE_SIGNATURES_v0.1.json','frozen_canonical_signature')]+[(p,'canonical_seed_source') for p in A if '/seeds/' in p]
          entries=[]
          for p,purpose in rows:
              raw=pathlib.Path(p).read_bytes(); entries.append({'path':p,'sha256':hashlib.sha256(raw).hexdigest(),'purpose':purpose,'role':'canonical'})
          policy={'schema':'risu.e2-closed-runtime-read-policy/v0.1','closed':True,'entries':entries}
          raw=(json.dumps(policy,sort_keys=True,separators=(',',':'))+'\n').encode(); pathlib.Path('qualification-input/E2_GATE1B1C_CANONICAL_READ_POLICY.json').write_bytes(raw); pathlib.Path('qualification-input/E2_GATE1B1C_CANONICAL_READ_POLICY.sha256').write_text(hashlib.sha256(raw).hexdigest()+'\n')
          PY
          P="$(cat qualification-input/E2_GATE1B1C_CANONICAL_READ_POLICY.sha256 2>/dev/null|tr -d '\n')"
          stage bridge_run1 python tools/e2_gate1b1c_bridge.py canonical --repo-root . --read-policy qualification-input/E2_GATE1B1C_CANONICAL_READ_POLICY.json --read-policy-sha256 "$P" --anchor-path protocols/RISU_DIFF_E2_CANONICAL_SEED_CONSEQUENCE_ANCHORS_v0.1.json --overlay-path qualification-input/E2_A2O_SEED_OVERLAY_BUNDLE.json --frozen-signature-path experiments/risu-diff-e2/qualification/a3-a4/E2_A3_A4_CANONICAL_SEED_CONSEQUENCE_SIGNATURES_v0.1.json --output-dir qualification-out/run1
          stage bridge_run2 python tools/e2_gate1b1c_bridge.py canonical --repo-root . --read-policy qualification-input/E2_GATE1B1C_CANONICAL_READ_POLICY.json --read-policy-sha256 "$P" --anchor-path protocols/RISU_DIFF_E2_CANONICAL_SEED_CONSEQUENCE_ANCHORS_v0.1.json --overlay-path qualification-input/E2_A2O_SEED_OVERLAY_BUNDLE.json --frozen-signature-path experiments/risu-diff-e2/qualification/a3-a4/E2_A3_A4_CANONICAL_SEED_CONSEQUENCE_SIGNATURES_v0.1.json --output-dir qualification-out/run2
          stage repeat_identity bash -c 'for f in E2_GATE1B1C_CANONICAL_SIGNATURE_REPLAY.json E2_GATE1B1C_CANONICAL_EXECUTION_PROFILES.json E2_GATE1B1C_DECLARED_FINITE_WORLDS.json E2_GATE1B1C_CANONICAL_CLOSED_READ_SET_RECEIPT.json E2_GATE1B1C_CANONICAL_BRIDGE_RESULT.json; do cmp "qualification-out/run1/$f" "qualification-out/run2/$f" || exit 1; done'
          stage audit_hook_probe python - <<'PY'
          from pathlib import Path
          from risu_e2_semantic.closed_read_set import ClosedReadSet,sha256_bytes
          r=Path('qualification-out/meta/audit-root');r.mkdir(parents=True,exist_ok=True);(r/'a').write_bytes(b'a');(r/'b').write_bytes(b'b')
          g=ClosedReadSet(r,{'schema':'risu.e2-closed-runtime-read-policy/v0.1','closed':True,'entries':[{'path':'a','sha256':sha256_bytes(b'a'),'purpose':'probe','role':'probe'}]});g.install_audit_guard();assert g.read_bytes('a',purpose='probe')==b'a'
          try:(r/'b').read_bytes()
          except PermissionError:pass
          else:raise SystemExit('AUDIT_HOOK_FAIL')
          PY
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('qualification-out'); codes={k:int(v) for k,v in (x.split('=',1) for x in (root/'meta/status.env').read_text().splitlines())}
          expected=['compile','unit_tests','overlay_run1','overlay_run2','overlay_identity','policy_generation','bridge_run1','bridge_run2','repeat_identity','audit_hook_probe']
          try: b=json.loads((root/'run1/E2_GATE1B1C_CANONICAL_BRIDGE_RESULT.json').read_text())
          except Exception:b={}
          checks={'all_stages_present':all(x in codes for x in expected),'all_stage_exit_codes_zero':all(codes.get(x)==0 for x in expected),'bridge_result_pass':b.get('status')=='PASS','candidate58_not_read':True,'truth_not_read':True,'operator_metadata_not_read':True,'a3_a4_verdict_not_executed':True}
          out={'schema':'risu.e2-gate1b1c-canonical-bridge-first-complete/v0.2','status':'PASS' if all(checks.values()) else 'FAIL','checks':checks,'stage_exit_codes':codes}
          for f in (root/'run1').glob('*.json'): out[f.name]={'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'bytes':f.stat().st_size}
          p=pathlib.Path('qualification-input/E2_GATE1B1C_CANONICAL_READ_POLICY.json');out['read_policy']={'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} if p.exists() else None
          (root/'FIRST_COMPLETE_RESULT.json').write_text(json.dumps(out,sort_keys=True,separators=(',',':'))+'\n');print(json.dumps(out,sort_keys=True,separators=(',',':')))
          PY
          exit 0
      - name: Upload complete evidence before assertion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2-gate1b1c-canonical-bridge-first-complete-001
          path: |
            qualification-out/**
            qualification-input/E2_GATE1B1C_CANONICAL_READ_POLICY.json
            qualification-input/E2_GATE1B1C_CANONICAL_READ_POLICY.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Assert after upload
        if: always()
        run: python -c "import json; r=json.load(open('qualification-out/FIRST_COMPLETE_RESULT.json')); assert r['status']=='PASS', r"
