name: E2 Frozen48 Helper Polarity Final Checker Only Adjudication

on:
  push:
    paths:
      - '.github/workflows/e2-frozen48-helper-polarity-final-checker-only-adjudication.yml'

permissions:
  contents: read

env:
  REPO: risu-research/risu-verify
  AUTHORITY_FREEZE: 7ac56ebfd873eb7531e55c7c26c3de8c0172eb42
  ROOT: /tmp/e2-f48-hp-final-adjudication
  EXACT_ZIP_BLOB: 12c369980df4e0182780558d896cf0f3e20162cb
  EXACT_ZIP_SHA256: c73d0b167edc10fbac7103a93317dc674f57bd0e6e0d699bc8e8a23b5ea6fb23
  EXACT_ZIP_BYTES: '78188'

jobs:
  adjudication:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify workflow-only child of frozen archive authority erratum
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']; sha=os.environ['CURRENT_SHA']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'risu-f48-final-adjudication-lineage'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/commits/{sha}',headers=headers)
          with urllib.request.urlopen(req,timeout=30) as r: doc=json.loads(r.read())
          if [p['sha'] for p in doc.get('parents',[])] != [os.environ['AUTHORITY_FREEZE']]: raise SystemExit('FINAL_WORKFLOW_PARENT_NOT_AUTHORITY_FREEZE')
          files=[f['filename'] for f in doc.get('files',[])]
          if files != ['.github/workflows/e2-frozen48-helper-polarity-final-checker-only-adjudication.yml']: raise SystemExit('FINAL_WORKFLOW_COMMIT_NOT_SINGLE_FILE')
          print('FINAL_ADJUDICATION_LINEAGE=PASS')
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Materialize exact immutable checker-only authorities without checkout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT" && mkdir -p "$ROOT/input" "$ROOT/output"
          python3 - <<'PY'
          import ast,base64,hashlib,json,os,pathlib,urllib.request
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']; root=pathlib.Path(os.environ['ROOT'])
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'risu-f48-final-adjudication-materialize'}
          specs={
            'input/first-complete.zip':'12c369980df4e0182780558d896cf0f3e20162cb',
            'input/protocol.json':'8f627d049ae99348b21837183db5c84fcfa3346a',
            'input/semantic-erratum.json':'7c30d486099032a5579fe3080f5ed05819b33305',
            'input/archive-authority-erratum.json':'a1e5e6c6979a3ca19a6969d42e884f3d59a34168',
            'input/diagnosis.json':'92d603eb738bfbb16248a04cf4101119929d5eda',
            'input/historical-receipt.json':'e84ad3fffd80b7cbb6260c1eb10a696689c47c64',
            'adjudicate.py':'e5849df149f16785e84711de6a1afe1681d39c28',
          }
          def git_blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for dst,want in specs.items():
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{want}',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: obj=json.loads(r.read())
              if obj.get('encoding')!='base64': raise SystemExit('BLOB_ENCODING:'+dst)
              data=base64.b64decode(obj['content'])
              if git_blob(data)!=want: raise SystemExit('BLOB_IDENTITY:'+dst)
              p=root/dst; p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
          raw=(root/'input/first-complete.zip').read_bytes()
          if len(raw)!=int(os.environ['EXACT_ZIP_BYTES']): raise SystemExit('EXACT_ZIP_BYTES')
          if hashlib.sha256(raw).hexdigest()!=os.environ['EXACT_ZIP_SHA256']: raise SystemExit('EXACT_ZIP_SHA256')
          ae=json.loads((root/'input/archive-authority-erratum.json').read_bytes())
          if ae.get('status')!='FROZEN_PRE_EXECUTION_ARCHIVE_AUTHORITY_CORRECTION': raise SystemExit('ARCHIVE_ERRATUM_STATUS')
          if ae.get('authoritative_exact_repository_copy_git_blob')!=os.environ['EXACT_ZIP_BLOB']: raise SystemExit('ARCHIVE_ERRATUM_BLOB')
          if ae.get('immutable_zip_sha256')!=os.environ['EXACT_ZIP_SHA256'] or ae.get('immutable_zip_bytes')!=int(os.environ['EXACT_ZIP_BYTES']): raise SystemExit('ARCHIVE_ERRATUM_BYTES')
          tree=ast.parse((root/'adjudicate.py').read_text())
          for node in ast.walk(tree):
              if isinstance(node,ast.Import):
                  if any(a.name=='risu_e2' or a.name.startswith('risu_e2.') for a in node.names): raise SystemExit('RISU_E2_IMPORT_FORBIDDEN')
              if isinstance(node,ast.ImportFrom):
                  m=node.module or ''
                  if m=='risu_e2' or m.startswith('risu_e2.'): raise SystemExit('RISU_E2_IMPORT_FORBIDDEN')
          print('FINAL_SEALED_AUTHORITIES=PASS')
          PY
          python3 -m py_compile "$ROOT/adjudicate.py"

      - name: Execute immutable checker-only adjudication twice
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          rc1=0
          python3 adjudicate.py \
            --protocol input/protocol.json \
            --erratum input/semantic-erratum.json \
            --diagnosis input/diagnosis.json \
            --historical-receipt input/historical-receipt.json \
            --zip input/first-complete.zip \
            --output output/adjudication_run1.json || rc1=$?
          rc2=0
          python3 adjudicate.py \
            --protocol input/protocol.json \
            --erratum input/semantic-erratum.json \
            --diagnosis input/diagnosis.json \
            --historical-receipt input/historical-receipt.json \
            --zip input/first-complete.zip \
            --output output/adjudication_run2.json || rc2=$?
          export RC1="$rc1" RC2="$rc2"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform
          root=pathlib.Path(os.environ['ROOT']); out=root/'output'
          p1=out/'adjudication_run1.json'; p2=out/'adjudication_run2.json'
          b1=p1.read_bytes() if p1.exists() else b''; b2=p2.read_bytes() if p2.exists() else b''
          receipt={
            'schema':'risu.e2-f48-hp-final-checker-only-execution-receipt/v0.1',
            'run1_exit_code':int(os.environ['RC1']),
            'run2_exit_code':int(os.environ['RC2']),
            'run1_bytes':len(b1),'run2_bytes':len(b2),
            'run1_sha256':hashlib.sha256(b1).hexdigest() if b1 else None,
            'run2_sha256':hashlib.sha256(b2).hexdigest() if b2 else None,
            'byte_identical':bool(b1) and b1==b2,
            'exact_input_zip_git_blob':os.environ['EXACT_ZIP_BLOB'],
            'exact_input_zip_sha256':os.environ['EXACT_ZIP_SHA256'],
            'scientific_rerun':False,
            'transport_execution':False,
            'candidate58_read':False,
            'epistemic10_read':False,
            'raw_blind58_transport_read':False,
            'a3_a4_semantic_verdict_execution':False,
          }
          (out/'execution_receipt.json').write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n')
          prov={
            'schema':'risu.e2-f48-hp-final-checker-only-hosted-provenance/v0.1',
            'github_run_id':os.environ.get('GITHUB_RUN_ID'),
            'github_job':os.environ.get('GITHUB_JOB'),
            'github_sha':os.environ.get('GITHUB_SHA'),
            'runner_os':os.environ.get('RUNNER_OS'),
            'runner_arch':os.environ.get('RUNNER_ARCH'),
            'python':platform.python_version(),
            'scientific_execution':False,
          }
          (out/'execution_provenance.json').write_text(json.dumps(prov,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps(receipt,sort_keys=True,separators=(',',':')))
          PY

      - name: Upload first-complete adjudication evidence before final assertion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-frozen48-helper-polarity-final-checker-only-adjudication-first-complete
          path: /tmp/e2-f48-hp-final-adjudication/output/
          if-no-files-found: error
          retention-days: 90

      - name: Assert final adjudication only after artifact upload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ['ROOT'])/'output'
          a=json.loads((out/'adjudication_run1.json').read_bytes())
          r=json.loads((out/'execution_receipt.json').read_bytes())
          if a.get('status')!='PASS_CLOSED_ADJUDICATED': raise SystemExit('FINAL_ADJUDICATION_NOT_PASS')
          if a.get('failure_count')!=0 or a.get('failures')!=[]: raise SystemExit('FINAL_ADJUDICATION_FAILURES_PRESENT')
          st=a.get('self_tests',{})
          if st.get('status')!='PASS' or st.get('count')!=8 or st.get('required_count')!=8: raise SystemExit('FINAL_SELFTEST_GATE')
          if a.get('original_first_complete_status_preserved')!='FROZEN_FAIL': raise SystemExit('HISTORICAL_STATUS_NOT_PRESERVED')
          if a.get('strict_transport_eligible_count')!=31 or a.get('qualified_given_admission_primary')!=31 or a.get('qualified_given_admission_independent')!=31: raise SystemExit('ELIGIBLE_31_GATE')
          if a.get('strict_transport_ineligible_count')!=17: raise SystemExit('INELIGIBLE_17_GATE')
          if a.get('canonical_agreed_count')!=48: raise SystemExit('CANONICAL_48_GATE')
          if a.get('changed_canonical_cell_ids')!=['Q013','Q014','Q015','Q017','Q018']: raise SystemExit('DELTA_SET_GATE')
          if r.get('run1_exit_code')!=0 or r.get('run2_exit_code')!=0 or r.get('byte_identical') is not True: raise SystemExit('REPEAT_EXECUTION_GATE')
          print('FINAL_CHECKER_ONLY_ADJUDICATION=PASS_CLOSED_ADJUDICATED')
          PY
