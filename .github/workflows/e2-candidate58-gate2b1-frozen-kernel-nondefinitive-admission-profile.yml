name: E2 Candidate58 Gate2B1 Frozen Kernel Nondefinitive Admission Profile

on:
  push:
    branches: [e2-development]
    paths:
      - ".github/workflows/e2-candidate58-gate2b1-frozen-kernel-nondefinitive-admission-profile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e2-candidate58-gate2b1-first-complete
  cancel-in-progress: false

env:
  GATE2B1_PARENT: 0012ee60dc653e03a40313855d1e523eb74c46aa
  GATE2B0_FREEZE: 2c36c0d0eae46844bc077fc548594ac84b376381
  PROTOCOL_PATH: protocols/RISU_DIFF_E2_CANDIDATE58_GATE2B1_FROZEN_KERNEL_NONDEFINITIVE_ADMISSION_PROFILE_PROTOCOL_v0.1.json
  ANALYZER_PATH: tools/e2_candidate58_gate2b1_frozen_kernel_nondefinitive_admission_profile.py
  IMPLEMENTATION_FREEZE_PATH: protocols/RISU_DIFF_E2_CANDIDATE58_GATE2B1_IMPLEMENTATION_FREEZE_v0.1.json
  GATE2B0_LEDGER_PATH: experiments/risu-diff-e2/qualification/candidate58/gate2b0-claim-eligibility-frontier/E2_CANDIDATE58_GATE2B0_FRONTIER_LEDGER.json
  MATRIX_PATH: experiments/risu-diff-e2/qualification/candidate58/first-complete-machine/E2_CANDIDATE58_FIRST_COMPLETE_MACHINE_PREDICTION_MATRIX.json
  BUNDLE_PATH: experiments/risu-diff-e2/qualification/candidate58/first-complete-machine/E2_CANDIDATE58_FIRST_MACHINE_ONLY_BUNDLE.zip
  PROTOCOL_BLOB: ce298f5d1325b1f1584b5c06781604a14019b7aa
  ANALYZER_BLOB: a50c2b9318667c500959c7dd3063670005376277
  IMPLEMENTATION_FREEZE_BLOB: 644b762168bd4e1db571cf981bd91ae6570b5a4b
  GATE2B0_LEDGER_BLOB: 5b456fe7675ceaf09c43397ba82ec2df6f51f0c2
  MATRIX_BLOB: 60b27d641682693cb3df654d8aa4f064cc48455d
  BUNDLE_BLOB: 6845228221e9aeb1fe386725c4f3c98234c07a9a
  KERNEL_BLOB: e91e51397f4cc201452b1a0f80d130265dca2ea0
  GATE2B0_LEDGER_SHA256: 522a2e73f55fb79513a04c4edfafb96f6753431bb5cc036700b404398a0a92cc
  MATRIX_SHA256: 7273ce4034d06e67989a33540f5b22fef3190cf311a8981474413b538e43472d
  BUNDLE_SHA256: d77caaf74bf4dc8e94cf769d10092f8413595ac93422042e8a374f76c343f42d

jobs:
  first-complete-gate2b1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Gate2B1 orchestration revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 12

      - name: Prove prospective additive diagnostic boundary before any real kernel-result read
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$GATE2B1_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/e2-candidate58-gate2b1-frozen-kernel-nondefinitive-admission-profile.yml"
          git merge-base --is-ancestor "$GATE2B0_FREEZE" HEAD
          test "$(git hash-object "$PROTOCOL_PATH")" = "$PROTOCOL_BLOB"
          test "$(git hash-object "$ANALYZER_PATH")" = "$ANALYZER_BLOB"
          test "$(git hash-object "$IMPLEMENTATION_FREEZE_PATH")" = "$IMPLEMENTATION_FREEZE_BLOB"
          test "$(git hash-object "$GATE2B0_LEDGER_PATH")" = "$GATE2B0_LEDGER_BLOB"
          test "$(git hash-object "$MATRIX_PATH")" = "$MATRIX_BLOB"
          test "$(git hash-object "$BUNDLE_PATH")" = "$BUNDLE_BLOB"
          test "$(git hash-object risu_e2_semantic/kernel.py)" = "$KERNEL_BLOB"
          echo "$GATE2B0_LEDGER_SHA256  $GATE2B0_LEDGER_PATH" | sha256sum -c -
          echo "$MATRIX_SHA256  $MATRIX_PATH" | sha256sum -c -
          echo "$BUNDLE_SHA256  $BUNDLE_PATH" | sha256sum -c -
          python - <<'PY'
          import ast, subprocess, sys
          expected={
            'protocols/RISU_DIFF_E2_CANDIDATE58_GATE2B1_FROZEN_KERNEL_NONDEFINITIVE_ADMISSION_PROFILE_PROTOCOL_v0.1.json',
            'tools/e2_candidate58_gate2b1_frozen_kernel_nondefinitive_admission_profile.py',
            'protocols/RISU_DIFF_E2_CANDIDATE58_GATE2B1_IMPLEMENTATION_FREEZE_v0.1.json',
            '.github/workflows/e2-candidate58-gate2b1-frozen-kernel-nondefinitive-admission-profile.yml',
          }
          names=set(subprocess.check_output(['git','diff','--name-only','2c36c0d0eae46844bc077fc548594ac84b376381..HEAD'],text=True).splitlines())
          assert names==expected, (names, expected)
          src=open('tools/e2_candidate58_gate2b1_frozen_kernel_nondefinitive_admission_profile.py',encoding='utf-8').read()
          tree=ast.parse(src)
          tops=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.Import): tops += [a.name.split('.')[0] for a in node.names]
              elif isinstance(node,ast.ImportFrom) and node.module: tops.append(node.module.split('.')[0])
          bad=sorted({x for x in tops if x not in sys.stdlib_module_names and x!='__future__'})
          assert not bad, bad
          assert not any(x.startswith('risu') for x in tops), tops
          print('GATE2B1_POST_GATE2B0_ADDITIVE_FIREWALL=PASS')
          print('GATE2B1_ANALYZER_STDLIB_ONLY_STATIC_IMPORT_CHECK=PASS')
          PY

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.5"

      - name: Qualify frozen analyzer before first real selected kernel-result read
        shell: bash
        run: |
          set -euo pipefail
          test "$(python - <<'PY'
          import platform
          print(platform.python_version())
          PY
          )" = "3.13.5"
          python "$ANALYZER_PATH" --self-test
          echo "GATE2B1_REAL_KERNEL_RESULT_READS_SO_FAR=0"

      - name: Execute first deterministic Gate2B1 frozen-kernel diagnostic replay
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/gate2b1/replay1"
          mkdir -p "$(dirname "$O")"
          python "$ANALYZER_PATH" \
            --protocol "$PROTOCOL_PATH" \
            --gate2b0-ledger "$GATE2B0_LEDGER_PATH" \
            --matrix "$MATRIX_PATH" \
            --bundle-zip "$BUNDLE_PATH" \
            --output-dir "$O"
          test "$(find "$O" -maxdepth 1 -type f | wc -l)" -eq 4
          (cd "$O" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/gate2b1/replay1.logical-tree.sha256"

      - name: Execute mandatory second deterministic Gate2B1 frozen-kernel diagnostic replay
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/gate2b1/replay2"
          python "$ANALYZER_PATH" \
            --protocol "$PROTOCOL_PATH" \
            --gate2b0-ledger "$GATE2B0_LEDGER_PATH" \
            --matrix "$MATRIX_PATH" \
            --bundle-zip "$BUNDLE_PATH" \
            --output-dir "$O"
          test "$(find "$O" -maxdepth 1 -type f | wc -l)" -eq 4
          (cd "$O" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/gate2b1/replay2.logical-tree.sha256"

      - name: Require exact byte identity, exact 39 population, and diagnostic firewall
        shell: bash
        run: |
          set -euo pipefail
          cmp "$RUNNER_TEMP/gate2b1/replay1.logical-tree.sha256" "$RUNNER_TEMP/gate2b1/replay2.logical-tree.sha256"
          diff -qr "$RUNNER_TEMP/gate2b1/replay1" "$RUNNER_TEMP/gate2b1/replay2"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=Path(os.environ['RUNNER_TEMP'])/'gate2b1/replay1'
          led=json.loads((r/'E2_CANDIDATE58_GATE2B1_ADMISSION_PROFILE_LEDGER.json').read_text())
          summary=json.loads((r/'E2_CANDIDATE58_GATE2B1_ADMISSION_PROFILE_SUMMARY.json').read_text())
          reads=json.loads((r/'E2_CANDIDATE58_GATE2B1_KERNEL_RESULT_READ_MANIFEST.json').read_text())
          receipt=json.loads((r/'E2_CANDIDATE58_GATE2B1_DIAGNOSTIC_RECEIPT.json').read_text())
          assert led['selected_case_count']==39 and len(led['rows'])==39
          assert len({x['case_id'] for x in led['rows']})==39
          assert sum(summary['top_level_incomplete_branch_counts'].values())==39
          assert sum(summary['admission_signature_counts'].values())==39
          assert sum(summary['failed_admission_cardinality_counts'].values())==39
          assert reads['selected_case_count']==39 and reads['kernel_result_member_reads']==78
          assert reads['zip_member_metadata_count']==946 and reads['forbidden_member_content_reads']==0
          assert len(reads['rows'])==39 and all(x['replay_bytes_identical'] for x in reads['rows'])
          assert all(x['matches_machine_matrix_kernel_result_sha256'] for x in reads['rows'])
          assert receipt['status']=='FIRST_COMPLETE_GATE2B1_LOGICAL_OUTPUT'
          assert receipt['integrity']['selected_case_count']==39
          assert receipt['integrity']['kernel_result_member_reads']==78
          assert receipt['integrity']['top_level_branch_partition_total']==39
          assert receipt['scientific_firewall']=={
            'semantic_engine_rerun':False,
            'kernel_rerun':False,
            'c1_checker_rerun':False,
            'candidate_source_read':False,
            'semantic_slice_content_read':False,
            'adapter_receipt_content_read':False,
            'certificate_content_read':False,
            'c1_report_content_read':False,
            'truth_or_operator_read':False,
            'gate2a_truth_join_input':False,
            'fresh_heldout_read':False,
            'remediation':False,
            'semantic_rule_change':False,
          }
          ib=summary['interpretation_boundary']
          assert ib['profile_is_not_semantic_root_cause'] is True
          assert ib['admissions_are_parallel_not_ordered'] is True
          assert ib['counterfactual_fix_or_coverage_gain_inferred'] is False
          assert ib['remediation_priority_authorized'] is False
          print('GATE2B1_TWO_REPLAY_LOGICAL_BYTE_IDENTITY=PASS')
          print('GATE2B1_BRANCH_COUNTS='+json.dumps(summary['top_level_incomplete_branch_counts'],sort_keys=True,separators=(',',':')))
          print('GATE2B1_ADMISSION_FAILURE_COUNTS='+json.dumps(summary['admission_failure_counts'],sort_keys=True,separators=(',',':')))
          print('GATE2B1_ADMISSION_SIGNATURE_COUNTS='+json.dumps(summary['admission_signature_counts'],sort_keys=True,separators=(',',':')))
          PY

      - name: Upload both exact Gate2B1 replays before repository freeze
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-candidate58-gate2b1-first-complete-dual-replay
          path: |
            ${{ runner.temp }}/gate2b1/replay1
            ${{ runner.temp }}/gate2b1/replay2
            ${{ runner.temp }}/gate2b1/replay1.logical-tree.sha256
            ${{ runner.temp }}/gate2b1/replay2.logical-tree.sha256
          if-no-files-found: error
          retention-days: 90
          overwrite: false

      - name: Materialize exact first-complete Gate2B1 repository freeze payload
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/gate2b1/replay1"
          D="experiments/risu-diff-e2/qualification/candidate58/gate2b1-frozen-kernel-nondefinitive-admission-profile"
          test ! -e "$D"
          mkdir -p "$D"
          cp "$SRC/E2_CANDIDATE58_GATE2B1_ADMISSION_PROFILE_LEDGER.json" "$D/"
          cp "$SRC/E2_CANDIDATE58_GATE2B1_ADMISSION_PROFILE_SUMMARY.json" "$D/"
          cp "$SRC/E2_CANDIDATE58_GATE2B1_KERNEL_RESULT_READ_MANIFEST.json" "$D/"
          cp "$SRC/E2_CANDIDATE58_GATE2B1_DIAGNOSTIC_RECEIPT.json" "$D/"
          cp "$RUNNER_TEMP/gate2b1/replay1.logical-tree.sha256" "$D/E2_CANDIDATE58_GATE2B1_LOGICAL_TREE.sha256"
          export D ARTIFACT_ID ARTIFACT_DIGEST
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          d=Path(os.environ['D'])
          h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          summary=json.loads((d/'E2_CANDIDATE58_GATE2B1_ADMISSION_PROFILE_SUMMARY.json').read_text())
          freeze={
            'schema':'risu.e2-candidate58-gate2b1-first-complete-immutable-freeze/v0.1',
            'status':'FIRST_COMPLETE_GATE2B1_DIAGNOSTIC_IMMUTABLY_FROZEN_BY_CONTAINING_COMMIT',
            'repository':'risu-research/risu-verify',
            'branch':'e2-development',
            'workflow_trigger_commit':os.environ['GITHUB_SHA'],
            'workflow_run_id':os.environ['GITHUB_RUN_ID'],
            'workflow_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'hosted_artifact_id':os.environ['ARTIFACT_ID'],
            'hosted_artifact_digest':os.environ['ARTIFACT_DIGEST'],
            'gate2b0_first_complete_freeze_commit':'2c36c0d0eae46844bc077fc548594ac84b376381',
            'gate2b1_protocol_git_blob':'ce298f5d1325b1f1584b5c06781604a14019b7aa',
            'gate2b1_analyzer_git_blob':'a50c2b9318667c500959c7dd3063670005376277',
            'gate2b1_implementation_freeze_git_blob':'644b762168bd4e1db571cf981bd91ae6570b5a4b',
            'frozen_kernel_git_blob':'e91e51397f4cc201452b1a0f80d130265dca2ea0',
            'gate2b0_frontier_ledger_sha256':'522a2e73f55fb79513a04c4edfafb96f6753431bb5cc036700b404398a0a92cc',
            'machine_matrix_sha256':'7273ce4034d06e67989a33540f5b22fef3190cf311a8981474413b538e43472d',
            'machine_bundle_zip_sha256':'d77caaf74bf4dc8e94cf769d10092f8413595ac93422042e8a374f76c343f42d',
            'selected_case_count':39,
            'kernel_result_member_reads':78,
            'top_level_incomplete_branch_counts':summary['top_level_incomplete_branch_counts'],
            'admission_failure_counts':summary['admission_failure_counts'],
            'admission_signature_counts':summary['admission_signature_counts'],
            'admission_profile_ledger_sha256':h(d/'E2_CANDIDATE58_GATE2B1_ADMISSION_PROFILE_LEDGER.json'),
            'admission_profile_summary_sha256':h(d/'E2_CANDIDATE58_GATE2B1_ADMISSION_PROFILE_SUMMARY.json'),
            'kernel_result_read_manifest_sha256':h(d/'E2_CANDIDATE58_GATE2B1_KERNEL_RESULT_READ_MANIFEST.json'),
            'diagnostic_receipt_sha256':h(d/'E2_CANDIDATE58_GATE2B1_DIAGNOSTIC_RECEIPT.json'),
            'logical_tree_manifest_sha256':h(d/'E2_CANDIDATE58_GATE2B1_LOGICAL_TREE.sha256'),
            'two_replay_logical_byte_identity':True,
            'taxonomy_and_analyzer_frozen_before_observed_counts':True,
            'diagnostic_only':True,
            'semantic_engine_kernel_or_c1_rerun':False,
            'source_semantic_slice_truth_operator_read':False,
            'remediation_performed':False,
            'fresh_heldout_opened':False,
            'interpretation_boundary':{
              'profile_is_not_semantic_root_cause':True,
              'cofailure_is_not_causality':True,
              'direct_shadow_is_not_causal_dominance':True,
              'counterfactual_remediation_gain_not_inferred':True,
            },
            'immutability_rule':{
              'this_first_complete_gate2b1_result_may_not_be_replaced':True,
              'later_deeper_diagnostics_or_remediation_must_be_additive':True,
              'machine_gate2a_gate2b0_artifacts_remain_immutable':True,
            },
          }
          (d/'E2_CANDIDATE58_GATE2B1_FIRST_COMPLETE_IMMUTABLE_FREEZE_RECEIPT.json').write_bytes((json.dumps(freeze,sort_keys=True,separators=(',',':'))+'\n').encode())
          PY
          echo "$GATE2B0_LEDGER_SHA256  $GATE2B0_LEDGER_PATH" | sha256sum -c -
          echo "$MATRIX_SHA256  $MATRIX_PATH" | sha256sum -c -
          echo "$BUNDLE_SHA256  $BUNDLE_PATH" | sha256sum -c -

      - name: Create one immutable Gate2B1 result commit and push fast-forward only
        shell: bash
        run: |
          set -euo pipefail
          D="experiments/risu-diff-e2/qualification/candidate58/gate2b1-frozen-kernel-nondefinitive-admission-profile"
          git config user.name "risu-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- "$D"
          python - <<'PY'
          import subprocess
          p='experiments/risu-diff-e2/qualification/candidate58/gate2b1-frozen-kernel-nondefinitive-admission-profile/'
          expected={
            p+'E2_CANDIDATE58_GATE2B1_ADMISSION_PROFILE_LEDGER.json',
            p+'E2_CANDIDATE58_GATE2B1_ADMISSION_PROFILE_SUMMARY.json',
            p+'E2_CANDIDATE58_GATE2B1_KERNEL_RESULT_READ_MANIFEST.json',
            p+'E2_CANDIDATE58_GATE2B1_DIAGNOSTIC_RECEIPT.json',
            p+'E2_CANDIDATE58_GATE2B1_LOGICAL_TREE.sha256',
            p+'E2_CANDIDATE58_GATE2B1_FIRST_COMPLETE_IMMUTABLE_FREEZE_RECEIPT.json',
          }
          names=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert names==expected, (names, expected)
          print('GATE2B1_FREEZE_COMMIT_DELTA_FIREWALL=PASS')
          PY
          REMOTE_HEAD="$(git ls-remote origin refs/heads/e2-development | awk '{print $1}')"
          test "$REMOTE_HEAD" = "$GITHUB_SHA"
          git commit -m "Freeze first complete Candidate58 Gate2B1 admission profile"
          FREEZE_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:e2-development
          echo "GATE2B1_FIRST_COMPLETE_FREEZE_COMMIT=$FREEZE_SHA"

      - name: Post-push immutable-boundary verification
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/e2-development | awk '{print $1}')"
          test "$REMOTE_HEAD" = "$(git rev-parse HEAD)"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | grep -v '^$' | wc -l)" -eq 6
          test "$(git hash-object "$PROTOCOL_PATH")" = "$PROTOCOL_BLOB"
          test "$(git hash-object "$ANALYZER_PATH")" = "$ANALYZER_BLOB"
          test "$(git hash-object "$IMPLEMENTATION_FREEZE_PATH")" = "$IMPLEMENTATION_FREEZE_BLOB"
          echo "$GATE2B0_LEDGER_SHA256  $GATE2B0_LEDGER_PATH" | sha256sum -c -
          echo "$MATRIX_SHA256  $MATRIX_PATH" | sha256sum -c -
          echo "$BUNDLE_SHA256  $BUNDLE_PATH" | sha256sum -c -
          echo "GATE2B1_FIRST_COMPLETE_REPOSITORY_FREEZE=PASS_ADDITIVE_DIAGNOSTIC_ONLY"
