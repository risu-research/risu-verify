name: Historical official notice provenance
on:
  push:
    paths:
      - 'tools/public_historical_notice_provenance.py'
      - '.github/workflows/public-historical-notices.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pdfplumber==0.11.7'
      - run: python tools/public_historical_notice_provenance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-public-selection-notices
          path: build/historical_notices/
          if-no-files-found: warn
          retention-days: 30
