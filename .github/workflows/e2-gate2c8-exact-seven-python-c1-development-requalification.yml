name: E2 Gate2C8 Exact Seven Python C1 Development Requalification

on:
  push:
    branches: [e2-development]
    paths:
      - ".github/workflows/e2-gate2c8-exact-seven-python-c1-development-requalification.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: e2-gate2c8-exact-seven-python-c1-development-requalification
  cancel-in-progress: false

env:
  SOLE_EXECUTION_AUTHORITY: 8685085db7b56f9815b609c3229cbe1ae77141de
  C8_PROTOCOL: protocols/RISU_DIFF_E2_GATE2C8_PROJECTION_QUALIFIED_A3_BINDING_AUTHORITY_PROTOCOL_v0.1.json
  C8_PROTOCOL_BLOB: 94e52c117112b4a6569aaa029f6c9cfe0e114dbc
  C8_SYNTH_FREEZE: experiments/risu-diff-e2/qualification/candidate58/gate2c8-projection-qualified-a3-binding-authority/synthetic-first-complete/freeze_receipt.json
  C8_SYNTH_FREEZE_BLOB: d021f96f960ae18796808c30bb7e5ffab83f5339
  C7_PROTOCOL: protocols/RISU_DIFF_E2_GATE2C7_PROJECTION_QUALIFIED_C1_ORIGIN_AUTHORITY_PROTOCOL_v0.1.json
  C7_PROTOCOL_BLOB: 9b62376d6a260c21510621bfa769593fdcbaf732
  C7_LEDGER: experiments/risu-diff-e2/qualification/candidate58/gate2c7-projection-qualified-c1-origin-authority/exact-seven-first-complete/E2_GATE2C7_EXACT_SEVEN_COMPACT_LEDGER.json
  C7_LEDGER_BLOB: d71150a80f279f3857dfe0cc5e053185f8ec4e40
  C7_DIAGNOSIS: experiments/risu-diff-e2/qualification/candidate58/gate2c7-projection-qualified-c1-origin-authority/exact-seven-first-complete/diagnosis/E2_GATE2C7_POST_PROJECTION_A3_BINDING_DIAGNOSIS.json
  C7_DIAGNOSIS_BLOB: 9c36d8bf9e731f5bf7ed27001873588ac35c9375
  C3_PROTOCOL: protocols/RISU_DIFF_E2_GATE2C3_PYTHON_C1_WORLD_EVALUATION_PROVENANCE_PROTOCOL_v0.1.json
  C3_PROTOCOL_BLOB: 658572619ed5f68127a97f053056ccad4269c4a6
  C3_LOCATOR: tools/e2_gate2c3_python_c1_world_eval_provenance.py
  C3_LOCATOR_BLOB: a30172a3f72d17bc29b37b0f6c5d86a3b6893741
  C3_FROZEN_LOCATOR: experiments/risu-diff-e2/qualification/candidate58/gate2c3-python-c1-world-evaluation-provenance/first-complete/E2_GATE2C3_SOURCE_LOCATOR_RECEIPT.json
  C3_FROZEN_LOCATOR_BLOB: 012b0446847b84c825d7b25c1d8d62359da4cf61
  MATRIX: experiments/risu-diff-e2/qualification/candidate58/gate2c2a-repaired-machine-requalification/first-complete/E2_GATE2C2A_REPAIRED_MACHINE_PREDICTION_MATRIX.json
  MATRIX_BLOB: f0bcf0ea806b24caf46689bd4c68147ba35b8e60
  MATRIX_SHA256: da8cb707a5cc71b36881eafc01a377ba040bb5148ae3d3997ecd95f7572138d3
  ADMISSION: experiments/risu-diff-e2/qualification/anchor-transport/admission/E2_SANITIZED_OPAQUE_58_ADMISSION_MANIFEST.json
  ADMISSION_BLOB: f2fc78439d4bfadce5941bf71aadd15ec292bcb1
  CELLS: experiments/risu-diff-e2/qualification/materialized/cells
  CELLS_TREE: 34a30574c7420728bff57958c815194979a622ab
  EXEC_PROTOCOL: protocols/RISU_DIFF_E2_CANDIDATE58_FIRST_SEMANTIC_EXECUTION_PROTOCOL_v0.1.json
  EXEC_PROTOCOL_BLOB: 08fdbcf517feafc159f229460eb7d82947a0c71b
  HIST_IMPL_FREEZE: protocols/RISU_DIFF_E2_GATE1B1C_IMPLEMENTATION_FREEZE_v0.1.json
  HIST_IMPL_FREEZE_BLOB: 24724a44a7a200e7f069e4e62b5ee16df673dcf2
  C5_AUTHORITY: experiments/risu-diff-e2/qualification/candidate58/gate2c5-canonical-opaque-projection-identity/first-complete/E2_GATE2C5_CANONICAL_OPAQUE_PROJECTION_IDENTITY.json
  C5_AUTHORITY_BLOB: 903ce09ca68dba6cb82100c3b2396d79a70b1b99
  C7_RUNNER: tools/e2_gate2c7_exact_seven_c1_requalify.py
  C7_RUNNER_BLOB: 8a3366736dd7f73bdb6cfeff4c199d0ef2735144
  C7_CHECKER: tools/e2_gate2c7_check_exact_seven_c1_requalification.py
  C7_CHECKER_BLOB: 419b643b05ddd9b72ff17d60bdb30d912023cb5e
  C8_OBSERVER: tools/e2_gate2c8_observe_exact_seven_binding_authority.py
  C8_OBSERVER_BLOB: 6002fc13b874cf7625ca1f956b60af94af71f8be
  C8_CHECKER: tools/e2_gate2c8_check_exact_seven_c1_requalification.py
  C8_CHECKER_BLOB: b2498cf2e490c18a6bbb25ca905ed8e879b32d41
  GATE2C2A_ARTIFACT_ID: "10032162026"
  GATE2C2A_FREEZE: experiments/risu-diff-e2/qualification/candidate58/gate2c2a-repaired-machine-requalification/first-complete/E2_GATE2C2A_FIRST_COMPLETE_IMMUTABLE_FREEZE_RECEIPT.json
  GATE2C2A_FREEZE_BLOB: 0a5853950905ecd2fca219945c4e8f3844f6af81
  BINDING_AUTHORITY_BLOB: b243df1f440ae21b368a0e3b7d02042870d37dc1
  SOURCE_EXTRACT_BLOB: 3e6dd4fa3a95763d99f9c656d49f9ab97f550ac9
  SEMANTICS_BLOB: 256386816cef7213cc6b2361a3e536e1cc439b17
  RECHECKER_BLOB: ec7e782c88fb8786eb5b3d267e44d81885707728
  PROJECTION_AUTHORITY_BLOB: 64e9b0bff2f5dac7b51389cdf8d50745111787e0
  SOURCE_PYTHON_BLOB: 97c20c76b09de42af21df9b2f531da9e28c055af
  COMMON_BLOB: 65957407cd21f3940c2d0311b0fe6494f754192b

jobs:
  exact-seven-c1-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Gate2C8 execution revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Prove sole authority and orchestration-only mutation before source read
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOLE_EXECUTION_AUTHORITY"
          git diff --name-only HEAD^ HEAD | sort > "$RUNNER_TEMP/changed.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          .github/workflows/e2-gate2c8-exact-seven-python-c1-development-requalification.yml
          tools/e2_gate2c8_check_exact_seven_c1_requalification.py
          tools/e2_gate2c8_observe_exact_seven_binding_authority.py
          EOF
          sort -o "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/expected.txt"
          cmp "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/changed.txt"
          test "$(git hash-object "$C8_PROTOCOL")" = "$C8_PROTOCOL_BLOB"
          test "$(git hash-object "$C8_SYNTH_FREEZE")" = "$C8_SYNTH_FREEZE_BLOB"
          test "$(git hash-object "$C7_PROTOCOL")" = "$C7_PROTOCOL_BLOB"
          test "$(git hash-object "$C7_LEDGER")" = "$C7_LEDGER_BLOB"
          test "$(git hash-object "$C7_DIAGNOSIS")" = "$C7_DIAGNOSIS_BLOB"
          test "$(git hash-object "$C3_PROTOCOL")" = "$C3_PROTOCOL_BLOB"
          test "$(git hash-object "$C3_LOCATOR")" = "$C3_LOCATOR_BLOB"
          test "$(git hash-object "$C3_FROZEN_LOCATOR")" = "$C3_FROZEN_LOCATOR_BLOB"
          test "$(git hash-object "$MATRIX")" = "$MATRIX_BLOB"
          test "$(git hash-object "$ADMISSION")" = "$ADMISSION_BLOB"
          test "$(git rev-parse "HEAD:$CELLS")" = "$CELLS_TREE"
          test "$(git hash-object "$EXEC_PROTOCOL")" = "$EXEC_PROTOCOL_BLOB"
          test "$(git hash-object "$HIST_IMPL_FREEZE")" = "$HIST_IMPL_FREEZE_BLOB"
          test "$(git hash-object "$C5_AUTHORITY")" = "$C5_AUTHORITY_BLOB"
          test "$(git hash-object "$C7_RUNNER")" = "$C7_RUNNER_BLOB"
          test "$(git hash-object "$C7_CHECKER")" = "$C7_CHECKER_BLOB"
          test "$(git hash-object "$C8_OBSERVER")" = "$C8_OBSERVER_BLOB"
          test "$(git hash-object "$C8_CHECKER")" = "$C8_CHECKER_BLOB"
          test "$(git hash-object "$GATE2C2A_FREEZE")" = "$GATE2C2A_FREEZE_BLOB"
          test "$(git hash-object risu_e2_c1/binding_authority.py)" = "$BINDING_AUTHORITY_BLOB"
          test "$(git hash-object risu_e2_c1/source_extract.py)" = "$SOURCE_EXTRACT_BLOB"
          test "$(git hash-object risu_e2_c1/semantics.py)" = "$SEMANTICS_BLOB"
          test "$(git hash-object risu_e2_c1/rechecker.py)" = "$RECHECKER_BLOB"
          test "$(git hash-object risu_e2_c1/projection_authority.py)" = "$PROJECTION_AUTHORITY_BLOB"
          test "$(git hash-object risu_e2_c1/source_python.py)" = "$SOURCE_PYTHON_BLOB"
          test "$(git hash-object risu_e2_c1/common.py)" = "$COMMON_BLOB"
          echo "$MATRIX_SHA256  $MATRIX" | sha256sum -c -
          python - <<'PY'
          import json,os
          from pathlib import Path
          c8=json.loads(Path(os.environ['C8_PROTOCOL']).read_text()); c7=json.loads(Path(os.environ['C7_PROTOCOL']).read_text()); c3=json.loads(Path(os.environ['C3_PROTOCOL']).read_text()); fr=json.loads(Path(os.environ['C8_SYNTH_FREEZE']).read_text()); old=json.loads(Path(os.environ['C7_LEDGER']).read_text())
          a=sorted(c8['population']['case_ids']); b=sorted(c7['population']['case_ids']); c=sorted(c3['population']['case_ids'])
          assert len(a)==7 and a==b==c and len(set(a))==7
          assert fr['status']=='SYNTHETIC_FIRST_COMPLETE_IMMUTABLY_FROZEN'
          assert fr['exact_seven_c1_rerun_authorized'] is True
          assert fr['candidate58_additive_requalification_authorized'] is False
          assert fr['candidate_c1_executed'] is False and fr['candidate_source_bytes_read']==0
          assert fr['next_authorized_action']=='RUN_EXACTLY_SEVEN_FROZEN_PYTHON_C1_DEVELOPMENT_CASES_ONLY'
          assert old['valid_c1_count']==0 and old['c1_preservation_count']==0 and old['case_count']==7
          print('GATE2C8_EXACT_SEVEN_PRE_SOURCE_AUTHORITY=PASS')
          PY

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.5"

      - name: Audit unchanged C1 runner and independent result checker boundaries
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$C7_RUNNER" "$C7_CHECKER" "$C8_OBSERVER" "$C8_CHECKER"
          python - <<'PY'
          import ast,os,sys
          from pathlib import Path
          assert '.'.join(map(str,sys.version_info[:3]))=='3.13.5'
          runner=Path(os.environ['C7_RUNNER']).read_text(); checker=Path(os.environ['C8_CHECKER']).read_text(); observer=Path(os.environ['C8_OBSERVER']).read_text()
          assert 'risu_e2_semantic' not in runner and 'risu_e2.' not in runner
          assert 'risu_e2_c1' not in checker
          assert 'risu_e2_c1.source_extract' in observer
          t=ast.parse(checker); roots=[]
          for n in ast.walk(t):
              if isinstance(n,ast.Import): roots.extend(x.name.split('.',1)[0] for x in n.names)
              elif isinstance(n,ast.ImportFrom) and n.module: roots.append(n.module.split('.',1)[0])
          bad=[x for x in roots if x not in sys.stdlib_module_names and x!='__future__']
          assert not bad,bad
          print('GATE2C8_EXACT_SEVEN_INDEPENDENCE=PASS')
          PY

      - name: Opaque-localize exactly the frozen seven and retain no other source bytes
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/gate2c8-sources"; LOC="$RUNNER_TEMP/locator.json"
          python "$C3_LOCATOR" locate --cells-dir "$CELLS" --manifest "$ADMISSION" --protocol "$C3_PROTOCOL" --output-sources "$SRC" --receipt "$LOC"
          cmp "$LOC" "$C3_FROZEN_LOCATOR"
          test "$(find "$SRC" -type f | wc -l)" -eq 7
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path(os.environ['RUNNER_TEMP'],'locator.json').read_text())
          assert r['source_files_stream_hashed']==58 and r['source_files_semantically_parsed']==0
          assert r['selected_source_count']==7 and r['nonselected_source_bytes_retained'] is False
          print('GATE2C8_EXACT_SEVEN_SOURCE_LOCALIZATION=PASS')
          PY

      - name: Recover only frozen certificate and adapter inputs for the exact seven
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/gate2c2a.zip"; META="$RUNNER_TEMP/gate2c2a-meta.json"; CASES="$RUNNER_TEMP/gate2c8-cases"; export ZIP META CASES
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$GATE2C2A_ARTIFACT_ID" > "$META"
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path(os.environ['META']).read_text()); f=json.loads(Path(os.environ['GATE2C2A_FREEZE']).read_text())
          frozen=str((f.get('hosted_artifact',{}) or {}).get('digest',''))
          assert int(m['id'])==int(os.environ['GATE2C2A_ARTIFACT_ID']) and m.get('expired') is False
          assert str((f.get('hosted_artifact',{}) or {}).get('id'))==os.environ['GATE2C2A_ARTIFACT_ID']
          assert frozen and m.get('digest')=='sha256:'+frozen
          print('GATE2C8_ARTIFACT_METADATA_BOUND_TO_IMMUTABLE_FREEZE=PASS')
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$GATE2C2A_ARTIFACT_ID/zip" > "$ZIP"
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          p=json.loads(Path(os.environ['C8_PROTOCOL']).read_text()); m=json.loads(Path(os.environ['MATRIX']).read_text()); ids=sorted(p['population']['case_ids']); rows={str(x['case_id']):x for x in m['cases']}; root=Path(os.environ['CASES']);root.mkdir(parents=True,exist_ok=True);z=zipfile.ZipFile(os.environ['ZIP']);verified=[]
          for cid in ids:
              d=root/cid;d.mkdir(); row=rows[cid]
              for fn,key in [('certificate.json','certificate_sha256'),('adapter_receipt.json','adapter_receipt_sha256')]:
                  b1=z.read(f'replay1/cases/{cid}/{fn}'); b2=z.read(f'replay2/cases/{cid}/{fn}'); assert b1==b2,(cid,fn,'replay_mismatch'); h=hashlib.sha256(b1).hexdigest(); assert h==row[key],(cid,fn,h,row[key]); (d/fn).write_bytes(b1); verified.append({'case_id':cid,'file':fn,'sha256':h})
          assert len(verified)==14
          rec={'schema':'risu.e2-gate2c8-selected-frozen-c1-input-verification/v0.1','artifact_id':int(os.environ['GATE2C2A_ARTIFACT_ID']),'artifact_current_api_digest':json.loads(Path(os.environ['META']).read_text()).get('digest'),'artifact_immutable_freeze_digest':json.loads(Path(os.environ['GATE2C2A_FREEZE']).read_text())['hosted_artifact']['digest'],'selected_case_count':7,'selected_file_count':14,'replay1_replay2_byte_identical':True,'all_selected_file_sha256_match_frozen_matrix':True,'download_zip_digest_used_as_scientific_authority':False,'verified':verified}
          Path(os.environ['RUNNER_TEMP'],'selected-input-verification.json').write_text(json.dumps(rec,sort_keys=True,separators=(',',':'))+'\n')
          print('GATE2C8_FROZEN_C1_LOGICAL_INPUTS=14_PASS')
          PY

      - name: Execute unchanged C1 runner twice over exactly seven cases
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for N in 1 2; do
            python "$C7_RUNNER" --gate2c7-protocol "$C7_PROTOCOL" --execution-protocol "$EXEC_PROTOCOL" --historical-implementation-freeze "$HIST_IMPL_FREEZE" --matrix "$MATRIX" --sources "$RUNNER_TEMP/gate2c8-sources" --cases "$RUNNER_TEMP/gate2c8-cases" --output "$RUNNER_TEMP/replay$N" > "$RUNNER_TEMP/replay$N.stdout"
            (cd "$RUNNER_TEMP/replay$N" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/replay$N.tree"
          done
          cmp "$RUNNER_TEMP/replay1.tree" "$RUNNER_TEMP/replay2.tree"
          cmp "$RUNNER_TEMP/replay1.stdout" "$RUNNER_TEMP/replay2.stdout"
          echo GATE2C8_EXACT_SEVEN_C1_DUAL_REPLAY=PASS

      - name: Reconfirm Gate2C7 projection authority independently twice
        shell: bash
        run: |
          set -euo pipefail
          for N in 1 2; do
            python "$C7_CHECKER" --gate2c7-protocol "$C7_PROTOCOL" --canonical-authority "$C5_AUTHORITY" --runner "$RUNNER_TEMP/replay1/E2_GATE2C7_EXACT_SEVEN_C1_REQUALIFICATION.json" --sources "$RUNNER_TEMP/gate2c8-sources" --cases "$RUNNER_TEMP/gate2c8-cases" --output "$RUNNER_TEMP/c7checker$N.json" > "$RUNNER_TEMP/c7checker$N.stdout"
          done
          cmp "$RUNNER_TEMP/c7checker1.json" "$RUNNER_TEMP/c7checker2.json"
          cmp "$RUNNER_TEMP/c7checker1.stdout" "$RUNNER_TEMP/c7checker2.stdout"
          echo GATE2C8_C7_PROJECTION_CONTROL_DUAL_REPLAY=PASS

      - name: Observe Gate2C8 binding receipts twice without another C1 execution
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for N in 1 2; do
            python "$C8_OBSERVER" --gate2c8-protocol "$C8_PROTOCOL" --sources "$RUNNER_TEMP/gate2c8-sources" --cases "$RUNNER_TEMP/gate2c8-cases" --output "$RUNNER_TEMP/observer$N.json" > "$RUNNER_TEMP/observer$N.stdout"
          done
          cmp "$RUNNER_TEMP/observer1.json" "$RUNNER_TEMP/observer2.json"
          cmp "$RUNNER_TEMP/observer1.stdout" "$RUNNER_TEMP/observer2.stdout"
          echo GATE2C8_BINDING_OBSERVATION_DUAL_REPLAY=PASS

      - name: Independently verify the Gate2C7 to Gate2C8 causal transition twice
        shell: bash
        run: |
          set -euo pipefail
          for N in 1 2; do
            python "$C8_CHECKER" --gate2c8-protocol "$C8_PROTOCOL" --gate2c7-ledger "$C7_LEDGER" --gate2c7-diagnosis "$C7_DIAGNOSIS" --canonical-authority "$C5_AUTHORITY" --runner "$RUNNER_TEMP/replay1/E2_GATE2C7_EXACT_SEVEN_C1_REQUALIFICATION.json" --c7-checker "$RUNNER_TEMP/c7checker1.json" --observer "$RUNNER_TEMP/observer1.json" --sources "$RUNNER_TEMP/gate2c8-sources" --cases "$RUNNER_TEMP/gate2c8-cases" --reports "$RUNNER_TEMP/replay1/cases" --output "$RUNNER_TEMP/c8checker$N.json" > "$RUNNER_TEMP/c8checker$N.stdout"
          done
          cmp "$RUNNER_TEMP/c8checker1.json" "$RUNNER_TEMP/c8checker2.json"
          cmp "$RUNNER_TEMP/c8checker1.stdout" "$RUNNER_TEMP/c8checker2.stdout"
          echo GATE2C8_CAUSAL_CHECK_DUAL_REPLAY=PASS

      - name: Materialize first-complete exact-seven payload before decision
        shell: bash
        run: |
          set -euo pipefail
          PAY="$RUNNER_TEMP/payload"; export PAY; mkdir -p "$PAY/c1-reports"
          cp "$RUNNER_TEMP/replay1/E2_GATE2C7_EXACT_SEVEN_C1_REQUALIFICATION.json" "$PAY/E2_GATE2C8_EXACT_SEVEN_C1_REQUALIFICATION.json"
          cp "$RUNNER_TEMP/replay1/cases/"*.c1_report.json "$PAY/c1-reports/"
          cp "$RUNNER_TEMP/c7checker1.json" "$PAY/E2_GATE2C8_C7_PROJECTION_CONTROL.json"
          cp "$RUNNER_TEMP/observer1.json" "$PAY/E2_GATE2C8_EXACT_SEVEN_BINDING_AUTHORITY_OBSERVATION.json"
          cp "$RUNNER_TEMP/c8checker1.json" "$PAY/E2_GATE2C8_EXACT_SEVEN_C1_INDEPENDENT_CHECKER.json"
          cp "$RUNNER_TEMP/locator.json" "$PAY/E2_GATE2C8_EXACT_SEVEN_SOURCE_LOCATOR_RECEIPT.json"
          cp "$RUNNER_TEMP/selected-input-verification.json" "$PAY/E2_GATE2C8_SELECTED_FROZEN_C1_INPUT_VERIFICATION.json"
          cp "$RUNNER_TEMP/replay1.tree" "$PAY/E2_GATE2C8_EXACT_SEVEN_C1_REPLAY_LOGICAL_TREE.sha256"
          cp "$RUNNER_TEMP/replay1.stdout" "$PAY/E2_GATE2C8_EXACT_SEVEN_C1_REPLAY.stdout"
          cp "$RUNNER_TEMP/c8checker1.stdout" "$PAY/E2_GATE2C8_EXACT_SEVEN_C1_INDEPENDENT_CHECKER.stdout"
          python - <<'PY'
          import hashlib,json,os,platform
          from pathlib import Path
          pay=Path(os.environ['PAY']); r=json.loads((pay/'E2_GATE2C8_EXACT_SEVEN_C1_REQUALIFICATION.json').read_text()); c=json.loads((pay/'E2_GATE2C8_EXACT_SEVEN_C1_INDEPENDENT_CHECKER.json').read_text()); h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          success=(r['all_seven_valid_c1'] is True and r['all_seven_c1_preservation'] is True and c['status']=='PASS' and c['gate2c7_valid_c1_count']==0 and c['gate2c8_valid_c1_count']==7 and c['all_binding_receipts_independently_exact'] is True and c['all_binding_relations_exact'] is True and c['all_raw_origin_and_lineage_exact'] is True and c['all_a3_nonrole_obligations_invariant'] is True and c['all_a4_obligations_invariant'] is True and c['all_world_relations_invariant'] is True)
