name: E2 Gate2D D3 Closure Qualification

on:
  push:
    branches:
      - gate2d-d3-closure-qualification
    paths:
      - 'tools/e2_gate2d_d3_preflight.py'
      - 'tools/e2_gate2d_d3_provider_smoke.py'
      - '.github/workflows/e2-gate2d-d3-closure-qualification.yml'

permissions:
  contents: read

env:
  LC_ALL: C.UTF-8
  PYTHONHASHSEED: '0'
  TZ: UTC
  PYTHONPATH: ${{ github.workspace }}

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'

      - name: Exact runtime and prospective D3 preflight
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p d3_artifact
          python tools/e2_gate2d_d3_preflight.py \
            --root . \
            --out d3_artifact/D3_PREFLIGHT.json

      - name: Frozen B3 dual-lane nonheldout provider smoke
        if: always()
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p d3_artifact
          python tools/e2_gate2d_d3_provider_smoke.py \
            --root . \
            --protocol protocols/RISU_DIFF_E2_GATE2D_D3_CLOSURE_PROTOCOL_v0.1.json \
            --preflight d3_artifact/D3_PREFLIGHT.json \
            --outdir d3_artifact

      - name: Materialize D3 artifact manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p d3_artifact
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("d3_artifact")
          fs=[]
          for p in sorted(x for x in root.rglob("*") if x.is_file()):
              if p.name=="ARTIFACT_FILE_MANIFEST.json":
                  continue
              b=p.read_bytes()
              fs.append({"path":str(p.relative_to(root)),"sha256":hashlib.sha256(b).hexdigest(),"size":len(b)})
          (root/"ARTIFACT_FILE_MANIFEST.json").write_text(
              json.dumps({"schema":"risu.e2-gate2d-d3-artifact-manifest/v0.1","files":fs},sort_keys=True,separators=(",",":"))+"\n"
          )
          PY

      - name: Upload first-complete D3 artifact before assertion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-gate2d-d3-closure-first-complete
          path: d3_artifact
          if-no-files-found: error
          retention-days: 90

      - name: Frozen D3 closure assertion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("d3_artifact/D3_PREFLIGHT.json")
          q=Path("d3_artifact/D3_PROVIDER_SMOKE.json")
          if not p.exists() or not q.exists():
              raise SystemExit("D3_RESULT_MISSING")
          a=json.loads(p.read_bytes())
          b=json.loads(q.read_bytes())
          if a.get("status")!="PASS":
              raise SystemExit("D3_PREFLIGHT_FAIL")
          if b.get("status")!="PASS":
              raise SystemExit("D3_PROVIDER_SMOKE_FAIL")
          if b.get("provider_request_count")!=2:
              raise SystemExit("D3_PROVIDER_REQUEST_COUNT")
          lanes=b.get("lanes",{})
          for provider in ("openai","anthropic"):
              if lanes.get(provider,{}).get("semantically_valid_response") is not True:
                  raise SystemExit("D3_LANE_INVALID:"+provider)
          for d in (a,b):
              if any(d.get(k) is not False for k in ("epistemic10_read","truth_read","fresh_target_read","mutation_algebra_opened","gate2e_authorized")):
                  raise SystemExit("D3_FIREWALL_FAIL")
          print("GATE2D_D3_FIRST_COMPLETE_PASS")
          PY
