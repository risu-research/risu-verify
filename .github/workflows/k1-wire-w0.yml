name: K1 Wire W0

on:
  push:
    branches:
      - k1-adversarial-gate-a0
    paths:
      - 'protocols/RISU_KERNEL_K1_WIRE_W0.json'
      - 'schemas/RISU_KERNEL_K1_WIRE_W0.schema.json'
      - 'tools/risu_kernel_k1_wire_w0_verify.py'
      - '.github/workflows/k1-wire-w0.yml'
  pull_request:
    paths:
      - 'protocols/RISU_KERNEL_K1_WIRE_W0.json'
      - 'schemas/RISU_KERNEL_K1_WIRE_W0.schema.json'
      - 'tools/risu_kernel_k1_wire_w0_verify.py'
      - '.github/workflows/k1-wire-w0.yml'

permissions:
  contents: read

jobs:
  wire-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify W0 identity and adversarial vectors
        run: python3 tools/risu_kernel_k1_wire_w0_verify.py
