name: RISU Unit 002-R presemantic frozen-core grammar gate

on:
  push:
    branches:
      - unit002-r-presemantic-grammar

permissions:
  contents: read

jobs:
  grammar-only:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SEALED_HEAD: "1f9fba3a270f05d06763a5c81216d2edddffad8b"
      MANIFEST: "corpus/0.1/units/002-octokit-pulls-merge/PRIMARY_RUN_MANIFEST_AMENDMENT005.json"
    steps:
      - name: Checkout exact corrected sealed scientific head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 1f9fba3a270f05d06763a5c81216d2edddffad8b

      - name: Build exact compiled input surface without semantic verifier
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SEALED_HEAD"
          chmod +x tools/*.py
          python tools/materialize_case_bundles.py
          rm -rf /tmp/u002-grammar-case
          python tools/corpus01_compile.py \
            corpus/0.1/units/002-octokit-pulls-merge/vbe.instance.json \
            --output /tmp/u002-grammar-case
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.corpus01_primary_v08 import sanitize_report_metadata
          target=json.loads(Path('corpus/0.1/units/002-octokit-pulls-merge/TARGET_LANE.json').read_text())
          boundary=json.loads(Path('corpus/0.1/units/002-octokit-pulls-merge/BOUNDARY_MODEL.json').read_text())
          sanitation=sanitize_report_metadata(Path('/tmp/u002-grammar-case'),target,boundary)
          assert sanitation['semantic_assurance_inputs_unchanged'] is True
          PY
          python tools/corpus01_bound_evidence.py \
            /tmp/u002-grammar-case \
            corpus/0.1/units/002-octokit-pulls-merge \
            "$MANIFEST" --json
          python tools/corpus01_provenance_preflight.py \
            /tmp/u002-grammar-case/assurance/adapter.json --json

      - name: Validate frozen-core grammar only, never evaluate program
        run: |
          set -euo pipefail
          rm -rf /tmp/u002-core /tmp/u002-grammar-evidence
          mkdir -p /tmp/u002-core /tmp/u002-grammar-evidence
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          pin=json.loads(Path('CORE_PIN.json').read_text())
          p=Path(pin['archive'])
          assert hashlib.sha256(p.read_bytes()).hexdigest()==pin['archive_sha256']
          with zipfile.ZipFile(p) as z: z.extractall('/tmp/u002-core')
          PY
          python - <<'PY'
          from __future__ import annotations
          import hashlib, importlib, json, sys
          from pathlib import Path

          roots=[p for p in Path('/tmp/u002-core').iterdir() if p.is_dir()]
          assert len(roots)==1, roots
          core=roots[0]
          sys.path.insert(0,str(core))
          pa=importlib.import_module('verifier.projection_adapter')
          rc=importlib.import_module('compiler.implementations.reference_compiler')

          case=Path('/tmp/u002-grammar-case')
          adapter=json.loads((case/'assurance/adapter.json').read_text())
          source=json.loads((case/'assurance/source-contract.json').read_text())

          # Frozen-core OUTER SHAPE only. No world evaluation and no verifier execution.
          pa.validate_adapter_shape(adapter)
          assert adapter['adapter_version']=='0.7'
          assert source['source_contract_version']=='0.7'

          der=adapter['target']['derivation']
          program=der['program']
          assert program['program_version']=='0.5'
          assert der['mode']=='CONSEQUENCE_BLIND'
          facts={f['id']:f['status'] for f in der['facts']}
          assert facts and all(isinstance(k,str) and k for k in facts)

          # Validate the exact blind-program grammar stage-by-stage using the frozen
          # reference compiler's syntax validator. Deliberately DO NOT call
          # validate_payload/compile_payload because payload construction introduces
          # normalized world_records and compile_payload evaluates expressions.
          checked={}
          for name in ('discriminator','operative_signature','mechanism','interpreter'):
              spec=program.get(name)
              assert isinstance(spec,dict), f'missing stage {name}'
              assert set(spec)=={'required_fact_ids','expr'}, (name,set(spec))
              reqs=spec['required_fact_ids']
              assert isinstance(reqs,list) and len(reqs)==len(set(reqs)), name
              assert reqs and all(facts.get(fid)=='ESTABLISHED' for fid in reqs), (name,reqs)
              rc.validate_expr(spec['expr'],rc.STAGES[name],f'program.{name}.expr')
              checked[name]={
                  'required_fact_count':len(reqs),
                  'required_facts':list(reqs),
                  'expression_grammar':'PASS',
              }

          # Firewall: these semantic-evaluation/verdict functions are intentionally never called.
          forbidden=(
              'reference_compiler.validate_payload',
              'reference_compiler.compile_payload',
              'checker.compile_blind',
              'risu-verify verify',
          )
          record={
            'schema':'risu.unit002-r-presemantic-core-grammar/v0.2alpha1',
            'status':'PASS',
            'sealed_scientific_head':'1f9fba3a270f05d06763a5c81216d2edddffad8b',
            'frozen_core_archive_sha256':'bc3c0be440b1b729d3131a630491cce62f1f885fb305aa46a4483fee0adad72f',
            'compiled_adapter_sha256':hashlib.sha256((case/'assurance/adapter.json').read_bytes()).hexdigest(),
            'compiled_source_contract_sha256':hashlib.sha256((case/'assurance/source-contract.json').read_bytes()).hexdigest(),
            'adapter_version':adapter['adapter_version'],
            'source_contract_version':source['source_contract_version'],
            'program_version':program['program_version'],
            'derivation_mode':der['mode'],
            'outer_adapter_shape_validation':'PASS',
            'stage_grammar_validation':'PASS',
            'checked_stages':checked,
            'semantic_program_evaluated':False,
            'world_records_normalized_or_evaluated':False,
            'semantic_verifier_executed':False,
            'semantic_outcome_observed':False,
            'explicitly_not_called':list(forbidden),
          }
          out=Path('/tmp/u002-grammar-evidence/GRAMMAR_GATE.json')
          out.write_text(json.dumps(record,indent=2,sort_keys=True)+'\n')
          print(json.dumps(record,indent=2,sort_keys=True))
          PY

      - name: Upload presemantic grammar evidence
        uses: actions/upload-artifact@v4
        with:
          name: unit002-r-presemantic-grammar-${{ github.run_id }}
          path: /tmp/u002-grammar-evidence/GRAMMAR_GATE.json
          if-no-files-found: error
          retention-days: 90
