name: Historical event-date sensitivity QA
on:
  push:
    paths:
      - 'tools/public_historical_date_sensitivity.py'
      - '.github/workflows/public-historical-date-sensitivity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/public_historical_date_sensitivity.py
