name: E2 Gate2C1 Minimal Semantic Repair Qualification

on:
  push:
    branches: [gate2c1-staging]
    paths:
      - ".github/workflows/e2-gate2c1-minimal-semantic-repair-qualification.yml"

permissions:
  contents: write

env:
  EXPECTED_PARENT: 86cf41d42e61139775cc64975d040d0b334c6114
  CHARTER_PATH: protocols/RISU_DIFF_E2_GATE2C0_SEMANTIC_CARRIER_ROLE_SEPARATION_REPAIR_CHARTER_v0.1.json
  CHARTER_BLOB: 103d73d20d2e846d1e3fe99a2b6de6210280795d
  PATCHER_PATH: tools/e2_gate2c1_apply_semantic_carrier_repair.py
  PATCHER_BLOB: 0d3e28b19c4ffe7263be4a4ae3a39c7b70596916
  TEST_PATH: tests/test_e2_gate2c1_semantic_carrier_role_separation.py
  TEST_BLOB: f69bcba81cb3f05a1961c30611cf1754c3e07db6

jobs:
  qualify-and-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact prospective repair revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove pre-repair prospective boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/e2-gate2c1-minimal-semantic-repair-qualification.yml"
          test "$(git hash-object "$CHARTER_PATH")" = "$CHARTER_BLOB"
          test "$(git hash-object "$PATCHER_PATH")" = "$PATCHER_BLOB"
          test "$(git hash-object "$TEST_PATH")" = "$TEST_BLOB"
          git merge-base --is-ancestor 03be78392d6c8face2e68ac210cc9233fd30c0eb HEAD
          echo GATE2C1_PROSPECTIVE_BOUNDARY=PASS

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.5"

      - name: Apply deterministic bounded semantic repair
        shell: bash
        run: |
          set -euo pipefail
          python "$PATCHER_PATH" | tee "$RUNNER_TEMP/repair-application.txt"
          grep -q '^GATE2C1_REPAIR_APPLIED=PASS$' "$RUNNER_TEMP/repair-application.txt"

      - name: Prove exact semantic code surface and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            risu_e2/observability_overlay.py
            risu_e2_semantic/adapter_support.py
            risu_e2_semantic/primary_adapter.py
          )
          test "${#changed[@]}" -eq 3
          test "${changed[*]}" = "${expected[*]}"
          git diff --check
          ! git diff -- risu_e2_semantic/adapter_support.py | grep -q 'CONTROL_CONDITION.*EQ\|CONTROL_PREDICATE_RESULT.*EQ'
          ! git diff -- risu_e2 risu_e2_semantic | grep -Eq 'case_id.*==|language.*==|seed_id.*==|expected_label|mutation_operator|truth'
          test "$(git hash-object risu_e2_semantic/kernel.py)" = "e91e51397f4cc201452b1a0f80d130265dca2ea0"
          test "$(git hash-object risu_e2_semantic/certificate.py)" = "0006f4134f130fe1c3d8305f8f007d09b08ffc65"
          echo GATE2C1_CODE_SURFACE=PASS

      - name: Execute adversarial Gate2C1 synthetic qualification twice
        shell: bash
        env:
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          python -m py_compile risu_e2/observability_overlay.py risu_e2_semantic/adapter_support.py risu_e2_semantic/primary_adapter.py "$TEST_PATH"
          python "$TEST_PATH" > "$RUNNER_TEMP/gate2c1-test-1.txt" 2>&1
          python "$TEST_PATH" > "$RUNNER_TEMP/gate2c1-test-2.txt" 2>&1
          cmp "$RUNNER_TEMP/gate2c1-test-1.txt" "$RUNNER_TEMP/gate2c1-test-2.txt"
          grep -q '^OK$' "$RUNNER_TEMP/gate2c1-test-1.txt"
          echo GATE2C1_ADVERSARIAL_SYNTHETIC_DUAL_REPLAY=PASS

      - name: Requalify frozen Gate1B1C synthetic core twice
        shell: bash
        env:
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          rm -f gate1b1c-qualification.json
          python tests/run_e2_gate1b1c_qualification.py > "$RUNNER_TEMP/gate1b1c-1.txt"
          cp gate1b1c-qualification.json "$RUNNER_TEMP/gate1b1c-1.json"
          rm -f gate1b1c-qualification.json
          python tests/run_e2_gate1b1c_qualification.py > "$RUNNER_TEMP/gate1b1c-2.txt"
          cmp "$RUNNER_TEMP/gate1b1c-1.txt" "$RUNNER_TEMP/gate1b1c-2.txt"
          cmp "$RUNNER_TEMP/gate1b1c-1.json" gate1b1c-qualification.json
          grep -q '"status":"PASS"' gate1b1c-qualification.json
          rm -f gate1b1c-qualification.json
          echo GATE2C1_GATE1B1C_SYNTHETIC_REGRESSION=PASS

      - name: Materialize pre-freeze qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/gate2c1-qualification"
          mkdir -p "$OUT"
          python - <<'PY'
          import hashlib,json,os,platform,subprocess
          from pathlib import Path
          root=Path('.')
          rels=['risu_e2/observability_overlay.py','risu_e2_semantic/adapter_support.py','risu_e2_semantic/primary_adapter.py']
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          blob=lambda p:subprocess.check_output(['git','hash-object',p],text=True).strip()
          receipt={
            'schema':'risu.e2-gate2c1-minimal-semantic-repair-qualification/v0.1',
            'status':'SYNTHETICALLY_QUALIFIED_REPAIR_NOT_CANDIDATE58_REQUALIFIED',
            'workflow_run_id':os.environ['GITHUB_RUN_ID'],
            'workflow_trigger_sha':os.environ['GITHUB_SHA'],
            'python_version':platform.python_version(),
            'gate2c0_charter_git_blob':os.environ['CHARTER_BLOB'],
            'patcher_git_blob':os.environ['PATCHER_BLOB'],
            'test_git_blob':os.environ['TEST_BLOB'],
            'semantic_files':{p:{'git_blob':blob(p),'sha256':sha(p)} for p in rels},
            'adversarial_synthetic_dual_replay_identical':True,
            'gate1b1c_synthetic_dual_replay_identical':True,
            'candidate58_requalification_executed':False,
            'epistemic10_read':False,
            'truth_or_expected_label_used_for_repair':False,
            'kernel_or_certificate_changed':False,
            'c1_changed':False,
          }
          out=Path(os.environ['OUT'])/'E2_GATE2C1_MINIMAL_REPAIR_QUALIFICATION_RECEIPT.json'
          out.write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n')
          print(out.read_text(),end='')
          PY

      - name: Upload qualification receipt before implementation freeze
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-gate2c1-minimal-repair-qualification
          path: ${{ runner.temp }}/gate2c1-qualification/E2_GATE2C1_MINIMAL_REPAIR_QUALIFICATION_RECEIPT.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Commit and push exact three-file semantic repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RISU Evidence Freeze"
          git config user.email "risu-evidence-freeze@users.noreply.github.com"
          git add risu_e2/observability_overlay.py risu_e2_semantic/adapter_support.py risu_e2_semantic/primary_adapter.py
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            risu_e2/observability_overlay.py
            risu_e2_semantic/adapter_support.py
            risu_e2_semantic/primary_adapter.py
          )
          test "${#staged[@]}" -eq 3
          test "${staged[*]}" = "${expected[*]}"
          git commit -m "Apply Gate2C1 semantic carrier role separation repair"
          git push origin HEAD:gate2c1-staging
          echo "GATE2C1_REPAIR_COMMIT=$(git rev-parse HEAD)"

      - name: Post-push remote verification
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/gate2c1-staging | cut -f1)"
          test "$local_sha" = "$remote_sha"
          echo GATE2C1_REMOTE_FREEZE_CANDIDATE=PASS
