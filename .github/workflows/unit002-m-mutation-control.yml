name: RISU Unit 002-M mutation control

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-mutation-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Restore executable entrypoints
        run: |
          chmod +x risu-verify
          chmod +x tools/*.py

      - name: Syntax-check frozen control executor
        run: python -m py_compile tools/unit002_mutation_control.py

      - name: Verify pre-execution PLAN freeze identity
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          import unit002_mutation_control as u
          plan, freeze, check = u.verify_freeze()
          print(check)
          assert plan['status'] == 'PREDECLARED_BEFORE_MUTATION_EXECUTION'
          assert freeze['status'] == 'FROZEN_BEFORE_MUTATION_EXECUTION'
          PY

      - name: Execute full paired sensitivity-specificity crucible
        run: |
          python tools/unit002_mutation_control.py \
            --output .risu/unit002-m \
            --json

      - name: Write control summary
        if: always()
        shell: bash
        run: |
          if [ -f .risu/unit002-m/MATRIX_RESULT.md ]; then
            cat .risu/unit002-m/MATRIX_RESULT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Unit 002-M" >> "$GITHUB_STEP_SUMMARY"
            echo "Control execution did not produce a complete matrix result." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload complete mutation-control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit002-m-${{ github.sha }}-${{ github.run_id }}
          path: .risu/unit002-m/**
          if-no-files-found: warn
          retention-days: 90
