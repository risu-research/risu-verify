name: E2 Gate2D D1prime Copilot Identity Qualification

on:
  push:
    branches:
      - gate2d-d1p-copilot-identity
    paths:
      - evaluation/gate2d/BASELINE_REGISTRY_v0.2.json
      - evaluation/gate2d/B3_COPILOT_CONFIG_v0.1.json
      - evaluation/gate2d/D1P_IDENTITY_MANIFEST_v0.1.json
      - tools/e2_gate2d_copilot_baseline.py
      - tools/e2_gate2d_evaluate_v2.py
      - tools/e2_gate2d_check_evaluation_v2.py
      - .github/workflows/e2-gate2d-d1p-copilot-identity-qualification.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'

      - name: Static D1prime identity preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p d1p-artifact
          python - <<'PY'
          import hashlib, importlib.util, json, subprocess
          from pathlib import Path

          ROOT=Path(".").resolve()
          BASE="9920ee588fa9a75e79ae8a4c308bacbb276feb1f"
          allowed={
            "evaluation/gate2d/BASELINE_REGISTRY_v0.2.json",
            "evaluation/gate2d/B3_COPILOT_CONFIG_v0.1.json",
            "evaluation/gate2d/D1P_IDENTITY_MANIFEST_v0.1.json",
            "tools/e2_gate2d_copilot_baseline.py",
            "tools/e2_gate2d_evaluate_v2.py",
            "tools/e2_gate2d_check_evaluation_v2.py",
            ".github/workflows/e2-gate2d-d1p-copilot-identity-qualification.yml",
          }
          failures=[]
          def git(*args):
              return subprocess.check_output(["git",*args],text=True).strip()
          def sha256(b): return hashlib.sha256(b).hexdigest()
          def git_blob_bytes(b):
              return hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()

          changed=set(git("diff","--name-only",BASE,"HEAD").splitlines())
          if changed != allowed:
              failures.append("IMPLEMENTATION_SURFACE:"+repr(sorted(changed)))

          manifest=json.loads((ROOT/"evaluation/gate2d/D1P_IDENTITY_MANIFEST_v0.1.json").read_bytes())
          if manifest.get("parent_contract_commit") != BASE:
              failures.append("MANIFEST_PARENT")
          for rel,ident in sorted((manifest.get("files") or {}).items()):
              p=ROOT/rel
              if not p.is_file():
                  failures.append("MANIFEST_MISSING:"+rel); continue
              b=p.read_bytes()
              if len(b)!=ident["size"]: failures.append("MANIFEST_SIZE:"+rel)
              if sha256(b)!=ident["sha256"]: failures.append("MANIFEST_SHA256:"+rel)
              if git_blob_bytes(b)!=ident["git_blob"]: failures.append("MANIFEST_GIT_BLOB:"+rel)

          oldm=json.loads((ROOT/"evaluation/gate2d/D1_IDENTITY_MANIFEST_v0.1.json").read_bytes())
          reused=[
            "evaluation/gate2d/B3_LLM_PROMPT_v0.1.txt",
            "evaluation/gate2d/B3_LLM_RESPONSE_SCHEMA_v0.1.json",
            "evaluation/gate2d/COMMON_BLINDED_INPUT_CONTRACT_v0.1.json",
            "tools/e2_gate2d_evaluate.py",
            "tools/e2_gate2d_check_evaluation.py",
          ]
          for rel in reused:
              ident=oldm["files"][rel]; b=(ROOT/rel).read_bytes()
              if len(b)!=ident["size"] or sha256(b)!=ident["sha256"] or git_blob_bytes(b)!=ident["git_blob"]:
                  failures.append("REUSED_LOCK:"+rel)

          constitution=json.loads((ROOT/"protocols/RISU_DIFF_E2_GATE2D_EVALUATION_CONSTITUTION_v0.1.json").read_bytes())
          for rel,want in sorted(constitution["authority_locks"]["semantic_snapshot"]["critical_blob_locks"].items()):
              if git("hash-object",rel)!=want:
                  failures.append("SEMANTIC_SNAPSHOT:"+rel)

          old=json.loads((ROOT/"evaluation/gate2d/BASELINE_REGISTRY_v0.1.json").read_bytes())
          new=json.loads((ROOT/"evaluation/gate2d/BASELINE_REGISTRY_v0.2.json").read_bytes())
          def nonb3(d):
              return [x for x in d["baselines"] if not x["id"].startswith("B3")]
          if nonb3(old)!=nonb3(new):
              failures.append("NON_B3_REGISTRY_DELTA")
          if old["fairness_rules"]!=new["fairness_rules"] or old["normalization"]!=new["normalization"]:
              failures.append("REGISTRY_RULE_DELTA")
          nb=[x for x in new["baselines"] if x["id"].startswith("B3")]
          if [x["id"] for x in nb] != ["B3A_GPT56_SOL_COPILOT","B3B_CLAUDE_OPUS5_COPILOT"]:
              failures.append("B3_IDS")
          if [x["model"] for x in nb] != ["gpt-5.6-sol","claude-opus-5"]:
              failures.append("B3_MODELS")

          cfg=json.loads((ROOT/"evaluation/gate2d/B3_COPILOT_CONFIG_v0.1.json").read_bytes())
          if cfg["transport"]["cli_package"]!="@github/copilot" or cfg["transport"]["cli_version"]!="1.0.83":
              failures.append("COPILOT_CLI_ID")
          if cfg["transport"]["authentication_env"]!="COPILOT_GITHUB_TOKEN":
              failures.append("COPILOT_AUTH_ENV")
          if cfg["transport"]["max_ai_credits_per_response"]!=30:
              failures.append("COPILOT_CREDIT_CAP")
          if set(cfg["lanes"])!={"B3A_GPT56_SOL_COPILOT","B3B_CLAUDE_OPUS5_COPILOT"}:
              failures.append("COPILOT_LANES")

          def load_wrapper(rel,name):
              spec=importlib.util.spec_from_file_location(name,ROOT/rel)
              if spec is None or spec.loader is None: raise RuntimeError(rel)
              mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
              return mod.load()
          ev=load_wrapper("tools/e2_gate2d_evaluate_v2.py","d1p_eval_wrapper")
          if ev.BS != {"B0_STRUCTURAL_SCHEMA_DIFF","B1_AST_SYNTACTIC_DATAFLOW","B2_STRONG_STATIC_DATAFLOW","B3A_GPT56_SOL_COPILOT","B3B_CLAUDE_OPUS5_COPILOT","B4_EXECUTION_ONLY_DIFFERENTIAL"}:
              failures.append("EVALUATOR_WRAPPER_SET")
          ck=load_wrapper("tools/e2_gate2d_check_evaluation_v2.py","d1p_checker_wrapper")
          if ck.EXPECTED_BASELINES != {"B0_STRUCTURAL_SCHEMA_DIFF","B1_AST_SYNTACTIC_DATAFLOW","B2_STRONG_STATIC_DATAFLOW","B3A_GPT56_SOL_COPILOT","B3B_CLAUDE_OPUS5_COPILOT","B4_EXECUTION_ONLY_DIFFERENTIAL"}:
              failures.append("CHECKER_WRAPPER_SET")
          if "e2_gate2d_evaluate" in (ROOT/"tools/e2_gate2d_check_evaluation_v2.py").read_text():
              failures.append("CHECKER_IMPORTS_EVALUATOR")

          wf=(ROOT/".github/workflows/e2-gate2d-d1p-copilot-identity-qualification.yml").read_text()
          if "COPILOT_GITHUB_TOKEN:" in wf or "RISU_COPILOT_PERSONAL_TOKEN" in wf:
              failures.append("D1P_SEMANTIC_CREDENTIAL_SURFACE")
          if "copilot -p" in wf or "copilot --prompt" in wf:
              failures.append("D1P_SEMANTIC_REQUEST_SURFACE")

          out={
            "schema":"risu.e2-gate2d-d1p-static-preflight/v0.1",
            "status":"PASS" if not failures else "FAIL",
            "failures":sorted(failures),
            "changed_files":sorted(changed),
            "semantic_snapshot_exact":not any(x.startswith("SEMANTIC_SNAPSHOT:") for x in failures),
            "historical_reused_locks_exact":not any(x.startswith("REUSED_LOCK:") for x in failures),
            "provider_semantic_request_count":0,
            "epistemic10_read":False,
            "truth_read":False,
            "fresh_target_read":False,
            "mutation_algebra_opened":False,
            "gate2e_authorized":False,
          }
          Path("d1p-artifact/D1P_STATIC_PREFLIGHT.json").write_text(json.dumps(out,sort_keys=True,separators=(",",":"))+"\n")
          if failures: raise SystemExit(2)
          PY

      - name: Install and fingerprint exact Copilot CLI without semantic request
        shell: bash
        run: |
          set -euo pipefail
          node --version > d1p-artifact/NODE_VERSION.txt
          npm --version > d1p-artifact/NPM_VERSION.txt
          npm view @github/copilot@1.0.83 dist.integrity --json > d1p-artifact/COPILOT_NPM_INTEGRITY.json
          npm install -g @github/copilot@1.0.83
          npm list -g @github/copilot --json > d1p-artifact/COPILOT_NPM_TREE.json
          copilot --version > d1p-artifact/COPILOT_VERSION.txt
          copilot help > d1p-artifact/COPILOT_HELP.txt
          python - <<'PY'
          import json
          from pathlib import Path
          tree=json.loads(Path("d1p-artifact/COPILOT_NPM_TREE.json").read_text())
          got=((tree.get("dependencies") or {}).get("@github/copilot") or {}).get("version")
          if got!="1.0.83": raise SystemExit("COPILOT_VERSION_MISMATCH:"+repr(got))
          h=Path("d1p-artifact/COPILOT_HELP.txt").read_text()
          for flag in ("--model","--max-ai-credits","--deny-tool","--output-format","--no-custom-instructions"):
              if flag not in h: raise SystemExit("COPILOT_HELP_MISSING:"+flag)
          PY

      - name: Materialize D1prime identity qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          pre=json.loads(Path("d1p-artifact/D1P_STATIC_PREFLIGHT.json").read_text())
          tree=json.loads(Path("d1p-artifact/COPILOT_NPM_TREE.json").read_text())
          out={
            "schema":"risu.e2-gate2d-d1p-identity-qualification/v0.1",
            "status":"PASS" if pre["status"]=="PASS" and ((tree.get("dependencies") or {}).get("@github/copilot") or {}).get("version")=="1.0.83" else "FAIL",
            "source_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "source_tree":subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip(),
            "parent_contract_commit":"9920ee588fa9a75e79ae8a4c308bacbb276feb1f",
            "copilot_cli":{"package":"@github/copilot","version":"1.0.83","npm_integrity_file_sha256":sha("d1p-artifact/COPILOT_NPM_INTEGRITY.json"),"help_sha256":sha("d1p-artifact/COPILOT_HELP.txt")},
            "provider_semantic_request_count":0,
            "epistemic10_read":False,"truth_read":False,"fresh_target_read":False,"mutation_algebra_opened":False,
            "gate2e_authorized":False,
            "next_authorized_action":"FREEZE_D1PRIME_IDENTITY_RESULT_THEN_D2PRIME_ONLY",
          }
          Path("d1p-artifact/D1P_IDENTITY_QUALIFICATION.json").write_text(json.dumps(out,sort_keys=True,separators=(",",":"))+"\n")
          PY

      - name: Upload D1prime artifact before assertion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-gate2d-d1prime-copilot-identity
          path: d1p-artifact/
          if-no-files-found: error
          retention-days: 90

      - name: Frozen D1prime assertion
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("d1p-artifact/D1P_IDENTITY_QUALIFICATION.json").read_text())
          if d.get("status")!="PASS": raise SystemExit(2)
          if d.get("provider_semantic_request_count")!=0: raise SystemExit(3)
          PY
