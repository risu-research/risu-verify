name: E2 Candidate58 Mechanical Harness Qualification

on:
  push:
    branches: [e2-development]
    paths:
      - "risu_e2_semantic/candidate58_harness.py"
      - "tools/e2_candidate58_execution_harness.py"
      - "tools/e2_candidate58_prepare_execution.py"
      - "tools/e2_candidate58_execution_harness_v2.py"
      - "tests/test_e2_candidate58_execution_harness.py"
      - ".github/workflows/e2-candidate58-harness-qualification.yml"
      - "protocols/RISU_DIFF_E2_CANDIDATE58_HARNESS_IMPLEMENTATION_FREEZE_v0.1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-mechanical-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 32
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.5"

      - name: Verify frozen semantic authorities and development delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object protocols/RISU_DIFF_E2_CANDIDATE58_FIRST_SEMANTIC_EXECUTION_PROTOCOL_v0.1.json)" = "08fdbcf517feafc159f229460eb7d82947a0c71b"
          test "$(git hash-object protocols/RISU_DIFF_E2_GATE1B1C_IMPLEMENTATION_FREEZE_v0.1.json)" = "24724a44a7a200e7f069e4e62b5ee16df673dcf2"
          test "$(git hash-object risu_e2_semantic/kernel.py)" = "e91e51397f4cc201452b1a0f80d130265dca2ea0"
          test "$(git hash-object risu_e2_semantic/certificate.py)" = "0006f4134f130fe1c3d8305f8f007d09b08ffc65"
          test "$(git hash-object risu_e2_semantic/primary_adapter.py)" = "c1b5d5e666bdd1b8f9bb1e041f76368f7f7a741c"
          test "$(git hash-object risu_e2_semantic/closed_read_set.py)" = "5d98c4708e2bcab376d9fc67f660809c93c6e499"
          test "$(git hash-object risu_e2_c1/rechecker.py)" = "ec7e782c88fb8786eb5b3d267e44d81885707728"
          python - <<'PY'
          import subprocess
          allowed={
            'risu_e2_semantic/candidate58_harness.py',
            'tools/e2_candidate58_execution_harness.py',
            'tools/e2_candidate58_prepare_execution.py',
            'tools/e2_candidate58_execution_harness_v2.py',
            'tests/test_e2_candidate58_execution_harness.py',
            '.github/workflows/e2-candidate58-harness-qualification.yml',
            'protocols/RISU_DIFF_E2_CANDIDATE58_HARNESS_IMPLEMENTATION_FREEZE_v0.1.json',
          }
          delta=set(subprocess.check_output(['git','diff','--name-only','1baafe5059ce015b68740f245d0b9d5a0a9e7634','HEAD'],text=True).splitlines())
          extra=sorted(delta-allowed)
          if extra: raise SystemExit('UNAUTHORIZED_POST_SEAL_DELTA:'+','.join(extra))
          print('POST_SEAL_DELTA_FIREWALL=PASS')
          PY

      - name: Make real Candidate58 semantic inputs unreadable during qualification
        shell: bash
        run: |
          set -euo pipefail
          chmod -R a-rwx experiments/risu-diff-e2/qualification/materialized/cells
          chmod 000 experiments/risu-diff-e2/qualification/anchor-transport/blind58/E2_BLIND_58_ANCHOR_TRANSPORT_BUNDLE.json
          chmod 000 experiments/risu-diff-e2/qualification/anchor-transport/admission/E2_SANITIZED_OPAQUE_58_ADMISSION_MANIFEST.json

      - name: Compile and run adversarial mechanical tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import platform
          assert platform.python_implementation()=='CPython'
          assert platform.python_version()=='3.13.5'
          print('RUNTIME=CPython-3.13.5')
          PY
          python -m py_compile \
            risu_e2_semantic/candidate58_harness.py \
            tools/e2_candidate58_execution_harness.py \
            tools/e2_candidate58_prepare_execution.py \
            tools/e2_candidate58_execution_harness_v2.py \
            tests/test_e2_candidate58_execution_harness.py
          python -m unittest -v tests.test_e2_candidate58_execution_harness

      - name: Verify semantic non-duplication and synthetic two-replay identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          core=pathlib.Path('risu_e2_semantic/candidate58_harness.py').read_text()
          prep=pathlib.Path('tools/e2_candidate58_prepare_execution.py').read_text()
          driver=pathlib.Path('tools/e2_candidate58_execution_harness_v2.py').read_text()
          forbidden=['A3_R1_','A3_R2_','A3_R3_','A3_R4_','A4_R1_','A4_R2_','A4_R3_','A4_R4_','A4_R5_','A4_R6_','A4_R7_']
          assert not any(x in core+prep+driver for x in forbidden)
          from risu_e2_semantic.candidate58_harness import assemble_outputs
          from risu_e2_semantic.kernel import INCOMPLETE, canonical_bytes, sha256_json
          ids=sorted(hashlib.sha256(f'case-{i:02d}'.encode()).hexdigest() for i in range(58))
          def run():
              rows=[]
              for cid in ids:
                  rows.append({'record':{'case_id':cid,'machine_prediction':INCOMPLETE},'certificate':{'case_id':cid},'c1_report':{'checker_output':'UNSUPPORTED_CERTIFICATE'}})
              return assemble_outputs(rows,expected_case_ids=ids)
          a=run(); b=run(); assert canonical_bytes(a)==canonical_bytes(b)
          result={
            'schema':'risu.e2-candidate58-harness-synthetic-qualification/v0.1',
            'status':'PASS',
            'synthetic_case_count':58,
            'two_replay_byte_identical':True,
            'semantic_witness_logic_reimplemented':False,
            'candidate58_source_bytes_read':False,
            'candidate58_truth_or_operator_read':False,
            'epistemic10_read':False,
            'logical_output_sha256':sha256_json(a),
          }
          pathlib.Path('E2_CANDIDATE58_HARNESS_SYNTHETIC_QUALIFICATION.json').write_bytes(canonical_bytes(result))
          print(json.dumps(result,sort_keys=True,separators=(',',':')))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-candidate58-harness-synthetic-qualification
          path: E2_CANDIDATE58_HARNESS_SYNTHETIC_QUALIFICATION.json
          if-no-files-found: error
          retention-days: 30

      - name: Final assertion after artifact upload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('E2_CANDIDATE58_HARNESS_SYNTHETIC_QUALIFICATION.json'))
          assert d['status']=='PASS'
          assert d['synthetic_case_count']==58
          assert d['two_replay_byte_identical'] is True
          assert d['semantic_witness_logic_reimplemented'] is False
          assert d['candidate58_source_bytes_read'] is False
          assert d['candidate58_truth_or_operator_read'] is False
          assert d['epistemic10_read'] is False
          PY
