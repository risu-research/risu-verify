name: K1 Implementation Binding B0

on:
  push:
    branches:
      - k1-implementation-binding-b0
    paths:
      - 'protocols/RISU_KERNEL_K1_IMPLEMENTATION_BINDING_B0.json'
      - 'protocols/RISU_KERNEL_K1_IMPLEMENTATION_BINDING_B0_D1.json'
      - 'fixtures/k1_binding_b0/**'
      - 'tools/risu_kernel_k1_binding_b0.py'
      - 'tools/risu_kernel_k1_binding_b0_verify.py'
      - 'tools/risu_kernel_k1_binding_b0_observer.go'
      - 'tools/risu_kernel_k1_binding_b0_observer_d1_verify.py'
      - 'tools/specimens/k1_binding_b0_target.go'
      - '.github/workflows/k1-implementation-binding-b0.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: '0'

jobs:
  adversarial-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Prove qualified base is untouched
        run: |
          set -euo pipefail
          base=3f3e6b9071d7fe1cd447f2bbbba9addbbe509533
          git merge-base --is-ancestor "$base" HEAD
          git diff --name-status "$base" HEAD | tee /tmp/b0-delta.txt
          test -s /tmp/b0-delta.txt
          if awk '$1 != "A" { bad=1 } END { exit bad ? 0 : 1 }' /tmp/b0-delta.txt; then
            echo 'B0 must be additive relative to k1-w2-qualified; non-additive delta found.' >&2
            exit 1
          fi
      - name: Source hygiene and builds
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile \
            tools/risu_kernel_k1_binding_b0.py \
            tools/risu_kernel_k1_binding_b0_verify.py \
            tools/risu_kernel_k1_binding_b0_observer_d1_verify.py
          gofmt -d tools/specimens/k1_binding_b0_target.go | tee /tmp/b0-target-gofmt.diff
          test ! -s /tmp/b0-target-gofmt.diff
          gofmt -d tools/risu_kernel_k1_binding_b0_observer.go | tee /tmp/b0-observer-gofmt.diff
          test ! -s /tmp/b0-observer-gofmt.diff
          go vet tools/specimens/k1_binding_b0_target.go
          go vet tools/risu_kernel_k1_binding_b0_observer.go
          go vet kernel/k1_checker_w2.go
          go build -trimpath -o /tmp/risu-k1-w2 kernel/k1_checker_w2.go
          go build -trimpath -o /tmp/risu-k1-b0-observer tools/risu_kernel_k1_binding_b0_observer.go
          mkdir -p /tmp/b0-bin
          for v in good bad stdout-lie nonzero-forbidden timeout-after-forbidden timeout-before-effect malformed multi; do
            go build -trimpath -ldflags "-s -w -X main.variant=$v" -o "/tmp/b0-bin/b0-$v" tools/specimens/k1_binding_b0_target.go
          done
      - name: Run precommitted B0 adversarial qualification
        run: |
          set -euo pipefail
          python tools/risu_kernel_k1_binding_b0_verify.py \
            --binder tools/risu_kernel_k1_binding_b0.py \
            --w1 kernel/k1_checker_w1.py \
            --w2 /tmp/risu-k1-w2 \
            --world fixtures/k1_binding_b0/world_input.txt \
            --claim fixtures/k1_binding_b0/claim.json \
            --bin-dir /tmp/b0-bin \
            --output /tmp/k1-binding-b0.json
          python - <<'PY'
          import json
          x = json.load(open('/tmp/k1-binding-b0.json', encoding='utf-8'))
          assert x['status'] == 'PASS'
          assert x['vector_count'] == 13
          assert x['passed'] == 13
          assert x['failed'] == []
          assert x['binder_independence']['pass'] is True
          assert x['preservation_authority'] is False
          assert x['implementation_binding_claim'] == 'SCOPED_ONE_SIDED_REGRESSION_ONLY'
          print('K1 implementation-binding B0: PASS')
          PY
      - name: Run independent observer differential D1
        run: |
          set -euo pipefail
          python tools/risu_kernel_k1_binding_b0_observer_d1_verify.py \
            --binder tools/risu_kernel_k1_binding_b0.py \
            --observer /tmp/risu-k1-b0-observer \
            --observer-source tools/risu_kernel_k1_binding_b0_observer.go \
            --w1 kernel/k1_checker_w1.py \
            --w2 /tmp/risu-k1-w2 \
            --world fixtures/k1_binding_b0/world_input.txt \
            --claim fixtures/k1_binding_b0/claim.json \
            --bin-dir /tmp/b0-bin \
            --output /tmp/k1-binding-b0-d1.json
          python - <<'PY'
          import json
          x = json.load(open('/tmp/k1-binding-b0-d1.json', encoding='utf-8'))
          assert x['status'] == 'PASS'
          assert x['runtime_vector_count'] == 8
          assert x['passed'] == 8
          assert x['failed'] == []
          assert x['observer_independence']['pass'] is True
          assert x['preservation_authority'] is False
          print('K1 implementation-binding B0 D1 independent observer differential: PASS')
          PY
