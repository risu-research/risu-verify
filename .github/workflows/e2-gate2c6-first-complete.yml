name: E2 Gate2C6 First Complete

on:
  push:
    branches: [e2-development]
    paths:
      - ".github/workflows/e2-gate2c6-first-complete.yml"

permissions:
  contents: write
  actions: read

env:
  EXPECTED_PARENT: 1cea7c1908e7054232ad1c92aa8115586a9f0a46
  PROTOCOL: protocols/RISU_DIFF_E2_GATE2C6_FROZEN_CANDIDATE_OPAQUE_PROJECTION_MATCH_PROTOCOL_v0.1.json
  IMPL_FREEZE: protocols/RISU_DIFF_E2_GATE2C6_IMPLEMENTATION_FREEZE_v0.1.json
  TRACER: tools/e2_gate2c6_candidate_projection_match.py
  CHECKER: tools/e2_gate2c6_check_candidate_projection_match.py
  LOCATOR: tools/e2_gate2c3_python_c1_world_eval_provenance.py
  CANONICAL: experiments/risu-diff-e2/qualification/candidate58/gate2c5-canonical-opaque-projection-identity/first-complete/E2_GATE2C5_CANONICAL_OPAQUE_PROJECTION_IDENTITY.json
  G2C3_LEDGER: experiments/risu-diff-e2/qualification/candidate58/gate2c3-python-c1-world-evaluation-provenance/first-complete/E2_GATE2C3_WORLD_EVAL_PROVENANCE_LEDGER.json
  G2C4_LEDGER: experiments/risu-diff-e2/qualification/candidate58/gate2c4-projection-shape-triangulation/first-complete/E2_GATE2C4_PROJECTION_SHAPE_TRIANGULATION_LEDGER.json
  G2C2A_FREEZE: experiments/risu-diff-e2/qualification/candidate58/gate2c2a-repaired-machine-requalification/first-complete/E2_GATE2C2A_FIRST_COMPLETE_IMMUTABLE_FREEZE_RECEIPT.json
  MATRIX: experiments/risu-diff-e2/qualification/candidate58/gate2c2a-repaired-machine-requalification/first-complete/E2_GATE2C2A_REPAIRED_MACHINE_PREDICTION_MATRIX.json
  ADMISSION: experiments/risu-diff-e2/qualification/anchor-transport/admission/E2_SANITIZED_OPAQUE_58_ADMISSION_MANIFEST.json
  CELLS: experiments/risu-diff-e2/qualification/materialized/cells
  RESULT_DIR: experiments/risu-diff-e2/qualification/candidate58/gate2c6-frozen-candidate-opaque-projection-match/first-complete
  PROTOCOL_BLOB: 44b002ff5e0a1f11f2d057978803fd8c5e43434e
  IMPL_FREEZE_BLOB: 6e2aa1b2e5072565b7e84f351fd73740244ff1d7
  TRACER_BLOB: 59cdff0611ba4f2fa6dc8137839d717d1e249c4d
  CHECKER_BLOB: 9a9dfe0221cfd09d5e2c2821102b5905a37be4c1
  LOCATOR_BLOB: a30172a3f72d17bc29b37b0f6c5d86a3b6893741
  CANONICAL_BLOB: 903ce09ca68dba6cb82100c3b2396d79a70b1b99
  CANONICAL_SHA: 943cafb73ef53c7d11c01ece51a429b67155fca95dec187f45897c4d2170ae24
  G2C3_LEDGER_BLOB: a0b2cc3904693a3b499cd8747c1e9eca9261eb18
  G2C4_LEDGER_BLOB: bfa5255536e1471c19009279b02eebcc663a13f9
  G2C2A_FREEZE_BLOB: 0a5853950905ecd2fca219945c4e8f3844f6af81
  MATRIX_SHA: da8cb707a5cc71b36881eafc01a377ba040bb5148ae3d3997ecd95f7572138d3
  ADMISSION_BLOB: f2fc78439d4bfadce5941bf71aadd15ec292bcb1
  ADMISSION_SHA: 847d85c2274cd6b94a83eefe0f6153a8fb183dbad758efa75118a4fd368623e4
  CELLS_TREE: 34a30574c7420728bff57958c815194979a622ab
  GATE2C2A_RUN_ID: "34159645664"
  GATE2C2A_ARTIFACT_ID: "10032162026"
  GATE2C2A_ARTIFACT_DIGEST: fe9ba1bcd2d8510acd487f6c5ff41592864bafe1b09df9a00e1a3706817d4b1d

jobs:
  first-complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact first-real revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove immutable authority chain and empty result slot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/e2-gate2c6-first-complete.yml"
          test "$(git hash-object "$PROTOCOL")" = "$PROTOCOL_BLOB"
          test "$(git hash-object "$IMPL_FREEZE")" = "$IMPL_FREEZE_BLOB"
          test "$(git hash-object "$TRACER")" = "$TRACER_BLOB"
          test "$(git hash-object "$CHECKER")" = "$CHECKER_BLOB"
          test "$(git hash-object "$LOCATOR")" = "$LOCATOR_BLOB"
          test "$(git hash-object "$CANONICAL")" = "$CANONICAL_BLOB"
          test "$(git hash-object "$G2C3_LEDGER")" = "$G2C3_LEDGER_BLOB"
          test "$(git hash-object "$G2C4_LEDGER")" = "$G2C4_LEDGER_BLOB"
          test "$(git hash-object "$G2C2A_FREEZE")" = "$G2C2A_FREEZE_BLOB"
          test "$(git hash-object "$ADMISSION")" = "$ADMISSION_BLOB"
          test "$(git rev-parse "HEAD:$CELLS")" = "$CELLS_TREE"
          echo "$CANONICAL_SHA  $CANONICAL" | sha256sum -c -
          echo "$MATRIX_SHA  $MATRIX" | sha256sum -c -
          echo "$ADMISSION_SHA  $ADMISSION" | sha256sum -c -
          test ! -e "$RESULT_DIR"
          test "$(git ls-remote origin refs/heads/e2-development | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path(os.environ['PROTOCOL']).read_text())
          f=json.loads(Path(os.environ['IMPL_FREEZE']).read_text())
          g3=json.loads(Path(os.environ['G2C3_LEDGER']).read_text())
          g4=json.loads(Path(os.environ['G2C4_LEDGER']).read_text())
          g2=json.loads(Path(os.environ['G2C2A_FREEZE']).read_text())
          ids=sorted(p['population']['case_ids'])
          assert p['status']=='PROSPECTIVE_SEALED_BEFORE_GATE2C6_CANDIDATE_PROJECTION_IDENTITY_DERIVATION'
          assert len(ids)==7 and p['population']['role_observation_count']==14
          assert f['status']=='IMPLEMENTATION_FROZEN_SYNTHETICALLY_QUALIFIED_BEFORE_FIRST_REAL_CANDIDATE_PROJECTION_DERIVATION'
          assert f['scientific_firewall']['candidate_projection_identity_observed_before_freeze'] is False
          assert sorted(r['case_id'] for r in g3['rows'])==ids
          assert all(r['taxonomy']=='WORLD_ROLE_VALUE_MISSING_LEFT' for r in g3['rows'])
          assert g4['confirmatory_summary']['all_confirmatory_projection_shapes_match'] is True
          assert g4['pilot']['taxonomy']=='THREE_WAY_PROJECTION_SHAPE_MATCH'
          assert g2['workflow_run_id']==os.environ['GATE2C2A_RUN_ID']
          assert g2['hosted_artifact']['id']==os.environ['GATE2C2A_ARTIFACT_ID']
          assert g2['hosted_artifact']['digest']==os.environ['GATE2C2A_ARTIFACT_DIGEST']
          assert g2['frozen_files_sha256']['E2_GATE2C2A_REPAIRED_MACHINE_PREDICTION_MATRIX.json']==os.environ['MATRIX_SHA']
          print('GATE2C6_AUTHORITY_CHAIN=PASS')
          PY

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.5"

      - name: Materialize exact seven sources via frozen opaque locator semantics
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/gate2c6-sources"; LOC="$RUNNER_TEMP/E2_GATE2C6_SOURCE_LOCATOR_RECEIPT.json"; export SRC LOC
          python "$LOCATOR" locate --cells-dir "$CELLS" --manifest "$ADMISSION" --protocol "$PROTOCOL" --output-sources "$SRC" --receipt "$LOC"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path(os.environ['LOC']).read_text())
          assert r['source_files_stream_hashed']==58
          assert r['source_files_semantically_parsed']==0
          assert r['selected_source_count']==7
          assert r['nonselected_source_bytes_retained'] is False
          assert r['cell_json_read'] is False
          assert len(r['rows'])==7
          print('GATE2C6_SOURCE_LOCALIZATION=PASS')
          PY

      - name: Bind Gate2C2a hosted artifact and extract only fourteen selected files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/gate2c2a.zip"; META="$RUNNER_TEMP/gate2c2a-meta.json"; CASES="$RUNNER_TEMP/gate2c6-cases"; VERIFY="$RUNNER_TEMP/E2_GATE2C6_SELECTED_INPUT_VERIFICATION.json"; export ZIP META CASES VERIFY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$GATE2C2A_ARTIFACT_ID" > "$META"
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path(os.environ['META']).read_text())
          assert int(m['id'])==int(os.environ['GATE2C2A_ARTIFACT_ID']) and m.get('expired') is False
          assert m.get('digest')=='sha256:'+os.environ['GATE2C2A_ARTIFACT_DIGEST']
          wr=m.get('workflow_run') or {}; assert str(wr.get('id'))==os.environ['GATE2C2A_RUN_ID']
          print('GATE2C6_HOSTED_ARTIFACT_METADATA=PASS')
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$GATE2C2A_ARTIFACT_ID/zip" > "$ZIP"
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          p=json.loads(Path(os.environ['PROTOCOL']).read_text()); matrix=json.loads(Path(os.environ['MATRIX']).read_text())
          ids=sorted(p['population']['case_ids']); rows={str(r['case_id']):r for r in matrix['cases']}
          fields={'adapter_receipt.json':'adapter_receipt_sha256','semantic_slice.json':'semantic_slice_sha256'}
          root=Path(os.environ['CASES']); root.mkdir(parents=True,exist_ok=True); z=zipfile.ZipFile(os.environ['ZIP']); verified=[]
          for cid in ids:
              row=rows[cid]
              assert row['language']=='python' and row['tentative_kernel_prediction']=='E2_PREDICTED_PRESERVATION_EVIDENCE'
              d=root/cid; d.mkdir()
              for fn,key in fields.items():
                  n1=f'replay1/cases/{cid}/{fn}'; n2=f'replay2/cases/{cid}/{fn}'; b1=z.read(n1); b2=z.read(n2)
                  assert b1==b2,(cid,fn,'replay_mismatch')
                  got=hashlib.sha256(b1).hexdigest(); assert got==row[key],(cid,fn,got,row[key])
                  (d/fn).write_bytes(b1); verified.append({'case_id':cid,'file':fn,'sha256':got})
          assert len(verified)==14
          rec={'schema':'risu.e2-gate2c6-selected-input-verification/v0.1','artifact_id':int(os.environ['GATE2C2A_ARTIFACT_ID']),'artifact_digest_sha256':os.environ['GATE2C2A_ARTIFACT_DIGEST'],'selected_file_count':14,'selected_files':['adapter_receipt.json','semantic_slice.json'],'forbidden_files_extracted':False,'replay1_replay2_byte_identical':True,'all_selected_file_sha256_match_frozen_matrix':True,'verified':verified,'download_zip_sha256_observed_non_authoritative':hashlib.sha256(Path(os.environ['ZIP']).read_bytes()).hexdigest()}
          Path(os.environ['VERIFY']).write_text(json.dumps(rec,sort_keys=True,separators=(',',':'))+'\n')
          print('GATE2C6_SELECTED_INPUT_FILES=14_PASS')
          PY

      - name: Execute first and second frozen tracer derivations
        shell: bash
        run: |
          set -euo pipefail
          python "$TRACER" --protocol "$PROTOCOL" --canonical "$CANONICAL" --sources "$RUNNER_TEMP/gate2c6-sources" --case-artifacts "$RUNNER_TEMP/gate2c6-cases" --output "$RUNNER_TEMP/replay1"
          python "$TRACER" --protocol "$PROTOCOL" --canonical "$CANONICAL" --sources "$RUNNER_TEMP/gate2c6-sources" --case-artifacts "$RUNNER_TEMP/gate2c6-cases" --output "$RUNNER_TEMP/replay2"
          cmp "$RUNNER_TEMP/replay1/E2_GATE2C6_CANDIDATE_PROJECTION_MATCH_LEDGER.json" "$RUNNER_TEMP/replay2/E2_GATE2C6_CANDIDATE_PROJECTION_MATCH_LEDGER.json"
          cmp "$RUNNER_TEMP/replay1/E2_GATE2C6_CANDIDATE_PROJECTION_MATCH_SUMMARY.json" "$RUNNER_TEMP/replay2/E2_GATE2C6_CANDIDATE_PROJECTION_MATCH_SUMMARY.json"
          echo GATE2C6_TRACER_DUAL_REPLAY_BYTE_IDENTITY=PASS

      - name: Execute independent checker twice and require exact agreement
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2; do
            python "$CHECKER" --protocol "$PROTOCOL" --canonical "$CANONICAL" --tracer-ledger "$RUNNER_TEMP/replay1/E2_GATE2C6_CANDIDATE_PROJECTION_MATCH_LEDGER.json" --sources "$RUNNER_TEMP/gate2c6-sources" --case-artifacts "$RUNNER_TEMP/gate2c6-cases" --output "$RUNNER_TEMP/check$n.json"
          done
          cmp "$RUNNER_TEMP/check1.json" "$RUNNER_TEMP/check2.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          c=json.loads(Path(os.environ['RUNNER_TEMP'],'check1.json').read_text())
          assert c['status']=='PASS' and c['role_observation_count']==14
          assert c['all_taxonomy_agree'] is True and c['all_fingerprints_agree'] is True
          print('GATE2C6_INDEPENDENT_CHECKER=PASS')
          PY

      - name: Materialize pre-freeze first-complete package without result interpretation
        shell: bash
        run: |
          set -euo pipefail
          PAY="$RUNNER_TEMP/gate2c6-payload"; export PAY; mkdir -p "$PAY/replay1" "$PAY/replay2"
          cp "$RUNNER_TEMP/E2_GATE2C6_SOURCE_LOCATOR_RECEIPT.json" "$PAY/"
          cp "$RUNNER_TEMP/E2_GATE2C6_SELECTED_INPUT_VERIFICATION.json" "$PAY/"
          cp "$RUNNER_TEMP/replay1/"*.json "$PAY/replay1/"
          cp "$RUNNER_TEMP/replay2/"*.json "$PAY/replay2/"
          cp "$RUNNER_TEMP/check1.json" "$PAY/E2_GATE2C6_INDEPENDENT_CANDIDATE_PROJECTION_CHECK.json"
          cp "$RUNNER_TEMP/check2.json" "$PAY/E2_GATE2C6_INDEPENDENT_CANDIDATE_PROJECTION_CHECK_REPLAY2.json"
          python - <<'PY'
          import hashlib,json,os,platform
          from pathlib import Path
          pay=Path(os.environ['PAY']); h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          diag={'schema':'risu.e2-gate2c6-diagnostic-receipt/v0.1','status':'FIRST_COMPLETE_REAL_DIAGNOSTIC_PRE_FREEZE','workflow_run_id':os.environ['GITHUB_RUN_ID'],'trigger_commit':os.environ['GITHUB_SHA'],'python_version':platform.python_version(),'population_case_count':7,'role_observation_count':14,'source_files_stream_hashed_for_opaque_localization':58,'source_content_cases_analyzed':7,'gate2c2a_selected_files_exposed':14,'gate2c2a_forbidden_files_extracted':False,'tracer_dual_replay_byte_identical':True,'checker_dual_replay_byte_identical':True,'independent_checker_status':'PASS','taxonomy_counts_used_to_modify_result':False,'result_interpreted_before_archive':False,'c1_rerun':False,'semantic_engine_rerun':False,'kernel_rerun':False,'truth_or_mutation_operator_read':False,'epistemic10_read':False,'mutation_algebra_opened':False,'remediation':False,'historical_qualification_attempts':[{'run_id':34170429117,'classification':'SYNTHETIC_OUTPUT_TIMING_NONDETERMINISM','scientific_result_observed':False},{'run_id':34170482219,'classification':'SUCCESSFUL_SYNTHETIC_LOGICAL_QUALIFICATION','scientific_result_observed':False}], 'output_sha256':{'ledger':h(pay/'replay1/E2_GATE2C6_CANDIDATE_PROJECTION_MATCH_LEDGER.json'),'summary':h(pay/'replay1/E2_GATE2C6_CANDIDATE_PROJECTION_MATCH_SUMMARY.json'),'checker':h(pay/'E2_GATE2C6_INDEPENDENT_CANDIDATE_PROJECTION_CHECK.json'),'locator':h(pay/'E2_GATE2C6_SOURCE_LOCATOR_RECEIPT.json'),'selected_input_verification':h(pay/'E2_GATE2C6_SELECTED_INPUT_VERIFICATION.json')}}
          (pay/'E2_GATE2C6_DIAGNOSTIC_RECEIPT.json').write_text(json.dumps(diag,sort_keys=True,separators=(',',':'))+'\n')
          real={'schema':'risu.e2-gate2c6-first-real-execution-receipt/v0.1','status':'FIRST_COMPLETE_REAL_DUAL_DERIVATION_AND_CHECK_READY_FOR_ARCHIVE','workflow_run_id':os.environ['GITHUB_RUN_ID'],'trigger_commit':os.environ['GITHUB_SHA'],'population_case_count':7,'role_observation_count':14,'tracer_replays':2,'checker_replays':2,'logical_byte_identity':True,'independent_checker_status':'PASS','artifact_upload_required_before_repository_freeze':True,'result_interpreted':False,'c1_rerun':False,'truth_read':False,'epistemic10_read':False,'mutation_algebra_opened':False,'remediation':False}
          (pay/'E2_GATE2C6_FIRST_REAL_EXECUTION_RECEIPT.json').write_text(json.dumps(real,sort_keys=True,separators=(',',':'))+'\n')
          tree={'schema':'risu.e2-gate2c6-logical-tree/v0.1','files':{'E2_GATE2C6_CANDIDATE_PROJECTION_MATCH_LEDGER.json':h(pay/'replay1/E2_GATE2C6_CANDIDATE_PROJECTION_MATCH_LEDGER.json'),'E2_GATE2C6_CANDIDATE_PROJECTION_MATCH_SUMMARY.json':h(pay/'replay1/E2_GATE2C6_CANDIDATE_PROJECTION_MATCH_SUMMARY.json'),'E2_GATE2C6_INDEPENDENT_CANDIDATE_PROJECTION_CHECK.json':h(pay/'E2_GATE2C6_INDEPENDENT_CANDIDATE_PROJECTION_CHECK.json'),'E2_GATE2C6_SOURCE_LOCATOR_RECEIPT.json':h(pay/'E2_GATE2C6_SOURCE_LOCATOR_RECEIPT.json'),'E2_GATE2C6_SELECTED_INPUT_VERIFICATION.json':h(pay/'E2_GATE2C6_SELECTED_INPUT_VERIFICATION.json'),'E2_GATE2C6_DIAGNOSTIC_RECEIPT.json':h(pay/'E2_GATE2C6_DIAGNOSTIC_RECEIPT.json'),'E2_GATE2C6_FIRST_REAL_EXECUTION_RECEIPT.json':h(pay/'E2_GATE2C6_FIRST_REAL_EXECUTION_RECEIPT.json')}}
          (pay/'E2_GATE2C6_LOGICAL_TREE.json').write_text(json.dumps(tree,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Upload exact first-complete package before repository freeze
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-gate2c6-first-complete
          path: ${{ runner.temp }}/gate2c6-payload
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Materialize exact nine-file immutable repository payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ART=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="e2-gate2c6-first-complete") | [.id,.digest] | @tsv')
          test "$(printf '%s\n' "$ART" | wc -l)" -eq 1
          ART_ID=$(printf '%s' "$ART" | cut -f1); ART_DIGEST=$(printf '%s' "$ART" | cut -f2 | sed 's/^sha256://'); test -n "$ART_ID"; test "${#ART_DIGEST}" -eq 64
          test ! -e "$RESULT_DIR"; mkdir -p "$RESULT_DIR"
          cp "$RUNNER_TEMP/gate2c6-payload/E2_GATE2C6_SOURCE_LOCATOR_RECEIPT.json" "$RESULT_DIR/"
          cp "$RUNNER_TEMP/gate2c6-payload/E2_GATE2C6_SELECTED_INPUT_VERIFICATION.json" "$RESULT_DIR/"
          cp "$RUNNER_TEMP/gate2c6-payload/replay1/E2_GATE2C6_CANDIDATE_PROJECTION_MATCH_LEDGER.json" "$RESULT_DIR/"
          cp "$RUNNER_TEMP/gate2c6-payload/replay1/E2_GATE2C6_CANDIDATE_PROJECTION_MATCH_SUMMARY.json" "$RESULT_DIR/"
          cp "$RUNNER_TEMP/gate2c6-payload/E2_GATE2C6_INDEPENDENT_CANDIDATE_PROJECTION_CHECK.json" "$RESULT_DIR/"
          cp "$RUNNER_TEMP/gate2c6-payload/E2_GATE2C6_DIAGNOSTIC_RECEIPT.json" "$RESULT_DIR/"
          cp "$RUNNER_TEMP/gate2c6-payload/E2_GATE2C6_FIRST_REAL_EXECUTION_RECEIPT.json" "$RESULT_DIR/"
          cp "$RUNNER_TEMP/gate2c6-payload/E2_GATE2C6_LOGICAL_TREE.json" "$RESULT_DIR/"
          export ART_ID ART_DIGEST
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RESULT_DIR']); h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          files={p.name:h(p) for p in sorted(root.glob('*.json'))}
          freeze={'schema':'risu.e2-gate2c6-first-complete-immutable-freeze/v0.1','status':'FIRST_COMPLETE_GATE2C6_CANDIDATE_OPAQUE_PROJECTION_MATCH_IMMUTABLY_FROZEN_BY_CONTAINING_COMMIT','repository':'risu-research/risu-verify','branch':'e2-development','trigger_commit':os.environ['GITHUB_SHA'],'workflow_run_id':os.environ['GITHUB_RUN_ID'],'hosted_artifact':{'id':int(os.environ['ART_ID']),'name':'e2-gate2c6-first-complete','digest_sha256':os.environ['ART_DIGEST'],'uploaded_before_repository_freeze':True},'execution':{'population_case_count':7,'role_observation_count':14,'source_files_stream_hashed_for_locator':58,'source_content_cases_analyzed':7,'selected_gate2c2a_files_verified':14,'tracer_dual_replay_byte_identical':True,'checker_dual_replay_byte_identical':True,'independent_checker_status':'PASS','first_complete_result_may_not_be_replaced':True},'scientific_firewall':{'c1_rerun':False,'semantic_engine_rerun':False,'kernel_rerun':False,'truth_or_mutation_operator_read':False,'epistemic10_read':False,'mutation_algebra_opened':False,'fresh_target_read':False,'remediation':False,'c1_repair_soundness_inferred':False},'interpretation_boundary':{'result_interpreted_before_remote_freeze':False,'taxonomy_counts_used_to_modify_result':False,'repair_authorization_may_only_follow_postfreeze_read':True},'frozen_files_sha256':files}
          (root/'E2_GATE2C6_FIRST_COMPLETE_IMMUTABLE_FREEZE_RECEIPT.json').write_text(json.dumps(freeze,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Commit and fast-forward push exact nine-file first-complete freeze
        shell: bash
        run: |
          set -euo pipefail
          git add "$RESULT_DIR"
          mapfile -t files < <(git diff --cached --name-only); test "${#files[@]}" -eq 9
          for f in "${files[@]}"; do case "$f" in "$RESULT_DIR"/*);;*) echo "unexpected staged file:$f"; exit 1;; esac; done
          test "$(git diff --cached --name-status | awk '$1!="A"{n++} END{print n+0}')" -eq 0
          test "$(git ls-remote origin refs/heads/e2-development | cut -f1)" = "$GITHUB_SHA"
          git config user.name "RISU Evidence Freeze"; git config user.email "risu-evidence-freeze@users.noreply.github.com"
          git commit -m "Freeze first complete Gate2C6 candidate opaque projection match"
          git push origin HEAD:e2-development

      - name: Post-push exact remote verification
        shell: bash
        run: |
          set -euo pipefail
          LOCAL=$(git rev-parse HEAD); REMOTE=$(git ls-remote origin refs/heads/e2-development | cut -f1); test "$LOCAL" = "$REMOTE"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          mapfile -t files < <(git diff --name-only HEAD^ HEAD); test "${#files[@]}" -eq 9
          for f in "${files[@]}"; do case "$f" in "$RESULT_DIR"/*);;*) exit 1;; esac; done
          echo GATE2C6_FIRST_COMPLETE_REMOTE_FREEZE=PASS
