name: Unit004 gold finite CTV primary

on:
  push:
    branches: [unit004-blind-e1]
    paths:
      - 'experiments/unit004-blind-e1/PRIMARY_VALIDATOR_FREEZE.json'
      - 'tools/ctv_finite_primary.py'
      - 'tools/ctv_finite_independent.py'
      - 'tests/test_ctv_finite_primary.py'
      - '.github/workflows/unit004-gold-primary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-frozen-validator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pre-primary validator freeze and normative inputs
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          freeze = json.loads(Path('experiments/unit004-blind-e1/PRIMARY_VALIDATOR_FREEZE.json').read_text())
          author = json.loads(Path('experiments/unit004-blind-e1/AUTHOR_ACCEPTANCE.json').read_text())

          assert freeze['status'] == 'VALIDATOR_IMPLEMENTATION_FROZEN_BEFORE_PRIMARY_EXECUTION'
          assert author['status'] == 'AUTHOR_ACCEPTED_BEFORE_PRIMARY_GOLD_VALIDATION'
          assert freeze['parent_author_acceptance_commit'] == '6665edda22abfb6233ebbba0792829fbc7467f35'
          assert subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip() == freeze['parent_author_acceptance_commit']

          for path, expected in freeze['validator_git_blobs'].items():
              actual = subprocess.check_output(['git','rev-parse',f'HEAD:{path}'], text=True).strip()
              assert actual == expected, (path, actual, expected)

          for name, expected in author['accepted_normative_git_blobs'].items():
              path = 'experiments/unit004-blind-e1/' + name
              actual = subprocess.check_output(['git','rev-parse',f'HEAD:{path}'], text=True).strip()
              assert actual == expected, (path, actual, expected)

          assert author['acceptance']['all_primary_outcomes_equally_admissible'] is True
          assert author['acceptance']['expected_primary_outcome_recorded'] is False
          assert freeze['primary_result_observed_before_freeze'] is False
          assert freeze['synthetic_tests_only_before_primary'] is True

          print(json.dumps({
              'status':'PASS',
              'parent_author_acceptance_commit':freeze['parent_author_acceptance_commit'],
              'validator_components':len(freeze['validator_git_blobs']),
              'normative_inputs':len(author['accepted_normative_git_blobs']),
          }, sort_keys=True))
          PY

      - name: Verify frozen CTV meta-theory
        run: python tools/ctv_meta_theory_verify.py

      - name: Qualify generic finite checker on synthetic cases only
        run: |
          python -m py_compile tools/ctv_finite_primary.py tools/ctv_finite_independent.py tests/test_ctv_finite_primary.py
          python -m unittest -v tests.test_ctv_finite_primary
          if grep -Eqi 'ofershap|mcp-server-s3|delete_object|f16b3715|If-Match|@aws-sdk|UNIT004' \
              tools/ctv_finite_primary.py tools/ctv_finite_independent.py tests/test_ctv_finite_primary.py; then
            echo 'Target-specific identifier found in generic finite checker or synthetic tests' >&2
            exit 1
          fi

  execute-first-gold-primary:
    needs: qualify-frozen-validator
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute generic finite CTV primary
        run: |
          mkdir -p unit004-gold-primary
          python tools/ctv_finite_primary.py \
            --author-acceptance experiments/unit004-blind-e1/AUTHOR_ACCEPTANCE.json \
            --boundary experiments/unit004-blind-e1/BOUNDARY_MODEL.json \
            --source-lane experiments/unit004-blind-e1/SOURCE_LANE.json \
            --target-lane experiments/unit004-blind-e1/TARGET_LANE.json \
            --output unit004-gold-primary/PRIMARY_GOLD_RESULT.json \
            > unit004-gold-primary/PRIMARY_STDOUT.json

      - name: Independent stdlib-only recomputation
        run: |
          python tools/ctv_finite_independent.py \
            --author-acceptance experiments/unit004-blind-e1/AUTHOR_ACCEPTANCE.json \
            --boundary experiments/unit004-blind-e1/BOUNDARY_MODEL.json \
            --source-lane experiments/unit004-blind-e1/SOURCE_LANE.json \
            --target-lane experiments/unit004-blind-e1/TARGET_LANE.json \
            --primary-result unit004-gold-primary/PRIMARY_GOLD_RESULT.json \
            --output unit004-gold-primary/INDEPENDENT_WITNESS_CHECK.json \
            > unit004-gold-primary/INDEPENDENT_STDOUT.json

      - name: Build self-contained first-primary archive
        run: |
          cp experiments/unit004-blind-e1/AUTHOR_ACCEPTANCE.json unit004-gold-primary/
          cp experiments/unit004-blind-e1/BOUNDARY_MODEL.json unit004-gold-primary/
          cp experiments/unit004-blind-e1/SOURCE_LANE.json unit004-gold-primary/
          cp experiments/unit004-blind-e1/TARGET_LANE.json unit004-gold-primary/
          cp experiments/unit004-blind-e1/GOLD_EVIDENCE.json unit004-gold-primary/
          cp experiments/unit004-blind-e1/GOLD_MODEL_FREEZE.json unit004-gold-primary/
          cp experiments/unit004-blind-e1/SCIENTIFIC_ADJUDICATION_PROTOCOL.json unit004-gold-primary/
          cp experiments/unit004-blind-e1/PRIMARY_VALIDATOR_FREEZE.json unit004-gold-primary/
          cp protocols/CTV_META_THEORY_v0.1.json unit004-gold-primary/
          cp protocols/CTV_META_THEORY_v0.1_SEAL.json unit004-gold-primary/
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path('unit004-gold-primary')
          result = json.loads((root/'PRIMARY_GOLD_RESULT.json').read_text())
          check = json.loads((root/'INDEPENDENT_WITNESS_CHECK.json').read_text())
          assert result['status'] == 'VALID_SEMANTIC_OUTCOME'
          assert result['verdict'] in {
              'CONSEQUENCE_STABLE_IN_DECLARED_SCOPE',
              'CONSEQUENCE_REGRESSION',
              'ASSURANCE_INCOMPLETE',
          }
          assert check['status'] == 'PASS'
          assert check['agreement'] is True

          run_record = {
              'schema':'risu.unit004-gold-primary-run/v0.1alpha1',
              'status':'FIRST_VALID_GOLD_PRIMARY_COMPLETED',
              'github_run_id':os.environ['GITHUB_RUN_ID'],
              'github_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'execution_commit':os.environ['GITHUB_SHA'],
              'semantic_outcome_not_mapped_to_ci_failure':True,
              'primary_result_sha256':hashlib.sha256((root/'PRIMARY_GOLD_RESULT.json').read_bytes()).hexdigest(),
              'independent_check_sha256':hashlib.sha256((root/'INDEPENDENT_WITNESS_CHECK.json').read_bytes()).hexdigest(),
              'prediction_value_not_required_for_archive_identity':True,
          }
          (root/'PRIMARY_RUN_RECORD.json').write_text(json.dumps(run_record,indent=2,sort_keys=True)+'\n')

          entries = []
          for p in sorted(x for x in root.iterdir() if x.is_file() and x.name != 'ARCHIVE_MANIFEST.json'):
              b=p.read_bytes()
              entries.append({'path':p.name,'size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          manifest = {
              'schema':'risu.unit004-gold-primary-archive/v0.1alpha1',
              'status':'SEALED_FIRST_PRIMARY_ARCHIVE',
              'execution_commit':os.environ['GITHUB_SHA'],
              'entry_count':len(entries),
              'entries':entries,
          }
          (root/'ARCHIVE_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'status':'ARCHIVE_READY',
              'entry_count':len(entries),
              'result_sha256':run_record['primary_result_sha256'],
              'independent_sha256':run_record['independent_check_sha256'],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: unit004-gold-first-primary-${{ github.sha }}-${{ github.run_id }}
          path: unit004-gold-primary/
          if-no-files-found: error
          retention-days: 90
