name: OPS Build Selected48 Adapter V2

on:
  push:
    branches:
      - ops/build-selected48-adapter-v2
    paths:
      - .github/workflows/ops-build-selected48-adapter-v2.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Deterministically patch exact frozen adapters and atomically commit v2 pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, py_compile, urllib.request

          REPO='risu-research/risu-verify'
          TARGET='e2-development'
          PARENT='5db59d8bf0f033af818acb9d4516a3912ab2ce90'
          OLD_PRIMARY='56ad7ec667f59f962585c6d5ed81b5dc98a363e2'
          OLD_INDEPENDENT='8a68cd1b80e2abeac68a3ca7aed6ab7cfc28c105'
          OUT_PRIMARY='tools/e2_frozen48_requalification_primary_v2.py'
          OUT_INDEPENDENT='tools/e2_frozen48_requalification_independent_v2.py'
          token=os.environ['GH_TOKEN']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'risu-selected48-adapter-v2-builder'}

          def api(path,method='GET',payload=None):
            data=None if payload is None else json.dumps(payload,separators=(',',':')).encode()
            h=dict(headers)
            if data is not None: h['Content-Type']='application/json'
            req=urllib.request.Request('https://api.github.com/repos/'+REPO+path,data=data,method=method,headers=h)
            with urllib.request.urlopen(req,timeout=60) as r:
              raw=r.read(); return json.loads(raw) if raw else None

          def blob_text(sha):
            obj=api('/git/blobs/'+sha)
            if obj.get('encoding')!='base64': raise SystemExit('BLOB_ENCODING_MISMATCH')
            return base64.b64decode(obj['content']).decode('utf-8')

          def replace_once(text,old,new,label):
            count=text.count(old)
            if count!=1: raise SystemExit(f'PATCH_MATCH_COUNT:{label}:{count}')
            return text.replace(old,new,1)

          primary=blob_text(OLD_PRIMARY)
          independent=blob_text(OLD_INDEPENDENT)

          primary=replace_once(primary,
