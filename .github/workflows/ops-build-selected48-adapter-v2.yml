          forbidden=('expected_truth','expected_e2','operator_id','operator_name','operator_class','M_PLUS','M_ZERO','M_QUESTION')
          for label,text in [('primary',primary),('independent',independent)]:
            for token in forbidden:
              if token in text: raise SystemExit(f'FORBIDDEN_SPECIALIZATION_TOKEN:{label}:{token}')

          root=pathlib.Path('/tmp/adapter-v2'); root.mkdir(parents=True,exist_ok=True)
          p=root/'primary_v2.py'; i=root/'independent_v2.py'; p.write_text(primary); i.write_text(independent)
          py_compile.compile(str(p),doraise=True); py_compile.compile(str(i),doraise=True)

          branch=api('/branches/'+TARGET)
          if branch['commit']['sha']!=PARENT: raise SystemExit('TARGET_HEAD_MOVED')
          base_tree=branch['commit']['commit']['tree']['sha']
          p_blob=api('/git/blobs','POST',{'content':base64.b64encode(primary.encode()).decode(),'encoding':'base64'})['sha']
          i_blob=api('/git/blobs','POST',{'content':base64.b64encode(independent.encode()).decode(),'encoding':'base64'})['sha']
          tree=api('/git/trees','POST',{'base_tree':base_tree,'tree':[
            {'path':OUT_PRIMARY,'mode':'100644','type':'blob','sha':p_blob},
            {'path':OUT_INDEPENDENT,'mode':'100644','type':'blob','sha':i_blob}
          ]})['sha']
          commit=api('/git/commits','POST',{'message':'e2: add fail-closed selected-48 adapter v2 pair','tree':tree,'parents':[PARENT]})['sha']
          api('/git/refs/heads/'+TARGET,'PATCH',{'sha':commit,'force':False})
          print(json.dumps({'status':'COMMITTED','commit':commit,'primary_blob':p_blob,'independent_blob':i_blob},sort_keys=True,separators=(',',':')))
