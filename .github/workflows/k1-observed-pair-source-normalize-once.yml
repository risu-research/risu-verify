name: K1 Observed Pair Source Normalize Once

on:
  push:
    branches:
      - k1-observed-pair-p1
    paths:
      - '.github/workflows/k1-observed-pair-source-normalize-once.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: k1-observed-pair-p1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Normalize prospective sources only
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/risu_kernel_k1_observed_pair_p1_verify.py')
          s = p.read_text(encoding='utf-8')
          old = '["github.com/", "golang.org/", "os/exec", "python", "k1_checker_w1", "k1_checker_w2"]'
          new = '["github.com/", "golang.org/", "os/exec", "k1_checker_w1", "k1_checker_w2"]'
          if old not in s:
              raise SystemExit('expected independence marker line not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          gofmt -w kernel/k1_checker_w4.go
          gofmt -d kernel/k1_checker_w4.go | tee /tmp/p1-gofmt.diff
          test ! -s /tmp/p1-gofmt.diff
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kernel/k1_checker_w4.go tools/risu_kernel_k1_observed_pair_p1_verify.py
          git diff --cached --quiet && exit 0
          git commit -m 'Canonicalize P1 checker sources'
          git push origin HEAD:k1-observed-pair-p1
