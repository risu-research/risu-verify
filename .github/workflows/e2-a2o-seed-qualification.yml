name: E2 A2O Seed Qualification

on:
  push:
    branches:
      - e2-development
    paths:
      - "risu_e2/overlay_common.py"
      - "risu_e2/overlay_control.py"
      - "risu_e2/overlay_source.py"
      - "risu_e2/observability_overlay.py"
      - "tools/e2_a2o_seed_qualify.py"
      - "schemas/RISU_E2_OBSERVABILITY_OVERLAY_v0.1.schema.json"
      - "protocols/RISU_DIFF_E2_A2O_SEED_ONLY_QUALIFICATION_CONTRACT_v0.1.json"
      - ".github/workflows/e2-a2o-seed-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.2"

      - name: Compile frozen implementation surface
        run: |
          set -euo pipefail
          python -m py_compile \
            risu_e2/overlay_common.py \
            risu_e2/overlay_control.py \
            risu_e2/overlay_source.py \
            risu_e2/observability_overlay.py \
            tools/e2_a2o_seed_qualify.py
          python -m json.tool schemas/RISU_E2_OBSERVABILITY_OVERLAY_v0.1.schema.json >/dev/null
          python -m json.tool protocols/RISU_DIFF_E2_A2O_SEED_ONLY_QUALIFICATION_CONTRACT_v0.1.json >/dev/null
          test "$(git hash-object risu_e2/model.py)" = "64baf95a4939f168881627830134b314a6ee6098"
          test "$(git hash-object risu_e2/ir.py)" = "d7edac40d4eeda86be74e5785bde3bfc28d4cf5e"

      - name: Run seed-only qualification twice
        run: |
          set -euo pipefail
          mkdir -p attempt1 attempt2
          python tools/e2_a2o_seed_qualify.py \
            --overlay-output attempt1/E2_A2O_SEED_OVERLAY_BUNDLE.json \
            --receipt-output attempt1/E2_A2O_SEED_QUALIFICATION_RECEIPT.json \
            | tee attempt1/summary.json
          python tools/e2_a2o_seed_qualify.py \
            --overlay-output attempt2/E2_A2O_SEED_OVERLAY_BUNDLE.json \
            --receipt-output attempt2/E2_A2O_SEED_QUALIFICATION_RECEIPT.json \
            | tee attempt2/summary.json
          cmp attempt1/E2_A2O_SEED_OVERLAY_BUNDLE.json attempt2/E2_A2O_SEED_OVERLAY_BUNDLE.json
          cmp attempt1/E2_A2O_SEED_QUALIFICATION_RECEIPT.json attempt2/E2_A2O_SEED_QUALIFICATION_RECEIPT.json
          cp attempt1/E2_A2O_SEED_OVERLAY_BUNDLE.json E2_A2O_SEED_OVERLAY_BUNDLE.json
          cp attempt1/E2_A2O_SEED_QUALIFICATION_RECEIPT.json E2_A2O_SEED_QUALIFICATION_RECEIPT.json
          sha256sum E2_A2O_SEED_OVERLAY_BUNDLE.json E2_A2O_SEED_QUALIFICATION_RECEIPT.json

      - name: Assert pre-registered qualification gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("E2_A2O_SEED_QUALIFICATION_RECEIPT.json").read_text(encoding="utf-8"))
          assert r["status"] == "PASS"
          assert r["seed_count"] == 6
          assert all(r["qualification_gates"].values())
          rs=r["read_set"]
          assert rs["materialized_mutant_cell_paths_read"] is False
          assert rs["mutation_truth_read"] is False
          assert rs["expected_e2_predictions_read"] is False
          assert rs["mutation_operator_metadata_read"] is False
          assert rs["fresh_target_bytes_read"] is False
          assert rs["comments_or_docstrings_used_as_semantic_features"] is False
          assert rs["target_or_repository_names_used_as_semantic_features"] is False
          assert r["mutant_anchor_transport_authorized"] is False
          assert r["a3_a4_verdict_logic_authorized"] is False
          assert r["fresh_target_selection_authorized"] is False
          for row in r["rows"]:
              assert not row["errors"]
              assert all(x["status"] == "COMPLETE" for x in row["control_scopes"])
              assert row["binding_slot_value_counts"]["current_coordinate"] == 1
              assert row["binding_slot_value_counts"]["expected_coordinate"] == 1
          PY

      - name: Upload seed-only qualification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-a2o-seed-qualification
          path: |
            E2_A2O_SEED_OVERLAY_BUNDLE.json
            E2_A2O_SEED_QUALIFICATION_RECEIPT.json
            attempt1/E2_A2O_SEED_OVERLAY_BUNDLE.json
            attempt1/E2_A2O_SEED_QUALIFICATION_RECEIPT.json
            attempt2/E2_A2O_SEED_OVERLAY_BUNDLE.json
            attempt2/E2_A2O_SEED_QUALIFICATION_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
