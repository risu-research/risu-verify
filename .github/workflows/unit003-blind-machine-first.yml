name: RISU Unit003 blind machine-first E0 exam

on:
  push:
    branches:
      - unit003-blind-machine-first
    paths:
      - tools/unit003_blind_acquire.py
      - tests/test_unit003_blind_acquire.py
      - experiments/unit003-blind-machine-first/**
      - .github/workflows/unit003-blind-machine-first.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  TARGET_REVISION: 04f459470f58642063b0374361bee0011278f6d8

jobs:
  select-tree-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact frozen E0 bytes post-freeze
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('.')
          q = json.loads((root / 'experiments/risu-diff-e0/MACHINE_FIRST_FREEZE_QUALIFICATION.json').read_text())
          actual = {}
          for path, expected in sorted(q['engine_identity_components'].items()):
              git_bytes = subprocess.check_output(['git','show',f'HEAD:{path}'])
              work_bytes = (root/path).read_bytes()
              gs = hashlib.sha256(git_bytes).hexdigest()
              ws = hashlib.sha256(work_bytes).hexdigest()
              assert gs == expected == ws, (path, expected, gs, ws)
              actual[path] = gs
          canonical = (json.dumps(actual, sort_keys=True, separators=(',', ':'), ensure_ascii=False) + '\n').encode()
          digest = hashlib.sha256(canonical).hexdigest()
          assert digest == q['engine_identity_digest'] == '7979ff811765cf1617602b2ef9ed89935f24da2c1f32eceb417dfd209e335c60'
          subprocess.check_call(['git','merge-base','--is-ancestor','2e423a86339daa031f4b98f79f288b82e5ce621b','HEAD'])
          print(json.dumps({'status':'PASS','engine_components_verified':len(actual),'engine_identity_digest':digest}, sort_keys=True))
          PY

      - name: Verify Unit003 prospective lineage and Correction 004
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('.')
          freeze = json.loads((root/'experiments/unit003-blind-machine-first/RUN_FREEZE.json').read_text())
          c1 = json.loads((root/'experiments/unit003-blind-machine-first/RUN_FREEZE_CORRECTION_001.json').read_text())
          c2 = json.loads((root/'experiments/unit003-blind-machine-first/RUN_FREEZE_CORRECTION_002.json').read_text())
          c3 = json.loads((root/'experiments/unit003-blind-machine-first/RUN_FREEZE_CORRECTION_003.json').read_text())
          c4 = json.loads((root/'experiments/unit003-blind-machine-first/RUN_FREEZE_CORRECTION_004.json').read_text())
          attempts = json.loads((root/'experiments/unit003-blind-machine-first/EXECUTION_ATTEMPTS.json').read_text())
          assert freeze['status'] == 'FROZEN_BEFORE_SELECTED_SCREENED_OPERATION_CONTENT_ACQUISITION'
          assert c1['status'] == 'PRE_CONTENT_HARNESS_CORRECTION_001'
          assert c2['status'] == 'PRE_CONTENT_BYTE_IDENTITY_CORRECTION_002'
          assert c3['status'] == 'POST_ACQUISITION_PRE_E0_INVOCATION_CORRECTION_003'
          assert c4['status'] == 'SELECTION_IDENTITY_GUARD_CORRECTION_004'
          assert c1['scientific_or_scoring_change'] is False
          assert c2['scientific_or_scoring_change'] is False
          assert c3['scientific_or_scoring_change'] is False
          assert c4['scientific_or_scoring_change'] is False
          assert len(attempts['attempts']) == 4
          assert all(a['first_seal_created'] is False for a in attempts['attempts'])
          assert all(a['scientific_prediction'] is None for a in attempts['attempts'])
          assert attempts['attempts'][2]['selection_sha256'] == c3['attempt_003']['selection_sha256']
          assert attempts['attempts'][2]['machine_input_sha256'] == c3['attempt_003']['machine_input_sha256']
          assert c3['immutability']['engine_identity_changed'] is False
          assert c3['immutability']['selection_policy_changed'] is False
          assert c3['immutability']['acquisition_runner_changed'] is False
          assert c3['immutability']['prediction_logic_changed'] is False
          assert c3['immutability']['target_revision_changed'] is False

          for rel, row in sorted(c2['authoritative_harness_identities'].items()):
              if rel == '.github/workflows/unit003-blind-machine-first.yml':
                  assert row['git_blob_sha'] == c3['superseded_workflow_git_blob_sha']
                  continue
              blob = subprocess.check_output(['git','rev-parse',f'HEAD:{rel}'], text=True).strip()
              git_bytes = subprocess.check_output(['git','show',f'HEAD:{rel}'])
              work_bytes = (root/rel).read_bytes()
              gs = hashlib.sha256(git_bytes).hexdigest()
              ws = hashlib.sha256(work_bytes).hexdigest()
              assert blob == row['git_blob_sha'], (rel, row['git_blob_sha'], blob)
              assert gs == row['sha256'] == ws, (rel, row['sha256'], gs, ws)

          wf = '.github/workflows/unit003-blind-machine-first.yml'
          assert c3['corrected_workflow_git_blob_sha'] == c4['superseded_workflow_git_blob_sha']
          wf_blob = subprocess.check_output(['git','rev-parse',f'HEAD:{wf}'], text=True).strip()
          assert wf_blob == c4['corrected_workflow_git_blob_sha'], (wf_blob, c4['corrected_workflow_git_blob_sha'])

          protocol_blobs = {
              'experiments/unit003-blind-machine-first/EXAM_PROTOCOL.json':'7825386feb717047eae5c67e2aabac626243b989',
              'experiments/unit003-blind-machine-first/EXAM_PROTOCOL_EFFECTIVE_001.json':'95a72c1857fe797be11d4f5a21d23156a69711d4',
              'experiments/unit003-blind-machine-first/EXAM_PROTOCOL_CORRECTION_001.json':'90bb97f4ca37461398eb8f00cd479756ae2d10e9',
              'experiments/unit003-blind-machine-first/RUN_FREEZE.json':'6c030b7619f77d0dbb5bcf52d0737f407bdfb325',
          }
          for rel, expected in protocol_blobs.items():
              actual = subprocess.check_output(['git','rev-parse',f'HEAD:{rel}'], text=True).strip()
              assert actual == expected, (rel, expected, actual)

          changed = subprocess.check_output(['git','diff','--name-only','2e423a86339daa031f4b98f79f288b82e5ce621b..HEAD'], text=True).splitlines()
          allow_prefix = 'experiments/unit003-blind-machine-first/'
          allow_exact = {'tools/unit003_blind_acquire.py','tests/test_unit003_blind_acquire.py','.github/workflows/unit003-blind-machine-first.yml'}
          unexpected = [p for p in changed if not p.startswith(allow_prefix) and p not in allow_exact]
          assert not unexpected, unexpected
          print(json.dumps({'status':'PASS','correction_004':c4['correction_id'],'attempts_retained':len(attempts['attempts']),'unexpected_changed_paths':unexpected}, sort_keys=True))
          PY

      - name: Syntax and synthetic acquisition qualification
        run: |
          python -m py_compile tools/unit003_blind_acquire.py tests/test_unit003_blind_acquire.py
          python -m unittest -v tests.test_unit003_blind_acquire

      - name: Fetch exact target commit/tree with blob filter
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/unit003-target"
          mkdir -p "$TARGET"
          git -C "$TARGET" init
          git -C "$TARGET" remote add origin https://github.com/kubernetes/kubectl.git
          git -C "$TARGET" -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$TARGET_REVISION"
          test "$(git -C "$TARGET" rev-parse FETCH_HEAD)" = "$TARGET_REVISION"
          git -C "$TARGET" update-ref refs/unit003/target "$TARGET_REVISION"
          test "$(git -C "$TARGET" rev-parse "${TARGET_REVISION}^{tree}")" = "d1eb526feea2a1815554db775a343d751f4892b1"

      - name: Freeze round-0 selection from tree metadata only
        run: |
          mkdir -p "$RUNNER_TEMP/unit003-selection"
          python tools/unit003_blind_acquire.py select \
            --repo-dir "$RUNNER_TEMP/unit003-target" \
            --out "$RUNNER_TEMP/unit003-selection/ROUND0_SELECTION.json"

      - name: Require exact semantic replay of Attempt 3 machine-frozen selection
        run: |
          python tools/unit003_blind_acquire.py verify-selection \
            --selection "$RUNNER_TEMP/unit003-selection/ROUND0_SELECTION.json"
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP'])/'unit003-selection/ROUND0_SELECTION.json'
          m = json.loads(p.read_text())
          assert m['selection_sha256'] == '912bc1241519e95fe2e3a3aa02267c2bf4a5e2e3377dd31a963fc0757e40d74b'
          print('SEMANTIC_SELECTION_IDENTITY_PASS')
          PY

      - name: Upload immutable tree-only selection
        uses: actions/upload-artifact@v4
        with:
          name: unit003-round0-selection-${{ github.sha }}
          path: ${{ runner.temp }}/unit003-selection/ROUND0_SELECTION.json
          if-no-files-found: error
          retention-days: 90

  execute-first-seal:
    needs: select-tree-only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reverify frozen E0 engine identity
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('.')
          q = json.loads((root/'experiments/risu-diff-e0/MACHINE_FIRST_FREEZE_QUALIFICATION.json').read_text())
          actual = {}
          for path, expected in sorted(q['engine_identity_components'].items()):
              b = subprocess.check_output(['git','show',f'HEAD:{path}'])
              h = hashlib.sha256(b).hexdigest()
              assert h == expected == hashlib.sha256((root/path).read_bytes()).hexdigest()
              actual[path] = h
          digest = hashlib.sha256((json.dumps(actual, sort_keys=True, separators=(',', ':'), ensure_ascii=False)+'\n').encode()).hexdigest()
          assert digest == '7979ff811765cf1617602b2ef9ed89935f24da2c1f32eceb417dfd209e335c60'
          print(json.dumps({'status':'PASS','engine_components_verified':len(actual),'engine_identity_digest':digest}, sort_keys=True))
          PY
          python -m unittest -v tests.test_unit003_blind_acquire

      - name: Download tree-only selection
        uses: actions/download-artifact@v4
        with:
          name: unit003-round0-selection-${{ github.sha }}
          path: ${{ runner.temp }}/unit003-first-seal

      - name: Verify immutable semantic selection before selected content fetch
        run: |
          python tools/unit003_blind_acquire.py verify-selection \
            --selection "$RUNNER_TEMP/unit003-first-seal/ROUND0_SELECTION.json"
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP'])/'unit003-first-seal/ROUND0_SELECTION.json'
          m = json.loads(p.read_text())
          assert m['selection_sha256'] == '912bc1241519e95fe2e3a3aa02267c2bf4a5e2e3377dd31a963fc0757e40d74b'
          print('SEMANTIC_SELECTION_IDENTITY_PASS')
          PY

      - name: Fetch selected exact-revision bytes and close packet
        run: |
          python tools/unit003_blind_acquire.py acquire \
            --selection "$RUNNER_TEMP/unit003-first-seal/ROUND0_SELECTION.json" \
            --packet-dir "$RUNNER_TEMP/unit003-first-seal/PACKET" \
            --run-id "unit003-e0-r0-${GITHUB_SHA}"

      - name: Run frozen E0 and emit first semantic seal
        run: |
          python -m tools.risu_e0_machine_first \
            "$RUNNER_TEMP/unit003-first-seal/PACKET" \
            "$RUNNER_TEMP/unit003-first-seal/E0" \
            --no-observation

      - name: Bind first seal without logging prediction value
        run: |
          python tools/unit003_blind_acquire.py record \
            --selection "$RUNNER_TEMP/unit003-first-seal/ROUND0_SELECTION.json" \
            --packet-dir "$RUNNER_TEMP/unit003-first-seal/PACKET" \
            --output-dir "$RUNNER_TEMP/unit003-first-seal/E0" \
            --out "$RUNNER_TEMP/unit003-first-seal/FIRST_SEAL_RECORD.json"
          cp experiments/unit003-blind-machine-first/EXAM_PROTOCOL_EFFECTIVE_001.json "$RUNNER_TEMP/unit003-first-seal/"
          cp experiments/unit003-blind-machine-first/EXAM_PROTOCOL_CORRECTION_001.json "$RUNNER_TEMP/unit003-first-seal/"
          cp experiments/unit003-blind-machine-first/RUN_FREEZE.json "$RUNNER_TEMP/unit003-first-seal/"
          cp experiments/unit003-blind-machine-first/RUN_FREEZE_CORRECTION_001.json "$RUNNER_TEMP/unit003-first-seal/"
          cp experiments/unit003-blind-machine-first/RUN_FREEZE_CORRECTION_002.json "$RUNNER_TEMP/unit003-first-seal/"
          cp experiments/unit003-blind-machine-first/RUN_FREEZE_CORRECTION_003.json "$RUNNER_TEMP/unit003-first-seal/"
          cp experiments/unit003-blind-machine-first/RUN_FREEZE_CORRECTION_004.json "$RUNNER_TEMP/unit003-first-seal/"
          cp experiments/unit003-blind-machine-first/EXECUTION_ATTEMPTS.json "$RUNNER_TEMP/unit003-first-seal/"

      - name: Enforce predeclared E0 structural refinement ceiling
        run: |
          python - <<'PY'
          import json, pathlib
          freeze = json.loads(pathlib.Path('experiments/unit003-blind-machine-first/RUN_FREEZE.json').read_text())
          s = freeze['structural_audit_before_target_content']
          assert s['first_prediction_target_discriminative'] is False
          assert s['machine_semantic_upgrade_ingestion_path_present'] is False
          assert s['post_first_seal_rule'] == 'STOP_E0_AT_STRUCTURAL_REFINEMENT_CEILING_WITHOUT_HUMAN_TRANSLATION'
          print(json.dumps({'status':'PASS','classification':'STRUCTURAL_REFINEMENT_CEILING_PREDECLARED','human_probe_translation_used':False}, sort_keys=True))
          PY

      - name: Upload immutable first-seal archive
        uses: actions/upload-artifact@v4
        with:
          name: unit003-e0-first-seal-${{ github.sha }}
          path: ${{ runner.temp }}/unit003-first-seal
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
