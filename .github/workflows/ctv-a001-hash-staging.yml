name: CTV A001 hash staging

on:
  push:
    branches: [ctv-meta-theory-amendment001]
    paths:
      - protocols/CTV_META_THEORY_v0.1_AMENDMENT_001.json
      - docs/CONSEQUENCE_TRANSLATION_VALIDATION_v0.1_AMENDMENT_001.md
      - .github/workflows/ctv-a001-hash-staging.yml

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exact SHA-256
        run: |
          sha256sum protocols/CTV_META_THEORY_v0.1_AMENDMENT_001.json
          sha256sum docs/CONSEQUENCE_TRANSLATION_VALIDATION_v0.1_AMENDMENT_001.md
