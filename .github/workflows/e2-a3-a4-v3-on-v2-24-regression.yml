name: E2 A3 A4 v0.3 on Frozen v0.2 24 Regression

on:
  push:
    paths:
      - 'tools/e2_a3_a4_v3_on_v2_24_regression_primary.py'
      - 'tools/e2_a3_a4_v3_on_v2_24_regression_independent.py'
      - 'experiments/risu-diff-e2/qualification/a3-a4/candidate-observability/remediation-v0.3/regression-v0.2-24/E2_A3_A4_V0_3_ON_FROZEN_V0_2_24_REGRESSION_PROTOCOL.json'
      - '.github/workflows/e2-a3-a4-v3-on-v2-24-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact regression revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 16

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Verify frozen authorities and adapter-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/risu-diff-e2/qualification/a3-a4/candidate-observability/remediation-v0.3/regression-v0.2-24/E2_A3_A4_V0_3_ON_FROZEN_V0_2_24_REGRESSION_PROTOCOL.json)" = "1433c5d8cfa2ddfb32129552c672c3e1877e44ef"
          test "$(git hash-object experiments/risu-diff-e2/qualification/a3-a4/candidate-observability/remediation-v0.2/E2_A3_A4_CANDIDATE_OBSERVABILITY_REMEDIATION_V0_2_MICROQUALIFICATION_CORPUS.json)" = "a0036c02826d54ac9ac22501b7eb341a600d1607"
          test "$(git hash-object tools/e2_a3_a4_candidate_observability_remediation_v2_qualify.py)" = "76c709696d28eece105eaf7c023cad6fdb02aced"
          test "$(git hash-object tools/e2_a3_a4_candidate_observability_remediation_v2_independent.py)" = "cb5c16fcaadf88054e82e576781b8b53229d3bd4"

          test "$(git hash-object risu_e2/frontend_js_v3.py)" = "13ffb1b149150b7e730591de7acf47e9322bdf02"
          test "$(git hash-object risu_e2/frontend_python_v2.py)" = "8b7e4d0e2bb9ef6487ef2b90d2390b55ced55ea9"
          test "$(git hash-object risu_e2/ir_v3.py)" = "1d95cfcb2e76563aa5d3ceb65815043eb8b2884a"
          test "$(git hash-object tools/e2_a3_a4_v3_on_v2_24_regression_primary.py)" = "b91c1d3a62ff93e50380e29113e5ef0b20fb51c4"
          test "$(git hash-object tools/e2_a3_a4_v3_on_v2_24_regression_independent.py)" = "cc2290599861664750ba1bdd06f6a066acc1cbf5"

          mapfile -t delta < <(git diff --name-only cfbfc549d7ce56ea48383483b135dee7ec3255aa HEAD)
          test "${#delta[@]}" -eq 4
          for p in "${delta[@]}"; do
            case "$p" in
              tools/e2_a3_a4_v3_on_v2_24_regression_primary.py|tools/e2_a3_a4_v3_on_v2_24_regression_independent.py|experiments/risu-diff-e2/qualification/a3-a4/candidate-observability/remediation-v0.3/regression-v0.2-24/E2_A3_A4_V0_3_ON_FROZEN_V0_2_24_REGRESSION_PROTOCOL.json|.github/workflows/e2-a3-a4-v3-on-v2-24-regression.yml) ;;
              *) echo "unauthorized post-v0.3-freeze regression delta: $p"; exit 1 ;;
            esac
          done

      - name: Compile independent regression adapters
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/e2_a3_a4_v3_on_v2_24_regression_primary.py tools/e2_a3_a4_v3_on_v2_24_regression_independent.py
          ! grep -q 'e2_a3_a4_v3_on_v2_24_regression_primary' tools/e2_a3_a4_v3_on_v2_24_regression_independent.py

      - name: Run sealed first complete frozen-v0.2-24 regression
        shell: bash
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/v3-on-v2-24-regression"
          mkdir -p "$S/risu_e2" "$S/tools" "$S/input" "$S/output"

          cp risu_e2/__init__.py "$S/risu_e2/"
          cp risu_e2/model.py "$S/risu_e2/"
          cp risu_e2/acquisition.py "$S/risu_e2/"
          cp risu_e2/frontend_go.py "$S/risu_e2/"
          cp risu_e2/frontend_python.py "$S/risu_e2/"
          cp risu_e2/frontend_js.py "$S/risu_e2/"
          cp risu_e2/frontend_python_v2.py "$S/risu_e2/"
          cp risu_e2/frontend_js_v3.py "$S/risu_e2/"
          cp risu_e2/ir.py "$S/risu_e2/"
          cp risu_e2/ir_v3.py "$S/risu_e2/"
          cp risu_e2/overlay_common.py "$S/risu_e2/"
          cp risu_e2/overlay_control.py "$S/risu_e2/"
          cp tools/e2_a3_a4_v3_on_v2_24_regression_primary.py "$S/tools/primary.py"
          cp tools/e2_a3_a4_v3_on_v2_24_regression_independent.py "$S/tools/independent.py"
          cp tools/e2_go_ir_extract.go "$S/tools/e2_go_ir_extract.go"
          cp experiments/risu-diff-e2/qualification/a3-a4/candidate-observability/remediation-v0.3/regression-v0.2-24/E2_A3_A4_V0_3_ON_FROZEN_V0_2_24_REGRESSION_PROTOCOL.json "$S/input/protocol.json"
          cp experiments/risu-diff-e2/qualification/a3-a4/candidate-observability/remediation-v0.2/E2_A3_A4_CANDIDATE_OBSERVABILITY_REMEDIATION_V0_2_MICROQUALIFICATION_CORPUS.json "$S/input/corpus.json"

          test "$(find "$S" -type f | wc -l)" -eq 17
          ! find "$S" -type f -print | grep -E 'candidate.*58|blind.*58|frozen.*48|truth|operator|prediction'

          trap 'chmod u+rwx "$GITHUB_WORKSPACE" || true' EXIT
          chmod a-rwx "$GITHUB_WORKSPACE"
          cd "$S"
          export PYTHONPATH="$S"

          python tools/primary.py --protocol input/protocol.json --corpus input/corpus.json --scientific-root "$S" --go-helper tools/e2_go_ir_extract.go --output output/primary-1.json
          python tools/primary.py --protocol input/protocol.json --corpus input/corpus.json --scientific-root "$S" --go-helper tools/e2_go_ir_extract.go --output output/primary-2.json
          cmp output/primary-1.json output/primary-2.json

          python tools/independent.py --protocol input/protocol.json --corpus input/corpus.json --scientific-root "$S" --output output/independent-1.json
          python tools/independent.py --protocol input/protocol.json --corpus input/corpus.json --scientific-root "$S" --output output/independent-2.json
          cmp output/independent-1.json output/independent-2.json

          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=json.loads(Path('output/primary-1.json').read_bytes()); i=json.loads(Path('output/independent-1.json').read_bytes())
          pm={r['fixture_id']:(r['passed'],r['abstract_signature']) for r in p['rows']}; im={r['fixture_id']:(r['passed'],r['abstract_signature']) for r in i['rows']}
          doc={'schema':'risu.e2-a3-a4-v0.3-on-frozen-v0.2-24-cross-check/v0.1','case_count':24,'claim_scope':'NON_PROSPECTIVE_REGRESSION_ONLY','same_fixture_set':sorted(pm)==sorted(im),'exact_per_case_and_signature_agreement':pm==im,'primary_status':p['status'],'independent_status':i['status'],'primary_variant_errors':p['variant_errors'],'independent_variant_pair_failures':i['variant_pair_failures'],'primary_sha256':hashlib.sha256(Path('output/primary-1.json').read_bytes()).hexdigest(),'independent_sha256':hashlib.sha256(Path('output/independent-1.json').read_bytes()).hexdigest(),'frozen_48_bytes_read':False,'candidate_58_bytes_read':False,'semantic_verdicts_emitted':False}
          doc['status']='PASS' if doc['same_fixture_set'] and doc['exact_per_case_and_signature_agreement'] else 'FAIL'
          Path('output/cross-check.json').write_text(json.dumps(doc,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps(doc,sort_keys=True,separators=(',',':')))
          PY

          chmod u+rwx "$GITHUB_WORKSPACE"
          cp output/primary-1.json "$GITHUB_WORKSPACE/E2_A3_A4_V3_ON_V2_24_PRIMARY.json"
          cp output/independent-1.json "$GITHUB_WORKSPACE/E2_A3_A4_V3_ON_V2_24_INDEPENDENT.json"
          cp output/cross-check.json "$GITHUB_WORKSPACE/E2_A3_A4_V3_ON_V2_24_CROSS_CHECK.json"

      - name: Upload first complete v0.2-24 regression output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-a3-a4-v3-on-v2-24-first-complete-regression
          path: |
            E2_A3_A4_V3_ON_V2_24_PRIMARY.json
            E2_A3_A4_V3_ON_V2_24_INDEPENDENT.json
            E2_A3_A4_V3_ON_V2_24_CROSS_CHECK.json
          if-no-files-found: warn
          retention-days: 30

      - name: Assert regression gate only after artifact upload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('E2_A3_A4_V3_ON_V2_24_PRIMARY.json')); i=json.load(open('E2_A3_A4_V3_ON_V2_24_INDEPENDENT.json')); c=json.load(open('E2_A3_A4_V3_ON_V2_24_CROSS_CHECK.json'))
          assert p['case_count']==i['case_count']==24
          assert p['passed_case_count']==i['passed_case_count']==24
          assert p['status']==i['status']==c['status']=='PASS'
          assert not p['failed_fixture_ids'] and not i['failed_fixture_ids']
          assert not p['variant_errors'] and not i['variant_pair_failures']
          assert p['specialization_scan']['status']==i['specialization_scan']['status']=='PASS'
          assert c['exact_per_case_and_signature_agreement'] is True
          assert p['read_set_attestation']['frozen_48_bytes'] is False and i['read_set_attestation']['frozen_48_bytes'] is False
          assert p['read_set_attestation']['candidate_58_bytes'] is False and i['read_set_attestation']['candidate_58_bytes'] is False
          PY
