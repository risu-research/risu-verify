name: Public statutory eligibility proxy validation
on:
  push:
    paths:
      - 'tools/public_eligibility_criteria_check.py'
      - '.github/workflows/public-eligibility-criteria-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/public_eligibility_criteria_check.py
