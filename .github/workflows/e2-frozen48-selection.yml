name: E2 Frozen 48 Metadata Selection

on:
  push:
    branches: [e2-development]
    paths:
      - tools/e2_frozen48_metadata_select.py
      - .github/workflows/e2-frozen48-selection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch selector only without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REV: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, urllib.request
          url = f"https://raw.githubusercontent.com/{os.environ['REPO']}/{os.environ['REV']}/tools/e2_frozen48_metadata_select.py"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "User-Agent": "risu-frozen48-selection-workflow"})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = r.read()
          open('/tmp/e2_frozen48_metadata_select.py','wb').write(data)
          print(f"selector_bytes={len(data)}")
          PY

      - name: Derive metadata-only exact frozen-48 selection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 /tmp/e2_frozen48_metadata_select.py --output /tmp/E2_A3_A4_FROZEN_48_SELECTION_MANIFEST.json

      - name: Upload exact selection manifest
        uses: actions/upload-artifact@v4
        with:
          name: e2-frozen48-metadata-selection
          path: /tmp/E2_A3_A4_FROZEN_48_SELECTION_MANIFEST.json
          if-no-files-found: error
          retention-days: 90
