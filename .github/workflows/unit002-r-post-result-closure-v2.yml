name: RISU Unit 002-R adversarial post-result closure v2

on:
  push:
    branches:
      - unit002-r-post-result-closure-v2

permissions:
  contents: write

jobs:
  close-v2:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SCIENTIFIC_REPO: "${{ github.workspace }}/scientific"
    steps:
      - name: Checkout exact scientific result-freeze state
        uses: actions/checkout@v4
        with:
          repository: risu-research/risu-verify
          ref: b52bde0d0fdef0a2be7d5973e564daccd12296c9
          fetch-depth: 0
          path: scientific

      - name: Checkout disposable closure orchestrator
        uses: actions/checkout@v4
        with:
          repository: risu-research/risu-verify
          ref: unit002-r-post-result-closure-v2
          fetch-depth: 0
          path: orchestrator
          persist-credentials: false

      - name: Static-compile orchestrator and checked wrapper before touching scientific tree
        run: |
          set -euo pipefail
          python -m py_compile orchestrator/tools/unit002r_closure_apply_v2.py
          python -m py_compile orchestrator/tools/unit002r_closure_apply_v3.py
          test "$(git -C scientific rev-parse HEAD)" = "b52bde0d0fdef0a2be7d5973e564daccd12296c9"
          test -z "$(git -C scientific status --porcelain)"

      - name: Apply, validate twice, commit, and fast-forward closure candidate
        run: |
          set -euo pipefail
          python orchestrator/tools/unit002r_closure_apply_v3.py
