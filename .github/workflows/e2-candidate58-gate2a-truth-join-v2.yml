name: E2 Candidate58 Gate2A Truth Join v2

on:
  push:
    branches: [e2-development]
    paths:
      - ".github/workflows/e2-candidate58-gate2a-truth-join-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  GATE2A_V2_PARENT: f4f6a563e4c3dbbac52be0568cd95b411139b537
  MACHINE_FREEZE: 2ece1023252a8e9100a34d74079493040441e1e2
  MACHINE_SHA256: 7273ce4034d06e67989a33540f5b22fef3190cf311a8981474413b538e43472d
  EXPANDED_SHA256: afd681d308a6f4ec8c183edd9b139c6b914fe501936cf84e5845a6a1c0d6b7cb
  ADMISSION_SHA256: 847d85c2274cd6b94a83eefe0f6153a8fb183dbad758efa75118a4fd368623e4
  POSTFREEZE_TRANSPORT_SHA256: bbc7d72fded307b23f6e0d20609b85662e63013cc06cd05b0c3c30269ba71749

jobs:
  first-complete-gate2a-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact v2 orchestration revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 12

      - name: Prove frozen lineage and v2 correction boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$GATE2A_V2_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/e2-candidate58-gate2a-truth-join-v2.yml"
          test "$(git rev-parse "$MACHINE_FREEZE:experiments/risu-diff-e2/qualification/candidate58/first-complete-machine/E2_CANDIDATE58_FIRST_COMPLETE_MACHINE_PREDICTION_MATRIX.json")" = "60b27d641682693cb3df654d8aa4f064cc48455d"
          test "$(git hash-object protocols/RISU_DIFF_E2_CANDIDATE58_GATE2A_TRUTH_JOIN_PROTOCOL_v0.1.json)" = "1ba7117818fe2f8efe568d7c67ae50a3dba77f65"
          test "$(git hash-object tools/e2_candidate58_gate2a_truth_join.py)" = "f6645926d60a7029388b0f78a03115b7a4649c09"
          test "$(git hash-object tools/e2_candidate58_gate2a_truth_join_v2.py)" = "9eed33c52db0cd4af4def5ed61edd3ca05bd0ba0"
          test "$(git hash-object protocols/RISU_DIFF_E2_CANDIDATE58_GATE2A_TRUTH_JOIN_IMPLEMENTATION_FREEZE_v0.1.json)" = "d91d41f3276481f3cd1859ed7b898d8256774989"
          test "$(git hash-object protocols/RISU_DIFF_E2_CANDIDATE58_GATE2A_TRUTH_JOIN_IMPLEMENTATION_FREEZE_v0.1.1.json)" = "5f75727c54d0b3a503e6e6d1b8fb8cb7b435fcbf"
          test "$(git hash-object experiments/risu-diff-e2/qualification/TRUTH_ORACLE_CONTRACT.json)" = "98e53e13472c9d1287c3114734464994a6693778"
          test "$(git hash-object tools/e2_mutation_truth_oracle.py)" = "1e5fe69f302df6fdd367797649b17eb3c4ea5950"
          test "$(git hash-object experiments/risu-diff-e2/qualification/MUTATION_QUALIFICATION_MATRIX.json)" = "b6d7d9c4d172a6e38ab59e93ae9748fafefc9fd0"
          test "$(git hash-object experiments/risu-diff-e2/qualification/MUTATION_QUALIFICATION_MATRIX_EXPANDED.jsonl)" = "0ab0c31377d7e03bc279943af151c687f51ffc93"
          test "$(git hash-object experiments/risu-diff-e2/qualification/anchor-transport/admission/E2_SANITIZED_OPAQUE_58_ADMISSION_MANIFEST.json)" = "f2fc78439d4bfadce5941bf71aadd15ec292bcb1"
          test "$(git rev-parse HEAD:experiments/risu-diff-e2/qualification/materialized/cells)" = "34a30574c7420728bff57958c815194979a622ab"
          echo "$MACHINE_SHA256  experiments/risu-diff-e2/qualification/candidate58/first-complete-machine/E2_CANDIDATE58_FIRST_COMPLETE_MACHINE_PREDICTION_MATRIX.json" | sha256sum -c -
          echo "$EXPANDED_SHA256  experiments/risu-diff-e2/qualification/MUTATION_QUALIFICATION_MATRIX_EXPANDED.jsonl" | sha256sum -c -
          echo "$ADMISSION_SHA256  experiments/risu-diff-e2/qualification/anchor-transport/admission/E2_SANITIZED_OPAQUE_58_ADMISSION_MANIFEST.json" | sha256sum -c -
          echo "$POSTFREEZE_TRANSPORT_SHA256  experiments/risu-diff-e2/qualification/anchor-transport/postfreeze/E2_POSTFREEZE_TRANSPORT_QUALIFICATION.json" | sha256sum -c -
          python - <<'PY'
          import subprocess
          expected={
            'protocols/RISU_DIFF_E2_CANDIDATE58_GATE2A_TRUTH_JOIN_PROTOCOL_v0.1.json',
            'tools/e2_candidate58_gate2a_truth_join.py',
            'protocols/RISU_DIFF_E2_CANDIDATE58_GATE2A_TRUTH_JOIN_IMPLEMENTATION_FREEZE_v0.1.json',
            '.github/workflows/e2-candidate58-gate2a-truth-join.yml',
            'tools/e2_candidate58_gate2a_truth_join_v2.py',
            'protocols/RISU_DIFF_E2_CANDIDATE58_GATE2A_TRUTH_JOIN_IMPLEMENTATION_FREEZE_v0.1.1.json',
            '.github/workflows/e2-candidate58-gate2a-truth-join-v2.yml',
          }
          names=set(subprocess.check_output(['git','diff','--name-only','2ece1023252a8e9100a34d74079493040441e1e2..HEAD'],text=True).splitlines())
          assert names==expected, (names, expected)
          print('POST_MACHINE_V2_CHANGE_FIREWALL=PASS')
          PY

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.5"

      - name: Independently preflight frozen truth oracle without machine input
        shell: bash
        run: |
          set -euo pipefail
          python tools/e2_mutation_truth_oracle.py > "$RUNNER_TEMP/truth-oracle-preflight.json"
          python - <<'PY'
          import json, os, platform
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'truth-oracle-preflight.json'
          x=json.loads(p.read_text())
          assert platform.python_version()=='3.13.5'
          assert x['status']=='PASS' and x['cell_count']==58 and x['seed_count']==6
          assert x['e2_prediction_consumed'] is False
          assert x['matrix_sha256']=='afd681d308a6f4ec8c183edd9b139c6b914fe501936cf84e5845a6a1c0d6b7cb'
          print('TRUTH_ORACLE_PREFLIGHT=PASS_NO_MACHINE_INPUT')
          PY

      - name: Execute first deterministic Gate2A v2 join
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate2a/replay1"
          python tools/e2_candidate58_gate2a_truth_join_v2.py --output-dir "$RUNNER_TEMP/gate2a/replay1"
          test "$(find "$RUNNER_TEMP/gate2a/replay1" -maxdepth 1 -type f | wc -l)" -eq 4
          (cd "$RUNNER_TEMP/gate2a/replay1" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/gate2a/replay1.logical-tree.sha256"

      - name: Execute mandatory second deterministic Gate2A v2 join
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate2a/replay2"
          python tools/e2_candidate58_gate2a_truth_join_v2.py --output-dir "$RUNNER_TEMP/gate2a/replay2"
          test "$(find "$RUNNER_TEMP/gate2a/replay2" -maxdepth 1 -type f | wc -l)" -eq 4
          (cd "$RUNNER_TEMP/gate2a/replay2" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/gate2a/replay2.logical-tree.sha256"

      - name: Require exact logical byte identity and mapping integrity
        shell: bash
        run: |
          set -euo pipefail
          cmp "$RUNNER_TEMP/gate2a/replay1.logical-tree.sha256" "$RUNNER_TEMP/gate2a/replay2.logical-tree.sha256"
          diff -qr "$RUNNER_TEMP/gate2a/replay1" "$RUNNER_TEMP/gate2a/replay2"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=Path(os.environ['RUNNER_TEMP'])/'gate2a/replay1'
          rec=json.loads((r/'E2_CANDIDATE58_GATE2A_JOIN_RECEIPT.json').read_text())
          met=json.loads((r/'E2_CANDIDATE58_GATE2A_METRICS.json').read_text())
          led=json.loads((r/'E2_CANDIDATE58_GATE2A_JOINED_LEDGER.json').read_text())
          mapping=json.loads((r/'E2_CANDIDATE58_GATE2A_SOURCE_IDENTITY_VIEW_RECEIPT.json').read_text())
          assert rec['status']=='FIRST_COMPLETE_GATE2A_TRUTH_JOIN_LOGICAL_OUTPUT'
          assert led['case_count']==58 and len(led['rows'])==58
          assert met['population']=={'all':58,'semantic':48,'M_PLUS':24,'M_ZERO':24,'M_QUESTION':10}
          assert mapping['status']=='PASS_UNIQUE_ADMISSION_HASH_PER_Q'
          assert mapping['q_count']==58 and mapping['admission_hash_count']==58 and mapping['consumed_admission_hash_count']==58
          assert mapping['multi_source_directory_count']==1
          assert mapping['total_noncandidate_source_like_file_count']==1
          assert mapping['cell_json_read_for_mapping'] is False
          assert mapping['truth_or_operator_used_for_mapping'] is False
          assert mapping['machine_prediction_used_for_mapping'] is False
          assert rec['scientific_firewall']=={
            'semantic_engine_rerun':False,
            'c1_checker_rerun':False,
            'machine_matrix_modified':False,
            'truth_modified':False,
            'fresh_heldout_read':False,
            'outcome_driven_case_exclusion':False,
            'outcome_driven_metric_or_denominator_change':False,
          }
          print('GATE2A_V2_TWO_REPLAY_LOGICAL_BYTE_IDENTITY=PASS')
          PY

      - name: Upload both exact Gate2A v2 replays before repository freeze
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-candidate58-gate2a-first-complete-dual-replay-v2
          path: |
            ${{ runner.temp }}/gate2a/replay1
            ${{ runner.temp }}/gate2a/replay2
            ${{ runner.temp }}/gate2a/replay1.logical-tree.sha256
            ${{ runner.temp }}/gate2a/replay2.logical-tree.sha256
            ${{ runner.temp }}/truth-oracle-preflight.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false

      - name: Materialize exact first-complete Gate2A repository freeze payload
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/gate2a/replay1"
          D="experiments/risu-diff-e2/qualification/candidate58/gate2a-first-complete-truth-join"
          test ! -e "$D"
          mkdir -p "$D"
          cp "$SRC/E2_CANDIDATE58_GATE2A_JOINED_LEDGER.json" "$D/"
          cp "$SRC/E2_CANDIDATE58_GATE2A_METRICS.json" "$D/"
          cp "$SRC/E2_CANDIDATE58_GATE2A_JOIN_RECEIPT.json" "$D/"
          cp "$SRC/E2_CANDIDATE58_GATE2A_SOURCE_IDENTITY_VIEW_RECEIPT.json" "$D/"
          cp "$RUNNER_TEMP/gate2a/replay1.logical-tree.sha256" "$D/E2_CANDIDATE58_GATE2A_LOGICAL_TREE.sha256"
          export D ARTIFACT_ID ARTIFACT_DIGEST
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          d=Path(os.environ['D'])
          h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          freeze={
            'schema':'risu.e2-candidate58-gate2a-first-complete-immutable-freeze/v0.1',
            'status':'FIRST_COMPLETE_GATE2A_TRUTH_JOIN_IMMUTABLY_FROZEN_BY_CONTAINING_COMMIT',
            'repository':'risu-research/risu-verify',
            'branch':'e2-development',
            'workflow_trigger_commit':os.environ['GITHUB_SHA'],
            'workflow_run_id':os.environ['GITHUB_RUN_ID'],
            'workflow_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'hosted_artifact_id':os.environ['ARTIFACT_ID'],
            'hosted_artifact_digest':os.environ['ARTIFACT_DIGEST'],
            'first_complete_machine_freeze_commit':'2ece1023252a8e9100a34d74079493040441e1e2',
            'gate2a_protocol_git_blob':'1ba7117818fe2f8efe568d7c67ae50a3dba77f65',
            'gate2a_v1_joiner_git_blob':'f6645926d60a7029388b0f78a03115b7a4649c09',
            'gate2a_v2_source_identity_wrapper_git_blob':'9eed33c52db0cd4af4def5ed61edd3ca05bd0ba0',
            'gate2a_v2_implementation_freeze_git_blob':'5f75727c54d0b3a503e6e6d1b8fb8cb7b435fcbf',
            'machine_matrix_sha256':'7273ce4034d06e67989a33540f5b22fef3190cf311a8981474413b538e43472d',
            'joined_ledger_sha256':h(d/'E2_CANDIDATE58_GATE2A_JOINED_LEDGER.json'),
            'metrics_sha256':h(d/'E2_CANDIDATE58_GATE2A_METRICS.json'),
            'join_receipt_sha256':h(d/'E2_CANDIDATE58_GATE2A_JOIN_RECEIPT.json'),
            'source_identity_view_receipt_sha256':h(d/'E2_CANDIDATE58_GATE2A_SOURCE_IDENTITY_VIEW_RECEIPT.json'),
            'logical_tree_manifest_sha256':h(d/'E2_CANDIDATE58_GATE2A_LOGICAL_TREE.sha256'),
            'two_replay_logical_byte_identity':True,
            'case_count':58,
            'semantic_or_harness_code_modified_after_machine_freeze':False,
            'fresh_heldout_opened':False,
            'first_attempt_preserved_as_preoutput_plumbing_failure':True,
            'immutability_rule':{
              'this_first_complete_gate2a_result_may_not_be_replaced':True,
              'later_diagnostics_and_remediation_must_be_additive':True,
              'machine_first_complete_bundle_remains_immutable':True,
            },
          }
          raw=(json.dumps(freeze,sort_keys=True,separators=(',',':'))+'\n').encode()
          (d/'E2_CANDIDATE58_GATE2A_FIRST_COMPLETE_IMMUTABLE_FREEZE_RECEIPT.json').write_bytes(raw)
          PY
          echo "$MACHINE_SHA256  experiments/risu-diff-e2/qualification/candidate58/first-complete-machine/E2_CANDIDATE58_FIRST_COMPLETE_MACHINE_PREDICTION_MATRIX.json" | sha256sum -c -

      - name: Create one immutable Gate2A result commit and push fast-forward only
        shell: bash
        run: |
          set -euo pipefail
          D="experiments/risu-diff-e2/qualification/candidate58/gate2a-first-complete-truth-join"
          git config user.name "risu-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- "$D"
          python - <<'PY'
          import subprocess
          prefix='experiments/risu-diff-e2/qualification/candidate58/gate2a-first-complete-truth-join/'
          expected={
            prefix+'E2_CANDIDATE58_GATE2A_JOINED_LEDGER.json',
            prefix+'E2_CANDIDATE58_GATE2A_METRICS.json',
            prefix+'E2_CANDIDATE58_GATE2A_JOIN_RECEIPT.json',
            prefix+'E2_CANDIDATE58_GATE2A_SOURCE_IDENTITY_VIEW_RECEIPT.json',
            prefix+'E2_CANDIDATE58_GATE2A_LOGICAL_TREE.sha256',
            prefix+'E2_CANDIDATE58_GATE2A_FIRST_COMPLETE_IMMUTABLE_FREEZE_RECEIPT.json',
          }
          names=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert names==expected, (names, expected)
          print('GATE2A_V2_FREEZE_COMMIT_DELTA_FIREWALL=PASS')
          PY
          git fetch origin e2-development --depth=1
          test "$(git rev-parse origin/e2-development)" = "$GITHUB_SHA"
          git commit -m "Freeze first complete Candidate58 Gate2A truth join"
          FREEZE_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:e2-development
          echo "GATE2A_FIRST_COMPLETE_FREEZE_COMMIT=$FREEZE_SHA"

      - name: Post-push immutable-boundary verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin e2-development --depth=1
          test "$(git rev-parse origin/e2-development)" = "$(git rev-parse HEAD)"
          test "$(git show HEAD:experiments/risu-diff-e2/qualification/candidate58/first-complete-machine/E2_CANDIDATE58_FIRST_COMPLETE_MACHINE_PREDICTION_MATRIX.json | sha256sum | awk '{print $1}')" = "$MACHINE_SHA256"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | grep -v '^$' | wc -l)" -eq 6
          echo "GATE2A_FIRST_COMPLETE_REPOSITORY_FREEZE=PASS"
