name: Public independent-year selection validation
on:
  push:
    paths:
      - 'tools/public_regulatory_population_holdout.py'
      - '.github/workflows/public-selection-holdout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/public_regulatory_population_holdout.py
