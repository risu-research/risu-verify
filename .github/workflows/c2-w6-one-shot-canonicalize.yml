name: C2 W6 One-Shot Canonicalize
on:
  push:
    branches: [k1-closure-c2-bounded-proof]
    paths: ['.github/workflows/c2-w6-one-shot-canonicalize.yml']
permissions:
  contents: write
jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: k1-closure-c2-bounded-proof
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Canonicalize exact W6 source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('kernel/k1_checker_w6.go')
          s=p.read_text()
          s=s.replace(r'`^(?:[0-9a-f]{2})+$`', r'`^([0-9a-f]{2})+$`')
          p.write_text(s)
          PY
          gofmt -w kernel/k1_checker_w6.go
          go vet kernel/k1_checker_w6.go
          go build -o /tmp/k1-checker-w6 kernel/k1_checker_w6.go
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kernel/k1_checker_w6.go
          git diff --cached --quiet && exit 0
          git commit -m 'Canonicalize C2 W6 Go source'
          git push origin HEAD:k1-closure-c2-bounded-proof
