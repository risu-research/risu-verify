name: E2 A1-A2 Qualification

on:
  push:
    branches:
      - e2-development
    paths:
      - "risu_e2/**"
      - "tools/e2_acquire_ir.py"
      - "tools/e2_go_ir_extract.go"
      - "tools/e2_a1_a2_qualify.py"
      - "protocols/RISU_DIFF_E2_A1_A2_IMPLEMENTATION_CONTRACT_v0.1.json"
      - ".github/workflows/e2-a1-a2-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.2"

      - name: Static compile
        run: |
          python -m py_compile risu_e2/*.py tools/e2_acquire_ir.py tools/e2_a1_a2_qualify.py
          gofmt -d tools/e2_go_ir_extract.go
          test -z "$(gofmt -d tools/e2_go_ir_extract.go)"

      - name: Run frozen A1-A2 qualification
        run: |
          set -o pipefail
          python tools/e2_a1_a2_qualify.py | tee E2_A1_A2_QUALIFICATION.json

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-a1-a2-qualification
          path: E2_A1_A2_QUALIFICATION.json
          if-no-files-found: error
          retention-days: 30
